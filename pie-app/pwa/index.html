      return '<button class="t" data-act="rmphoto" data-id="' + esc(o.id) + '" aria-label="Foto sin enviar. Tocá para quitarla.">' +
        (S.thumbs[o.id] ? '<img src="' + esc(S.thumbs[o.id]) + '" alt="" loading="lazy" decoding="async">' : ic('image')) +
        '<i>' + ic(o.status === 'error' ? 'alert' : 'clock') + '</i></button>';
    })).join('');
  }

  /* ================================================================
   *  Comunicación con Apps Script
   * ================================================================ */
  function apiError(msg, code) { var e = new Error(msg); e.code = code || 'error'; return e; }
  /* Errores en palabras de obra (§7.8): se traducen acá por code; Code.gs no se toca. */
  var ERR = {
    noUrl: 'Falta el enlace de la app. Pegalo en Ajustes › Conexión.',
    notJson: 'El enlace no responde como la app PIE. En Apps Script, la implementación tiene que tener acceso «Cualquier persona».',
    network: 'No hay conexión con el PIE (señal débil). Tus cambios quedan en el celular y se envían solos.',
    server: 'El PIE no respondió. Probá de nuevo en un rato; lo cargado queda en el celular.',
    auth: 'La clave de acceso no coincide. Copiala del PIE (menú PIE › Ver enlace de la app) en Ajustes › Conexión.',
    busy: 'El PIE está ocupado con otro envío. Se reintenta solo.',
    badRequest: 'Error interno de la app. Tu carga queda guardada en el celular; avisá a quien mantiene la app.',
    conflict: 'No encontré el registro en la planilla: puede que se hayan movido filas. Revisá la fila en el PIE y reintentá.',
    photoLost: 'La foto se borró del celular antes de enviarse. Descartala y sacala de nuevo.'
  };
  /** Respuesta del PIE con ok:false → error con el texto traducido. */
  function apiFail(r) {
    var code = (r && r.code) || 'error', msg = r && r.error;
    if (code === 'auth') msg = ERR.auth;
    else if (code === 'busy') msg = ERR.busy;
    else if (code === 'bad_request') msg = ERR.badRequest;
    else if (!msg || msg === 'Error del servidor') msg = ERR.server;
    return apiError(msg, code);
  }
  /** Error de una operación del lote; null si el texto del PIE ya alcanza. */
  function opErrText(r, op) {
    if (r.code === 'bad_request') return r.error || ERR.badRequest;
    if (r.code === 'conflict' && (op.op === 'create' || op.op === 'update')) return ERR.conflict;
    return null;
  }

  function callApi(req) {
    req.token = S.settings.token || '';
    if (IN_GAS) {
      return new Promise(function (res, rej) {
        google.script.run
          .withSuccessHandler(function (r) { r && r.ok ? res(r) : rej(apiFail(r)); })
          .withFailureHandler(function () { rej(apiError(ERR.network, 'network')); })
          .api(req);
      });
    }
    var url = (S.settings.apiUrl || '').trim();
    if (!url) return Promise.reject(apiError(ERR.noUrl, 'config'));
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 90000);
    var p;
    // todo por POST: la clave nunca viaja en la URL
    p = fetch(url, {
      method: 'POST', redirect: 'follow', signal: ctl && ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(req)
    });
    return p.then(function (r) {
      return r.text().then(function (txt) {
        var data;
        try { data = JSON.parse(txt); } catch (e) {
          throw apiError(ERR.notJson, 'config');
        }
        if (!data || !data.ok) throw apiFail(data);
        return data;
      });
    }).catch(function (e) {
      if (e && e.code) throw e;
      throw apiError(ERR.network, 'network');
    }).then(function (data) {
      clearTimeout(t);
      return data;
    }, function (e) {
      clearTimeout(t);
      throw e;
    });
  }

  function mergeCategories(cats) {
    if (!S.catalog || !cats) return;
    cats.forEach(function (c) {
      var i = S.catalog.categorias.findIndex(function (x) { return x.sheet === c.sheet; });
      if (i >= 0) S.catalog.categorias[i] = c; else S.catalog.categorias.push(c);
    });
    KV.set('catalog', S.catalog).catch(function () { /* se vuelve a descargar */ });
  }

  /** Hay un formulario o campo en edición que un re-render borraría. */
  function isEditing() {
    // eligiendo una foto (Cámara o Galería): redibujar reemplazaría el campo y la foto se perdería
    if (S.ui.picking && Date.now() - S.ui.picking < 60000) return true;
    // Ajustes se vuelve a dibujar al terminar un envío (la lista de envíos queda al día), salvo con la
    // conexión a medio escribir
    if (S.route === '/ajustes' && cfgDirty()) return true;
    if (!S.catalog) return false;
    if (/\/nuevo$/.test(S.route)) return true;
    if (document.getElementById('hdrForm')) return true;
    var a = document.activeElement;
    return !!(a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'search');
  }

  function stripOp(o) {
    var c = {};
    Object.keys(o).forEach(function (k) {
      if (['snapshot', 'status', 'error', 'createdAt', 'slots', 'docDefault', 'img', 'sent'].indexOf(k) < 0) c[k] = o[k];
    });
    return c;
  }
  /** Aviso del PIE en palabras de obra (§7.8). */
  function warnText(w) {
    var m = /No se encontró el criterio "(.+)"/.exec(String(w));
    return m ? 'El control «' + m[1] + '» ya no está en la planilla; el resto se guardó.' : 'Aviso del PIE: ' + w;
  }
  /*
   * Resultado de un envío (§6.12): lo que sale bien no genera aviso (la confirmación es el indicador
   * «Al día»). Sí avisan los errores, los avisos del PIE y el número de una FUM nueva.
   */
  function handleResults(res) {
    var errors = [];
    var fumNums = [];
    res.results.forEach(function (r) {
      var op = S.queue.filter(function (o) { return o.id === r.id; })[0];
      if (!op) return;
      if (r.ok) {
        if (op.op === 'create') S.resolved[op.id] = { sheet: r.sheet || op.sheet, h: r.h };
        if (op.op === 'photo') photoForget(op);
        (r.warnings || []).forEach(function (w) { toast(warnText(w), { kind: 'warn' }); });
        if (op.op === 'fum' && op.accion === 'abrir' && r.fum != null && !r.dup) fumNums.push(r.fum);
        S.queue.splice(S.queue.indexOf(op), 1);
      } else if (['retry', 'busy', 'network'].indexOf(r.code) >= 0) {
        op.status = 'pending';
        delete op.sent;   // el PIE la rechazó sin aplicarla: se puede volver a completar
      } else {
        op.status = 'error';
        delete op.sent;
        var known = opErrText(r, op);
        op.error = known || r.error || ERR.server;
        // un texto ya traducido se muestra tal cual; el del PIE va dentro de «No se pudo enviar: …»
        errors.push(known || 'No se pudo enviar: ' + String(op.error).replace(/[\s.]+$/, '') + '. Queda guardado en el celular; revisalo en Ajustes.');
      }
    });
    LS.set('resolved', S.resolved);
    adoptResolved();   // ya: la retención de la FUM, lo abierto y la ruta siguen al registro real
    if (res.fums && S.catalog) S.catalog.fums = res.fums;
    if (res.liberaciones && S.catalog) S.catalog.liberaciones = res.liberaciones;
    if (res.pines && S.catalog) S.catalog.pines = res.pines;
    mergeCategories(res.categorias);
    saveQueue();
    fumNums.forEach(function (n) { toast('FUM N° ' + n + ' abierta en el FOG 01', { kind: 'ok' }); });
    if (errors.length) toast(errors[0], { kind: 'err' });
  }
  /** Sube las fotos pendientes de a una (cada una es una request chica). */
  function sendPhotos() {
    var list = S.queue.filter(function (o) { return o.op === 'photo' && o.status === 'pending'; });
    return list.reduce(function (p, o) {
      return p.then(function () {
        if (o.ref && pendingCreate(o.ref)) return; // espera a que exista el registro
        return KV.get(o.img, true).then(function (data) {
          if (!data) { o.status = 'error'; o.error = ERR.photoLost; saveQueue(); return; }
          o.status = 'sending';
          o.sent = true;
          renderTop();
          var payload = stripOp(o);
          payload.data = String(data).split(',')[1];
          return callApi({ action: 'batch', ops: [payload] }).then(handleResults, function (e) {
            if (o.status === 'sending') o.status = 'pending';
            saveQueue();
            throw e;
          });
        }, function () {
          // no se pudo leer (no es que falte): la foto queda en la cola y se reintenta
          throw apiError('No se pudo leer una foto guardada en el celular. Cerrá y abrí la app para enviarla.', 'storage');
        });
      });
    }, Promise.resolve());
  }

  var syncWaiters = [];
  var weakT = null;
  function sync(opts) {
    opts = opts || {};
    if (S.syncing) return new Promise(function (r) { syncWaiters.push(r); });
    if (!navigator.onLine && !IN_GAS) { renderTop(); return Promise.resolve(false); }
    S.syncing = true;
    S.syncSince = Date.now();
    S.lastError = '';
    S.lastErrorCode = '';
    // si a los 15 s sigue enviando, el indicador pasa a «Señal débil»
    clearTimeout(weakT);
    weakT = setTimeout(function () { if (S.syncing) renderTop(); }, 15100);
    renderTop();
    // primera descarga: «Sin datos» pasa a «Descargando el PIE…»
    if (!S.catalog && S.route !== '/ajustes') render();
    var t0 = Date.now();
    // primero altas y cambios en un solo lote; las fotos van después, de a una. Lo retenido espera.
    var sending = S.queue.filter(function (o) { return o.status === 'pending' && o.op !== 'photo' && !isHeld(o); }).slice(0, 25);
    var chain = Promise.resolve();
    if (sending.length) {
      // sent: ya salió al menos una vez (se guarda con la cola y sobrevive a un cierre de la app)
      sending.forEach(function (o) { o.status = 'sending'; o.sent = true; });
      saveQueue();
      chain = callApi({ action: 'batch', ops: sending.map(stripOp) }).then(handleResults, function (e) {
        sending.forEach(function (o) { if (o.status === 'sending') o.status = 'pending'; });
        saveQueue();
        throw e;
      });
    }
    return chain.then(sendPhotos).then(function () {
      if (opts.full || !S.catalog || Date.now() - S.lastSync > 10 * 60 * 1000) {
        return callApi({ action: 'catalog' }).then(function (c) {
          S.catalog = c;
          KV.set('catalog', c).catch(function () { /* se vuelve a descargar */ });
          plPrune();
        });
      }
    }).then(function () {
      S.lastSync = Date.now();
      LS.set('lastSync', S.lastSync);
      return true;
    }).catch(function (e) {
      S.lastError = e.message;
      S.lastErrorCode = e.code || '';   // sólo en memoria: decide el estado del indicador
      if (e.code === 'auth' || e.code === 'config' || opts.manual) toast(e.message, { kind: 'err' });
      return false;
    }).then(function (ok) {
      S.syncing = false;
      clearTimeout(weakT);
      adoptResolved();
      finishRender();   // no pisa lo que se está escribiendo ni corta un desplazamiento
      // lo que entró (o se liberó) mientras se enviaba sale enseguida, sin esperar otro aviso
      if (ok && S.queue.some(function (o) {
        return o.status === 'pending' && !isHeld(o) && (o.createdAt >= t0 || (o.op !== 'photo' && sending.indexOf(o) < 0));
      })) { clearTimeout(autoSyncT); autoSyncT = setTimeout(sync, 300); }
      syncWaiters.splice(0).forEach(function (r) { r(ok); });
      return ok;
    });
  }

  /*
   * Dibujo que no pidió el usuario (al terminar un envío, §6.8). Mientras la pantalla se desplaza espera
   * (dibujar ahí frena en seco el desplazamiento por inercia de iOS). Con un campo en edición o un buscador
   * enfocado sólo se actualiza el header: el resto se dibuja al salir del campo (renderOnBlur).
   */
  var lastScroll = 0, finT = null;
  window.addEventListener('scroll', function () { lastScroll = Date.now(); }, { passive: true });
  function finishRender() {
    clearTimeout(finT);
    if (PL && (PL.gestureActive || Date.now() - (PL.lastGestureAt || 0) < 400)) { renderTop(); finT = setTimeout(finishRender, 400); return; }
    if (Date.now() - lastScroll < 400) { renderTop(); finT = setTimeout(finishRender, 400); return; }
    var a = document.activeElement;
    if (isEditing()) {
      renderTop();
      S.ui.renderOnBlur = true;
      return;
    }
    // buscador enfocado (§6.10): sólo su lista; el campo, el teclado y el dictado siguen como estaban
    if (a && view.contains(a) && a.type === 'search') {
      renderTop();
      refreshSearchList();
      return;
    }
    render({ keepScroll: true });
  }

  /* ================================================================
   *  Navegación
   * ================================================================ */
  /*
   * El navegador no restaura el desplazamiento (history.scrollRestoration = 'manual'): se guarda
   * por ruta al salir y se repone al volver atrás. Hacia adelante, la pantalla nueva arranca arriba.
   */
  function nav(route, o) {
    o = o || {};
    if (route === S.route) return render();
    S.scroll[S.route] = window.scrollY;
    if (!o.replace) S.stack.push(S.route);
    S.route = route;
    if (!IN_GAS) {
      try { history[o.replace ? 'replaceState' : 'pushState'](null, '', '#' + route); } catch (e) { /* iframe */ }
    }
    window.scrollTo(0, 0);   // antes de dibujar: así no pisa un desplazamiento hecho al dibujar (p. ej. ir a una FUM)
    render();
  }
  function back() {
    if (!IN_GAS && S.stack.length) { history.back(); return; }
    var prev = S.stack.pop();
    S.route = prev || parentOf(S.route);
    render();
    window.scrollTo(0, S.scroll[S.route] || 0);
  }
  function parentOf(r) {
    var m;
    if ((m = /^\/c\/([^/]+)\/.+/.exec(r))) return '/c/' + m[1];
    return '/';
  }
  window.addEventListener('popstate', function () {
    if (askCur) askCur(null);   // volver atrás con una hoja abierta = Cancelar
    if (picker) { closeModal(); }
    S.scroll[S.route] = window.scrollY;
    S.stack.pop();
    S.route = decodeURIComponent(location.hash.slice(1)) || '/';
    render();
    window.scrollTo(0, S.scroll[S.route] || 0);
  });

  /* ================================================================
   *  Render
   * ================================================================ */
  var view = document.getElementById('view');
  document.getElementById('skipLink').addEventListener('click', function () {
    try { view.focus({ preventScroll: false }); } catch (e) { /* noop */ }
  });

  /*
   * Cambios guardados sólo en el celular (§4.2): cuenta cambios, no operaciones de la cola.
   * Las operaciones con error no cuentan acá (tienen su propio estado). Lo retenido sí cuenta.
   */
  function pendingChanges() {
    return S.queue.reduce(function (n, o) {
      if (o.status === 'error') return n;
      if (o.op === 'create') {
        return n + 1 + Object.keys(o.items || {}).filter(function (off) {
          return Object.keys(o.items[off]).some(function (k) { return FIELDS.indexOf(k) >= 0 && k !== 'documento'; });
        }).length;
      }
      if (o.op === 'update') return n + (Object.keys(o.items || {}).length || 1);
      return n + 1;   // foto o FUM
    }, 0);
  }
  /** Estado del indicador de envíos (§4.2): gana la primera condición que se cumple. */
  function netState() {
    var n = pendingChanges();
    var nErr = S.queue.filter(function (o) { return o.status === 'error'; }).length;
    var online = IN_GAS || navigator.onLine;
    var q = n ? ' q' : '';
    var s;
    if (S.syncing) {
      var slow = Date.now() - S.syncSince >= 15000;
      s = n ? { lbl: (slow ? 'Señal débil' : 'Enviando…') + ' · ', cnt: n } : { lbl: 'Actualizando…', cnt: '' };
      s.cls = 'busy' + q; s.icon = 'sync'; s.act = '';
    } else if (S.lastErrorCode === 'auth' || S.lastErrorCode === 'config') {
      s = { cls: 'fix', icon: 'alert', lbl: 'Revisar conexión', cnt: '', act: 'conexion' };
    } else if (nErr) {
      s = { cls: 'err', icon: 'alert', lbl: 'Con error · ', cnt: nErr, act: 'envios' };
    } else if (!online) {
      s = { cls: 'off' + q, icon: 'cloud-off', lbl: n ? 'Sin señal · ' : 'Sin señal', cnt: n || '', act: 'offline' };
    } else if (S.lastError) {
      s = { cls: 'weak' + q, icon: 'cloud-off', lbl: n ? 'No conecta · ' : 'No conecta', cnt: n || '', act: 'send' };
    } else if (n) {
      s = { cls: 'pend q', icon: 'cloud-up', lbl: 'Sin enviar · ', cnt: n, act: 'send' };
    } else {
      s = { cls: 'ok', icon: 'cloud-ok', lbl: 'Al día', cnt: '', act: 'full' };
    }
    s.n = n;
    // el nombre accesible contiene el texto visible (WCAG 2.5.3)
    var unit = function (k, one, many) { return k + (k === 1 ? one : many); };
    s.aria = 'Envíos: ' + s.lbl + (s.cnt === '' ? (n ? ' · ' + unit(n, ' cambio', ' cambios') + ' sin enviar' : '')
      : s.cls === 'err' ? unit(s.cnt, ' envío', ' envíos') : unit(s.cnt, ' cambio', ' cambios'));
    return s;
  }
  /** Tocar el indicador: lleva a lo que hay que resolver, explica que no hay señal o envía ahora. */
  function netTap() {
    var s = netState();
    if (!s.act) return;   // ya está enviando
    if (s.act === 'conexion' || s.act === 'envios') { nav('/ajustes'); scrollToId(s.act); return; }
    if (s.act === 'offline') {
      toast(!s.n ? 'Sin señal. Lo que cargues queda en el celular.'
        : s.n === 1 ? 'Sin señal. Tu cambio queda en el celular y se envía solo al volver la señal.'
        : 'Sin señal. Tus ' + s.n + ' cambios quedan en el celular y se envían solos al volver la señal.', { kind: 'info' });
      return;
    }
    sync(s.act === 'full' ? { full: true, manual: true } : { manual: true });
  }
  /** Desplaza hasta una sección dejándola justo debajo del header fijo. */
  function scrollToId(id) {
    var t = document.getElementById(id);
    if (!t) return;
    var lim = document.getElementById('top').getBoundingClientRect().bottom + 8;
    window.scrollTo(0, Math.max(0, window.scrollY + t.getBoundingClientRect().top - lim));
  }

  /*
   * Header (§4.1). Volver: en todas las pantallas salvo Inicio y «Sin datos». Engranaje: sólo en
   * Inicio, «Sin datos» y FUM; en el resto el lugar es del título (Ajustes también se abre desde el
   * indicador cuando hay que revisar algo).
   */
  function renderTop(title, sub) {
    var top = document.getElementById('top');
    if (title !== undefined) { top.dataset.title = title; top.dataset.sub = sub || ''; }
    var noData = !S.catalog && S.route !== '/ajustes';
    var root = S.route === '/' || noData;
    var gear = root || S.route === '/fum';
    var s = netState();
    top.innerHTML =
      (root ? '' : '<button class="back" data-act="back" aria-label="Volver">' + ic('back', 'ic-24') + '</button>') +
      '<div class="ttl"><b>' + esc(top.dataset.title || 'PIE · Carga') + '</b><small>' + esc(top.dataset.sub || '') + '</small></div>' +
      '<button class="net ' + s.cls + '" data-act="net" aria-label="' + esc(s.aria) + '">' + ic(s.icon) +
      '<span class="lbl">' + esc(s.lbl) + '</span>' + (s.cnt === '' ? '' : '<span class="cnt">' + s.cnt + '</span>') + '</button>' +
      (gear ? '<button class="icon-btn" data-act="go" data-to="/ajustes" aria-label="Ajustes">' + ic('settings', 'ic-24') + '</button>' : '');
  }

  /** Barra inferior acoplada (§4.10): va dentro de #view, como último hijo. */
  function bbar(inner) { return '<div class="bbar"><div class="bbar-in">' + inner + '</div></div>'; }

  /*
   * La barra se oculta con el teclado (visualViewport: en iOS el teclado achica sólo la vista
   * visible; con focusin se ocultaría también al enfocar sin teclado) y mientras un detalle
   * de control está a la vista (no alcanza con «hay uno abierto»: tras un RZ queda abierto).
   */
  var vv = window.visualViewport;
  function kbCheck() { document.body.classList.toggle('kb', !!vv && (window.innerHeight - vv.height * vv.scale) > 150); }
  if (vv) vv.addEventListener('resize', function () { kbCheck(); fitPicker(); });
  var detIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { e.target._vis = e.isIntersecting; });
    document.body.classList.toggle('det-vis', [].some.call(view.querySelectorAll('.det, .reg-plan'), function (d) { return d._vis; }));
  }) : null;
  function watchDets() {
    if (!detIO) return;
    detIO.disconnect();
    var dets = view.querySelectorAll('.det, .reg-plan');
    // si hay detalles, la clase la corrige el primer aviso del observador (así la barra no parpadea)
    if (!dets.length) { document.body.classList.remove('det-vis'); return; }
    [].forEach.call(dets, function (d) { detIO.observe(d); });
  }
  /** Después de cada render(): reserva el lugar de la barra y vigila los detalles abiertos. */
  function afterRender() {
    document.body.classList.toggle('has-bbar', !!view.querySelector('.bbar'));
    watchDets();
  }

  /** Pantalla de una ruta; un alta ya creada ('p' + id) es la misma pantalla que su fila ('h' + fila). */
  function screenOf(route) {
    var m = /^\/c\/([^/]+)\/r\/(.+)$/.exec(route);
    return m ? '/c/' + m[1] + '/r/' + liveKey(m[2]) : route;
  }
  /*
   * Al salir de un registro (§6.8): se vacía su keep y se sueltan las retenciones de sus detalles
   * (la FUM nueva queda confirmada y sale con el próximo envío).
   */
  var shownScreen = null;
  function checkLeave() {
    var prev = shownScreen;
    shownScreen = screenOf(S.route);
    var m = prev && /^\/c\/[^/]+\/r\/(.+)$/.exec(prev);
    if (!m || screenOf(prev) === shownScreen) return;
    var old = liveKey(m[1]);
    delete S.ui.keep[old];
    releaseHolds(function (h) { return !!h.det && h.key === old; });
  }
  /** Primer control a la vista debajo del header y de la banda de etapa (para anclar el dibujo). */
  function itemAnchor() {
    var lim = document.getElementById('top').getBoundingClientRect().bottom + 48, a = null;
    [].some.call(view.querySelectorAll('.item'), function (el) {
      var rc = el.getBoundingClientRect();
      if (rc.bottom > lim) { a = { id: el.id, top: rc.top }; return true; }
    });
    return a;
  }

  /*
   * Dibuja la pantalla de la ruta actual. keepScroll: queda anclado al primer control a la vista (§6.8),

    checkLeave();
    var y = window.scrollY;
    var r = S.route, m;
    var scr0 = screenOf(r);
    var anchor = o.keepScroll ? itemAnchor() : null;
    if (!S.catalog && r !== '/ajustes') {
      renderTop('PIE · Carga', 'Plan de Inspección y Ensayo');
      // Sin datos y primera descarga (§5.1)
      view.innerHTML = S.syncing
        ? emptyHtml('Descargando el PIE… puede tardar hasta un minuto.', 'sync', true)
        : '<div class="empty"><div class="ico">' + ic('download', 'ic-24') + '</div>' +
          '<p>Todavía no hay datos en este celular. Hace falta señal una sola vez; después funciona sin conexión.</p>' +
          (S.lastError ? noteHtml('err', esc(S.lastError)) : '') +
          '<div class="empty-btns"><button type="button" class="btn primary lg" data-act="sync" data-full="1" data-manual="1">Descargar el PIE</button>' +
          (MODE === 'pwa' ? '<button type="button" class="btn" data-act="go" data-to="/ajustes">Configurar conexión</button>' : '') + '</div></div>';
      plFullCheck();
      afterRender();
      return;
    }
    if (r === '/') renderHome();
    else if (r === '/ajustes') renderSettings();
    else if (r === '/quien') renderWho();
    else if (r === '/fum') renderFum();
    else if ((m = /^\/c\/([^/]+)$/.exec(r))) renderCategory(m[1]);
    else if ((m = /^\/c\/([^/]+)\/nuevo$/.exec(r))) renderNew(m[1]);
    else if ((m = /^\/c\/([^/]+)\/r\/([ph].+)$/.exec(r))) renderReg(m[1], m[2]);
    else { S.route = '/'; renderHome(); }
    plFullCheck();
    afterRender();
    // si al dibujar se pasó a otra pantalla (p. ej. el registro ya no existe), esa arranca donde la dejó nav()
    if (o.keepScroll && screenOf(S.route) === scr0) {
      var n = !PL.full && anchor && document.getElementById(anchor.id);   // a pantalla completa no se ancla
      if (n) window.scrollBy(0, n.getBoundingClientRect().top - anchor.top);
      else window.scrollTo(0, y);

  /* ---------- Piezas comunes de las pantallas (§4.14) ---------- */
  var NO_MODEL = 'Esta planilla todavía no tiene registros para usar de modelo. Cargá el primero en el PIE desde la computadora.';
  var NOTE_IC = { info: 'info', warn: 'alert', err: 'alert' };
  /** Nota con ícono a la izquierda y el contenido (HTML ya escapado) en un bloque aparte. */
  function noteHtml(kind, inner, icon) {
    return '<div class="note ' + kind + '">' + ic(icon || NOTE_IC[kind] || 'info') + '<div>' + inner + '</div></div>';
  }
  function chipHtml(cls, txt) { return '<span class="chip ' + cls + '">' + esc(txt) + '</span>'; }
  function emptyHtml(txt, icon, spin) {

  function searchTerms(s) { return norm(String(s || '').trim()).split(/\s+/).filter(Boolean); }

  /* ================================================================

  function plAll() { return (S.catalog && S.catalog.planos) || []; }
  function plLams(sheet) { return plAll().filter(function (p) { return p.planilla === String(sheet); }); }
  // Coincidencia de código completo y revisión; nunca por fragmento ni por revisión más nueva.

  function regPlanKey(reg) { return 'plano:' + reg.sheet + ':' + liveKey(reg.key); }
  /* Disponibilidad sin conexión de cada lámina: índice en el celular (LS) de las que ya se bajaron. */
  function plKey(l) { return 'plano.' + l.id + '.' + (l.v || l.rev); }

    if (on) m[plKey(l)] = Date.now(); else delete m[plKey(l)];

  }
  function plNum(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }

  function plOffDraw() {

    if (!box) return;
    var lams = plVisibleLams(), falta = lams.filter(function (l) { return !plIsOff(l); });
    if (PL.bajando) {

      return;
    }
    box.innerHTML = '<span class="grow" role="status">' + (falta.length
      ? 'Sin conexión: <b>' + (lams.length - falta.length) + ' de ' + lams.length + '</b> ' + (lams.length === 1 ? 'lámina disponible' : 'láminas disponibles')
      : (lams.length === 1 ? 'La lámina está disponible' : 'Las ' + lams.length + ' láminas están disponibles') + ' sin conexión') + '</span>' +
      (falta.length ? '<button type="button" class="btn sm" data-act="pl-bajar">Bajar las que faltan (' + falta.length + ')</button>' : '');
  }
  function plNoSpace(e) { return !!e && (e.name === 'QuotaExceededError' || e.code === 22 || /quota|espacio/i.test(String(e.message || ''))); }
  /** Baja y guarda en el celular las láminas que faltan, de a una (cada una es un pedido a Drive). */
  function plBajar() {
    var falta = plVisibleLams().filter(function (l) { return !plIsOff(l); });
    if (!falta.length || PL.bajando) return;
    if (!navigator.onLine && !IN_GAS) { toast('Sin señal: conectate para bajar las láminas.', { kind: 'info' }); return; }
    var hechas = 0, red = 0, espacio = false;
    falta.reduce(function (p, l, i) {
      return p.then(function () {
        if (espacio) return;   // sin espacio no tiene sentido seguir con las demás
        PL.bajando = (i + 1) + ' de ' + falta.length; plOffDraw();
        return callApi({ action: 'plano', id: l.id }).then(function (r) {
          return KV.setBig(plKey(l), 'data:' + r.mime + ';base64,' + r.data).then(function () { plMarkOff(l, true); hechas++; }, function () { espacio = true; });
        }, function () { red++; });

      PL.bajando = '';

  /** Al llegar el catálogo: se borran del celular las láminas de versiones que ya no están en planos.json. */
  function plPrune() {
    var ls = plAll();
    if (!ls.length) return;   // sin láminas en el catálogo (o no llegó la lista): no se toca nada
    var ok = {};
    ls.forEach(function (l) { ok[plKey(l)] = true; });
    KV.keys('plano.').then(function (ks) { ks.forEach(function (k) { if (!ok[k]) KV.del(k); }); });
    var m = plOffMap(), cambio = false;
    Object.keys(m).forEach(function (k) { if (!ok[k]) { delete m[k]; cambio = true; } });
    if (cambio) LS.set('planosOk', m);

    try {
      Object.keys(localStorage).forEach(function (k) {
        var mm = /^pie\.kv(local)?\.(plano\..+)$/.exec(k);
        if (mm && !ok[mm[2]]) localStorage.removeItem(k);

    } catch (e) { /* bloqueado */ }
  }
  /** Pantalla completa del visor (la barra y la hoja de marcas quedan; se ocultan encabezado y pestañas). */

    PL.full = on == null ? !PL.full : !!on;
    var w = document.getElementById('plWrap'), btn = document.querySelector('[data-act=pl-full]');
    if (!w) { PL.full = false; document.body.classList.remove('pl-full-open'); return; }
    PL.fullCtx = PL.ctx;
    if (PL.full && !was) PL.fullY = window.scrollY;   // al salir, la página vuelve a donde estaba
    w.classList.toggle('pl-full', PL.full);
    document.body.classList.toggle('pl-full-open', PL.full);
    if (btn) {
      btn.setAttribute('aria-pressed', String(PL.full));
      btn.setAttribute('aria-label', PL.full ? 'Salir de pantalla completa' : 'Plano a pantalla completa');
    }
    var pl = planoOf(PL.id);
    if (pl) { var fitted = Math.abs(PL.z - PL.fit) < 0.001; plFit(pl, fitted); plApply(pl); }

  /** Después de dibujar: sin visor en pantalla (otra ruta, otra pestaña) la pantalla completa se apaga. */

    PL.full = false;

  }

  }
  function planoOf(id) { return plAll().filter(function (p) { return p.id === id; })[0] || null; }
  function r5(n) { return Math.round(n * 100000) / 100000; }

  /** Pines vigentes de una lámina: los del PIE más lo que está en la cola sin enviar. */
  /** Pines y zonas de una lámina en una planilla (una lámina puede servir a varias planillas). */
  function plPins(planoId, sheet) {
    sheet = String(sheet || PL.sheet || '');
    var out = {}, order = [];
    var put = function (p) { if (!out[p.id]) order.push(p.id); out[p.id] = p; };
    ((S.catalog && S.catalog.pines) || []).forEach(function (r) {
      put({ id: r[0], sheet: r[1], h: r[2], plano: r[3], x: r[4], y: r[5], elemento: r[6], piso: r[7], por: r[8], at: { k: r[9] || 'reg', v: r[10] || '' }, pts: r[11] || null, color: PL_COLORS[r[12]] ? r[12] : 'auto', local: false });
    });
    S.queue.forEach(function (o) {
      if (o.op !== 'pin') return;
      if (o.accion === 'quitar' && o.status === 'error') { if (out[o.pin]) out[o.pin].err = o.error || 'error'; return; }   // no se borró en el PIE
      if (o.accion === 'poner') put({ id: o.pin, sheet: o.sheet, h: o.h || null, ref: o.ref || null, plano: o.plano, x: o.x, y: o.y, elemento: o.elemento, piso: o.piso, por: o.by, at: o.alc || { k: 'reg', v: '' }, pts: o.pts || null, color: o.color || 'auto', local: true });
      else if (o.accion === 'color' && out[o.pin]) { out[o.pin].color = o.color || 'auto'; out[o.pin].local = true; }
      else if (o.accion === 'mover' && out[o.pin]) { out[o.pin].x = o.x; out[o.pin].y = o.y; if (o.pts) out[o.pin].pts = o.pts; out[o.pin].local = true; }
      else if (o.accion === 'quitar') { delete out[o.pin]; }
      if (o.status === 'error' && out[o.pin]) out[o.pin].err = o.error || 'error';

  }
  /**
   * Registro vivo de un pin: el de su fila (el PIE actualiza el elemento del pin al corregirlo, pero el catálogo
   * local puede estar atrasado); si la fila ya no está, lo busca por elemento y piso.
   */
  function plRegOf(p) {
    if (p.ref) return getReg(p.sheet, liveKey('p' + p.ref)) || null;
    var reg = p.h != null && p.h !== '' ? getReg(p.sheet, 'h' + p.h) : null;
    if (reg) return reg;
    if (!norm(p.elemento)) return null;   // sin elemento no hay con qué buscarlo
    return listRegs(p.sheet).filter(function (r) { return norm(r.elemento) === norm(p.elemento) && norm(r.piso) === norm(p.piso); })[0] || null;
  }
  /** Controles que marca un pin: todo el registro, una etapa o una tarea («ETAPA|Tarea»). */
  function plScopeItems(reg, at) {
    if (at.k === 'etapa') return reg.items.filter(function (it) { return (it.etapa || '—') === at.v; });
    if (at.k === 'tarea') {
      var i = at.v.indexOf('|'), e = at.v.slice(0, i), t = at.v.slice(i + 1);
      return reg.items.filter(function (it) { return (it.etapa || '—') === e && (it.tarea || '—') === t; });
    }
    return reg.items;
  }
  function plAtLabel(at) {
    if (at.k === 'etapa') return 'Etapa ' + at.v;
    if (at.k === 'tarea') { var i = at.v.indexOf('|'); return at.v.slice(i + 1) + ' · ' + at.v.slice(0, i); }
    return 'Todo el registro';
  }
  /** rz: algún RZ · enc: en curso · ap: todo hecho · sin: nada hecho · x: no hay controles (se movió o se borró). */
  function plItemsColor(items) {
    if (!items.length) return 'x';
    var s = stats(items);
    if (s.rz) return 'rz';
    if (s.total - s.pend === 0) return 'sin';
    return s.pend ? 'enc' : 'ap';
  }
  function plColor(reg, at) { return reg ? plItemsColor(plScopeItems(reg, at)) : 'x'; }

  /**
   * Cómo se ve una marca en la capa actual: las de etapa o tarea sólo en su capa; las de todo el registro
   * en todas, con el estado de los controles de esa etapa (y no se muestran si el registro no la tiene).

  function plView(p) {
    var reg = plRegOf(p), e = plEtapaOf(p.at);
    if (PL.capa === 'all') return { show: true, c: plColor(reg, p.at) };
    if (e) return { show: e === PL.capa, c: plColor(reg, p.at) };
    if (!reg) return { show: true, c: 'x' };
    var its = reg.items.filter(function (it) { return (it.etapa || '—') === PL.capa; });
    return { show: its.length > 0, c: plItemsColor(its) };
  }
  /**
   * Valida una zona antes de aceptarla, igual que el PIE (zonaPts_ y betaPolygon_ de Code.gs/Beta.gs):
   * junta vértices repetidos seguidos (también el último con el primero) y pide un polígono simple con superficie.
   * Devuelve { pts } o { error }.
   */
  function plZonaPts(pts) {
    var q = pts.map(function (p) { return [p[0], p[1]]; });
    q = q.filter(function (p, i) { var a = q[(i + q.length - 1) % q.length]; return q.length < 2 || p[0] !== a[0] || p[1] !== a[1]; });
    if (q.length < 3) return { error: 'La zona necesita al menos 3 puntos distintos: tocá más esquinas.' };
    var eps = 1e-12;
    var cross = function (a, b, c) { return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]); };
    var on = function (a, b, p) { return Math.abs(cross(a, b, p)) <= eps &&

      p[1] >= Math.min(a[1], b[1]) - eps && p[1] <= Math.max(a[1], b[1]) + eps; };

        on(a, b, c) || on(a, b, d) || on(c, d, a) || on(c, d, b);
    };
    var area = 0;
    for (var i = 0; i < q.length; i++) {
      var a = q[i], b = q[(i + 1) % q.length];
      for (var j = i + 1; j < q.length; j++) {
        if (a[0] === q[j][0] && a[1] === q[j][1]) return { error: 'La zona pasa dos veces por el mismo punto: marcá los vértices en orden alrededor del área.' };
        if (j === i + 1 || i === 0 && j === q.length - 1) continue;
        if (intersects(a, b, q[j], q[(j + 1) % q.length])) return { error: 'Los bordes de la zona se cruzan: marcá los vértices en orden alrededor del área.' };
      }
      // un borde que vuelve sobre el anterior
      var c = q[(i + 2) % q.length];
      if (on(a, b, c) || on(b, c, a)) return { error: 'Los bordes de la zona se superponen: marcá los vértices en orden alrededor del área.' };
      area += a[0] * b[1] - b[0] * a[1];

  }
  /** Si el punto queda tapado por la hoja inferior o fuera de la vista, lo lleva al centro. */

  /** Pestaña Planos de una planilla (se dibuja debajo de las pestañas, ocupando el resto de la pantalla). */

    // la pantalla completa sigue al redibujar el mismo visor (envío automático, marca desde el plano);

    PL.ctx = S.route + '|' + (PL.regKey ? liveKey(PL.regKey) : '') + '|' + PL.sheet + '|' + (PL.doc || '');
    if (PL.full && PL.fullCtx !== PL.ctx) PL.full = false;

  /** Rayado de las zonas: un patrón por color (las líneas se ven finas al alejar y separadas al acercar). */

  function plPalette(pin) {
    return '<fieldset class="sec"><legend>Color de la marca</legend><p class="help">El color organiza las marcas; el símbolo y el estado siguen indicando el resultado del control.</p><div class="pl-palette">' + Object.keys(PL_COLORS).map(function (key) {

    }).join('') + '</div></fieldset>';

  function plSetColor(pin, color) {
    if (!Object.prototype.hasOwnProperty.call(PL_COLORS, color)) return;
    var pending = S.queue.filter(function (o) { return o.op === 'pin' && o.pin === pin.id && plUnsent(o) && (o.accion === 'poner' || o.accion === 'color'); });
    if (pending.length) pending[pending.length - 1].color = color;
    else S.queue.push(pinOp('color', pin.id, { sheet: pin.sheet, elemento: pin.elemento, piso: pin.piso }, {color: color}));
    queueChanged();
    plDraw();

  function pinOp(accion, pin, reg0, extra) {
    var op = { id: uid(), op: 'pin', accion: accion, sheet: reg0.sheet, status: 'pending', createdAt: Date.now(), by: S.settings.inspector,
      plano: PL.id, elemento: reg0.elemento, piso: reg0.piso };
    if (pin) op.pin = pin;
    Object.keys(extra || {}).forEach(function (k) { op[k] = extra[k]; });

  }
  function plAddPin(reg, at, pt) {
    var op = pinOp('poner', null, reg, { x: pt.x, y: pt.y, alc: { k: at.k, v: at.v } });
    if (pt.pts) op.pts = pt.pts;
    op.pin = op.id;
    if (reg.pending) op.ref = reg.opId; else { op.h = reg.h; op.sig = reg.sig; }
    S.queue.push(op);
    queueChanged();
    PL.sel = op.id;
  }
  /** Mueve un pin; una zona se traslada entera (su centro va al punto tocado, sin salirse de la lámina). */
  function plMovePin(p, pt) {
    var ex = { x: pt.x, y: pt.y };
    if (p.pts) {
      // se limita el desplazamiento (no cada vértice): la zona conserva su forma y no se sale de la lámina
      var xs = p.pts.map(function (q) { return q[0]; }), ys = p.pts.map(function (q) { return q[1]; });
      var lim = function (d, vs) { return Math.min(1 - Math.max.apply(null, vs), Math.max(-Math.min.apply(null, vs), d)); };
      var dx = lim(pt.x - p.x, xs), dy = lim(pt.y - p.y, ys);
      ex.pts = p.pts.map(function (q) { return [r5(q[0] + dx), r5(q[1] + dy)]; });
      var c = plCenter(ex.pts);
      ex.x = c.x; ex.y = c.y;
    }
    var mine = S.queue.filter(function (o) { return o.op === 'pin' && o.pin === p.id && plUnsent(o) && (o.accion === 'poner' || o.accion === 'mover'); });
    var last = mine[mine.length - 1];
    if (last) { last.x = ex.x; last.y = ex.y; if (ex.pts) last.pts = ex.pts; queueChanged(); return; }
    S.queue.push(pinOp('mover', p.id, { sheet: p.sheet, elemento: p.elemento, piso: p.piso }, ex));
    queueChanged();
  }
  function plQuit(p) {
    var unsent = S.queue.some(function (o) { return o.op === 'pin' && o.pin === p.id && o.accion === 'poner' && plUnsent(o); });
    var removed = [], deletion = null, undone = false;
    S.queue = S.queue.filter(function (o, i) {
      var drop = o.op === 'pin' && o.pin === p.id && (unsent || ((o.accion === 'mover' || o.accion === 'color') && plUnsent(o)));
      if (drop) removed.push({op: o, index: i});
      return !drop;
    });
    if (!unsent) {
      deletion = pinOp('quitar', p.id, { sheet: p.sheet, elemento: p.elemento, piso: p.piso });
      S.queue.push(deletion);
      hold(deletion, 6500);
    }
    queueChanged();
    return function () {
      if (undone) return;
      if (deletion && (S.queue.indexOf(deletion) < 0 || deletion.status !== 'pending' || deletion.sent)) {
        toast('El borrado ya se envió. Podés volver a colocar la marca.', {kind: 'info'}); return;
      }
      undone = true;
      if (deletion) { S.queue.splice(S.queue.indexOf(deletion), 1); delete S.hold[deletion.id]; }
      removed.forEach(function (entry) { S.queue.splice(Math.min(entry.index, S.queue.length), 0, entry.op); });
      queueChanged(); plDraw();
      toast('Borrado deshecho', {kind: 'ok'});
    };
  }
  /** Operación de pin que todavía se puede editar o descartar: pendiente, o rechazada sin haber salido. */
  function plUnsent(o) { return !o.sent && (o.status === 'pending' || o.status === 'error'); }
  function plRequestDelete(pin) {
    return ask({title: '¿Borrar ' + (pin.pts ? 'esta zona' : 'este pin') + '?',

      if (choice !== 'ok') return;

      var current = plPins(pin.plano).filter(function (p) { return p.id === pin.id; })[0];
      if (!current) return;

  /** Acciones de los botones de la pestaña Planos (data-act="pl-*"). */
  function plAct(a, el) {
    var pl = planoOf(PL.id);

    if (a === 'pl-color') { var pin = plSelPin(); if (pin) plSetColor(pin, el.dataset.color); return; }
    if (a === 'pl-fit') { plFit(pl, true); return plApply(pl); }
    if (a === 'pl-full') return plToggleFull();
    if (a === 'pl-bajar') return plBajar();
    if (a === 'pl-f') { PL.hide[el.dataset.c] = !PL.hide[el.dataset.c]; return plDraw(); }
    if (a === 'pl-capa') { PL.capa = el.dataset.c; PL.sel = null; return plDraw(); }
    if (a === 'pl-delete-mode') { PL.mode = 'borrar'; PL.sel = null; PL.draft = null; PL.moving = false; PL.zpts = null; return plDraw(); }
    if (a === 'pl-mode') { PL.mode = 'poner'; PL.sel = null; PL.draft = null; PL.zpts = null; return plDraw(); }
    if (a === 'pl-zona') { PL.mode = 'zona'; PL.zpts = []; PL.sel = null; PL.draft = null; return plDraw(); }
    if (a === 'pl-zundo') { if (PL.zpts) PL.zpts.pop(); return plDraw(); }
    if (a === 'pl-zcerrar') {
      if (!PL.zpts || PL.zpts.length < 3) return;
      var zv = plZonaPts(PL.zpts);
      if (zv.error) { toast(zv.error, { kind: 'err' }); return; }   // queda abierta para corregir los puntos
      var zc = plCenter(zv.pts);
      PL.draft = { x: zc.x, y: zc.y, pts: zv.pts, key: PL.regKey || null };
      PL.zpts = null; PL.mode = 'poner'; PL.q = '';

    }
    if (a === 'pl-cancel') { PL.mode = 'ver'; PL.draft = null; PL.sel = null; PL.moving = false; PL.zpts = null; return plDraw(); }
    if (a === 'pl-move') { PL.moving = true; return plDraw(); }

    if (a === 'pl-pick') {
      if (!PL.draft || !getReg(PL.sheet, el.dataset.key)) return;
      PL.draft.key = el.dataset.key;
      return plDraw();
    }
    if (a === 'pl-scope') {
      var reg = PL.draft && getReg(PL.sheet, PL.draft.key);
      if (!reg) return;
      var spt = { x: PL.draft.x, y: PL.draft.y, pts: PL.draft.pts || null };
      plAddPin(reg, { k: el.dataset.k, v: el.dataset.v }, spt);

    }
    if (a === 'pl-open') {

      var its = plScopeItems(oreg, pin.at);
      var first = its.filter(function (it) { return itemState(it) === 'pend'; })[0] || its[0];
      if (first) {
        S.ui.filter[oreg.key] = 'all';
        delete S.ui.folded[oreg.key + '|' + (first.etapa || '—')];
        S.ui.focus = first.off;
      }
      return nav('/c/' + oreg.sheet + '/r/' + oreg.key);
    }
    if (a === 'pl-quit') { var qpin = plSelPin(); if (qpin) return plRequestDelete(qpin); return; }
    if (a === 'pl-mark') {
      var mreg = getReg(PL.sheet, el.dataset.key), off = Number(el.dataset.off), st = el.dataset.st;

      return decideMark(mreg, mit, st).then(function (plan) {
        if (!plan) return;
        var u = applyMark(plan.reg, off, st, plan);
        if (u) markToasts(plan, u);

        renderTop();
        plDraw();
      });
    }
  }
  /** «Ver en el plano» desde un registro: abre la pestaña Planos en el primer pin del registro. */

  /* ---------- Inicio (§5.3) ---------- */

  /** Lo que cambia con la búsqueda o con un envío: estado de las FUM, planillas por rubro, ocultas y pie. */
  function homeListHtml() {
    var raw = String(S.ui.search || '').trim();
    var terms = searchTerms(raw);
    var groups = {};
    var order = [];
    var hidden = [];
    S.catalog.categorias.forEach(function (c) {
      var hay = norm(c.sheet + ' ' + c.titulo);
      if (terms.length && !terms.every(function (t) { return hay.indexOf(t) >= 0; })) return;
      if (c.oculta && !terms.length && !hasLocal(c.sheet)) { hidden.push(c); return; }
      if (!groups[c.rubro]) { groups[c.rubro] = []; order.push(c.rubro); }
      groups[c.rubro].push(c);
    });
    // mientras se busca, la lista arranca directo con las planillas
    var html = terms.length ? '' : recentHtml() + fumStatusRow();
    order.forEach(function (g) {
      html += '<h2 class="sec">' + esc(g) + '</h2><div class="list">' + groups[g].map(catRow).join('') + '</div>';
    });
    if (hidden.length) {
      html += '<details class="hid ocultas"><summary class="row">' + '<span class="grow t16">' + esc('Planillas ocultas · ' + hidden.length) + '</span>' +
        ic('chev-d', 'chev') + '</summary><div class="list">' + hidden.map(catRow).join('') + '</div></details>';
    }
    var extra = terms.length ? globalSearchHtml(terms) : '';
    html += extra;
    if (terms.length && !order.length && !hidden.length && !extra) {
      html += emptyHtml('Nada coincide con «' + raw + '». Probá con un elemento (losa), un piso (5P), un plano (S12P) o una FUM (FUM 4).', 'search');
    }

  /*
   * Búsqueda global (v1.7), sin señal: además de las planillas, registros (elemento, piso, sector, etapa),

   */
  function globalSearchHtml(terms) {
    var more = function (n, max) { return n > max ? '<p class="help srch-more">' + esc('Se ven ' + max + ' de ' + n + '. Escribí más para filtrar.') + '</p>' : ''; };
    var match = function (hay) { hay = norm(hay); return terms.every(function (t) { return hay.indexOf(t) >= 0; }); };

    // registros (también los nuevos sin enviar)
    var regs = [];
    S.queue.forEach(function (o) {
      if (o.op !== 'create') return;
      var h = o.header || {};
      if (match(['planilla ' + o.sheet, h.elemento, 'piso ' + (h.piso || ''), h.piso, h.sector, h.etapa].join(' '))) regs.push([o.sheet, 'p' + o.id]);
    });
    (S.catalog.categorias || []).forEach(function (c) {
      c.registros.forEach(function (r) {
        if (!(r.elemento || r.piso)) return;

      html += '<h2 class="sec">Registros · ' + regs.length + '</h2><div class="list">' + regs.slice(0, 8).map(function (x) {
        var r = getReg(x[0], x[1]);
        return r ? regRow(r, true) : '';
      }).join('') + '</div>' + more(regs.length, 8);
    }
    // FUM: «fum 4», «4» o palabras del elemento / criterio
    var fums = [];
    openFums().forEach(function (f) {
      if (match([f.num != null ? 'fum ' + f.num + ' fum' + f.num + ' n ' + f.num : 'fum nueva', f.elemento, f.criterio, f.piso, 'planilla ' + f.sheet, 'abierta'].join(' '))) fums.push({ f: f, open: true });
    });
    fumsAll().forEach(function (f) {
      if (f[5] === 'Abierta') return;
      if (match(['fum ' + f[0] + ' fum' + f[0], f[8], f[9], f[14], 'planilla ' + f[1], f[5]].join(' '))) {
        fums.push({ f: { num: f[0], sheet: f[1], key: 'h' + f[2], off: f[3], elemento: f[8], criterio: f[9], estado: f[5] }, open: false });
      }

    if (fums.length) {

        var f = x.f;

          '<span class="chips">' + (x.open ? chipHtml('rz', 'Abierta') : chipHtml('', f.estado || 'Cerrada')) + '</span></span>' + ic('chev-r', 'chev') + '</button>';
      }).join('') + '</div>' + more(fums.length, 5);
    }
    // planos del FOD 02: la revisión escrita (R06, rev 6) se separa del código para dar el veredicto
    var qrev = null, dterms = [];
    terms.forEach(function (t) {
      var m = /^r(?:ev)?\.?0*(\d{1,3}|[a-z])$/.exec(t);
      if (m && dterms.length) qrev = /^\d+$/.test(m[1]) ? String(Number(m[1])) : m[1].toUpperCase(); else dterms.push(t);
    });
    var docs = dterms.length ? fodDocs().filter(function (x) {
      var hay = norm([x[0], x[2], x[3], x[4]].join(' '));
      return dterms.every(function (t) { return hay.indexOf(t) >= 0; });

    if (docs.length) {
      html += '<h2 class="sec">Planos FOD 02 · ' + docs.length + '</h2><div class="card">' + docs.slice(0, 5).map(function (x) {
        var latest = String(x[1] == null ? '' : x[1]);
        var v;
        if (qrev == null) v = chipHtml('ap', 'Vigente: ' + revLabel(latest));
        else if (revCmp(qrev, latest) < 0) {
          var since = '';
          (x[10] || []).forEach(function (h) { if (revCmp(h[0], qrev) > 0 && h[1] && (!since || h[1] < since)) since = h[1]; });
          v = chipHtml('rz', revLabel(qrev) + ' SUPERADA · rige ' + revLabel(latest) + (since ? ' desde ' + fmtDate(since) : ''));
        } else if (revCmp(qrev, latest) === 0) v = chipHtml('ap', revLabel(qrev) + ' VIGENTE');
        else v = chipHtml('pend', revLabel(qrev) + ' no figura en el FOD 02 · última ' + revLabel(latest));
        var code = normDoc(x[0]), used = 0, old = 0;
        (S.catalog.categorias || []).forEach(function (c) {
          c.registros.forEach(function (r) {
            var hit = r.items.filter(function (it) { return it[2] && normDoc(it[2]).indexOf(code) >= 0; });
            if (!hit.length) return;
            used++;
            if (hit.some(function (it) {
              return itemState({ estado: it[5], fecha: it[3] }) === 'pend' && docRefs(it[2]).some(function (d) { return d.doc === x && d.used != null && revCmp(d.used, latest) < 0; });
            })) old++;
          });
        });
        var meta = [x[4], x[3], x[5] ? 'Recibido ' + fmtDate(x[5]) : ''].filter(Boolean).join(' · ');
        return '<div class="srch-doc"><p class="code">' + esc(x[0]) + '</p>' + (x[2] ? '<p class="meta">' + esc(x[2]) + '</p>' : '') +
          (meta ? '<p class="meta">' + esc(meta) + '</p>' : '') + '<div class="chips">' + v +
          (isNo(x[7]) ? chipHtml('rz', 'No vigente') : '') + (x[6] && /^no/i.test(x[6]) ? chipHtml('rz', x[6]) : '') +
          (used ? chipHtml('', 'En ' + used + (used === 1 ? ' registro' : ' registros')) : '') +
          (old ? chipHtml('rz', old + (old === 1 ? ' registro con pendientes en revisión vieja' : ' registros con pendientes en revisión vieja')) : '') + '</div></div>';
      }).join('') + '</div>' + more(docs.length, 5);

  }

  /* ---------- Registro: checklist ---------- */

      }).filter(function (tk) { return tk.items.length; });

      : bbar('<div class="done-sum">' + ic('check-circle', 't-ap') + '<span>' +

  /** Datos del registro en dos renglones; «Planilla 6 · fila N» y «cambios sin enviar» quedan en #hdr. */

  /** Chip de una parte del plano del registro contra el FOD 02. */
  function docChip(part) {

  /** El código abre sus hojas dentro del registro; cambiar documento es una acción separada. */
  function docRow(reg, rdoc) {

    var rows = parts.map(function (part) {

  /** Banner de plano superado (§7.5): queda como recordatorio mientras haya algo con una revisión vieja. */
  function docBanner(reg, rdoc) {
    var dd = docStatus({ documento: rdoc, estado: '', fecha: '' });

    var na = regDocAlerts(reg.items);

        esc(latest != null ? 'Pasar a ' + revLabel(latest) : 'Pasar a la revisión vigente') + '</button></div>' : '') + '</div></div>';

  /** Envío rechazado por el PIE para este registro. */

  /** Filtros (§4.8): cinco celdas iguales con el número arriba; la activa toma el color de su estado. */

  function docDefault(reg) {

  /** Fija el plano del registro y lo aplica a todos los controles no controlados (pendientes y N/A). */

      String(it.fecha || '').toUpperCase() === 'NA' ? '' : fmtDate(it.fecha),

      it.documento && it.documento !== rdocIt ? 'Plano: ' + it.documento : '',
      it.obs ? '“' + it.obs + '”' : ''].filter(Boolean).map(esc);
    if (st !== 'pend') filled.unshift('<b class="t-' + st + '">' + EST[st] + '</b>');
    var b = function (cls, icon) {
      return '<button type="button" class="st ' + cls + (st === cls ? ' on' : '') + '" data-act="mark" data-key="' + reg.key + '" data-off="' + it.off + '" data-st="' + cls + '"' +
        ' aria-pressed="' + (st === cls) + '" aria-describedby="crit-' + it.off + '">' + ic(icon) + EST[cls] + '</button>';
    };
    var meta = [it.metodo, it.instrumento && it.instrumento !== 'NA' ? it.instrumento : ''].filter(Boolean).join(' · ');
    var warn = ((st === 'ap' || st === 'rz') && needsSerial(it.instrumento)
      ? '<button type="button" class="chip pend" data-act="serial" data-key="' + reg.key + '" data-off="' + it.off + '">Falta N° de serie</button>' : '') +
      (!calVencida(it) && (st === 'ap' || st === 'rz') && calFalta(it.instrumento).length ? '<button type="button" class="chip pend" data-act="serial" data-key="' + reg.key + '" data-off="' + it.off + '">Sin calibración cargada</button>' : '') +
      (calVencida(it) ? '<button type="button" class="chip rz" data-act="serial" data-key="' + reg.key + '" data-off="' + it.off + '">' + ic('alert', 'ic-16') + 'Calibración vencida</button>' : '') +
      docWarnHtml(reg, it);
    var moreLabel = 'Detalle del control' + (it.obs ? ', con observación' : '');
    var h = '<div class="item ' + st + (isKept(reg, it) ? ' kept' : '') + '" id="it-' + it.off + '">' +
      '<p class="crit" id="crit-' + it.off + '">' + esc(it.criterio) + '</p>' +
      (meta ? '<p class="meta">' + esc(meta) + '</p>' : '') +
      '<div class="acts' + (st !== 'pend' ? ' set' : '') + '" role="group" aria-label="Resultado del control">' + b('ap', 'check') + b('rz', 'x') + b('na', 'minus') +
      '<button type="button" class="more' + (it.obs ? ' has' : '') + '" data-act="more" data-key="' + reg.key + '" data-off="' + it.off + '"' +
      ' aria-expanded="' + open + '" aria-controls="det-' + it.off + '" aria-label="' + esc(moreLabel) + '">' + ic('chev-d') + '</button></div>';
    if (filled.length && !open) h += '<p class="filled">' + filled.join(' · ') + '</p>';
    if (warn) h += '<div class="warn">' + warn + '</div>';

  }
  /*
   * Detalle del control (§4.7): FUM (si hay), observaciones,
   * datos del control y el pie con «Borrar carga» (sólo si hay algo cargado) y «Listo».
   */
  function detailHtml(reg, it, st, fz, rdocIt) {
    var attrs = ' data-key="' + reg.key + '" data-off="' + it.off + '"';
    var abrevs = datos().responsables.map(function (x) { return x.abrev; }).filter(Boolean);
    if (it.resp && abrevs.indexOf(it.resp) < 0) abrevs.push(it.resp);
    var fecha = /^\d{4}-\d{2}-\d{2}$/.test(it.fecha) ? it.fecha : '';
    var canClear = st !== 'pend' || it.fecha || it.resp || it.fum || it.obs || fz.open;
    return '<div class="det" id="det-' + it.off + '"' + attrs + '>' +
      fumBox(reg, it) +
      '<label class="f sec"><span>Observaciones</span><textarea class="in" data-field="obs" autocapitalize="sentences">' + esc(it.obs) + '</textarea></label>' +
      '<div class="sec"><div class="grid2">' +
      '<label class="f"><span>Fecha</span><input class="in" type="date" data-field="fecha" value="' + esc(fecha) + '">' +
      (fecha ? '' : '<span class="help">Vacía = hoy al marcar</span>') + '</label>' +
      '<label class="f"><span>Resp.</span><select class="in" data-field="resp"><option value="">Sin responsable</option>' +
      abrevs.map(function (x) { return '<option' + (x === it.resp ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></label></div>' +
      instrSelect(reg, it) +
      (it.documento && it.documento !== rdocIt ? '<p class="help">Plano de este control: <span class="mono">' + esc(it.documento) + '</span></p>' : '') +
      // N° de FUM a mano: sólo si ya tiene uno y la FUM no está ni en la cola ni en el FOG 01
      (it.fum && !fz.pend && !fz.server ? '<label class="f"><span>FUM N°</span><input class="in" data-field="fum" inputmode="numeric" value="' + esc(it.fum) + '"></label>' : '') +
      '</div>' +
      '<div class="det-foot">' +
      (canClear ? '<button type="button" class="btn ghost danger" data-act="clear"' + attrs + '>Borrar carga</button>' : '') +
      '<button type="button" class="btn primary" data-act="more"' + attrs + '>' + ic('check') + 'Listo</button></div></div>';
  }
  function refreshItem(reg, off) {
    var it = reg.items.filter(function (x) { return x.off === off; })[0];
    var el = document.getElementById('it-' + off);
    if (!el || !it) return render({ keepScroll: true });
    var tmp = document.createElement('div');
    tmp.innerHTML = itemCard(reg, it);
    el.replaceWith(tmp.firstChild);
    watchDets();
  }

  /*
   * FUM abierta del control: su número en el FOG 01 (null si todavía no se envió) y a qué FUM apunta un
   * cierre (por número si está abierta en el FOG 01; si no, por el id de su alta en la cola).
   */
  function fumOpenNum(f) { return f.server && f.server[5] === 'Abierta' ? f.server[0] : null; }
  function closeFields(f, resultado) {
    var n = fumOpenNum(f);
    var c = n != null ? { num: n } : f.pend ? { ref: f.pend.id } : null;
    if (!c) return null;
    c.accion = 'cerrar';
    c.resultado = resultado;
    c.fecha = today();
    return c;
  }
  /** Datos de un control antes de cambiarlo (para Deshacer). */
  function prevOf(it) {
    var p = {};
    ['estado', 'fecha', 'resp', 'fum', 'obs', 'documento', 'instrumento'].forEach(function (k) { p[k] = it[k]; });
    return p;
  }

  /** Hoja de «Borrar carga» (§7.9), según haya FUM nueva, FUM ya enviada o ninguna. */
  function clearQuestion(f) {
    if (f.closing && f.closing.status !== 'sending' && !f.closing.sent) f = { pend: f.pend, server: f.server, closing: null, open: true };
    var num = fumOpenNum(f);
    var discard = f.open && f.pend && f.pend.status === 'pending' && !f.pend.sent;   // misma condición que clearItem
    var annul = f.open && !discard;
    return {
      title: '¿Borrar la carga de este control?',
      body: 'Vuelve a pendiente y se borran fecha, responsable y observaciones. Las fotos quedan.' +
        (discard ? '\n\nLa FUM nueva se descarta (todavía no se envió).'
          : annul ? '\n\nLa ' + (num ? 'FUM N° ' + num : 'FUM') + ' queda ANULADA en el FOG 01. Si ya se corrigió, cancelá y marcá AP.' : ''),
      ok: { label: annul ? 'Borrar y anular FUM' : 'Borrar carga', tone: 'danger' }
    };
  }
  /**
   * «Borrar carga» (§6.4): el control vuelve a pendiente (las fotos quedan). La FUM nueva sin enviar se
   * descarta; la ya enviada se anula, retenida 6 s para poder deshacer. Ofrece Deshacer.
   */
  function clearItem(reg, off) {
    var it = itemOf(reg, off);
    if (!it) return;
    voidUndo(reg, off);
    var u = { patches: [{ sheet: reg.sheet, key: reg.key, off: it.off, prev: prevOf(it) }], drop: [], restore: [] };
    var f0 = itemFum(reg, it);
    if (f0.closing && f0.closing.status !== 'sending' && !f0.closing.sent) {
      // el cierre que no salió se cancela: la FUM se anula (o se descarta) como si siguiera abierta
      u.restore.push(f0.closing);
      dropOp(f0.closing);
      delete S.hold[f0.closing.id];
    }
    var f = itemFum(reg, it);   // se vuelve a mirar al confirmar: pudo haber llegado un envío
    if (f.open) {
      if (f.pend && f.pend.status === 'pending' && !f.pend.sent) {
        u.restore = u.restore.concat(S.queue.filter(function (o) { return o === f.pend || o.ref === f.pend.id; }));
        dropOp(f.pend);
      } else {
        var cf = closeFields(f, 'Anulada');
        if (cf) {
          var anul = queueFum(reg, it, cf);
          hold(anul, 6000);
          u.drop.push(anul);
        }
      }
    }
    editItem(reg, it.off, { estado: '', fecha: '', resp: '', fum: '', obs: '' });
    keepItem(reg, it.off);   // con un filtro puesto (p. ej. AP) no desaparece de la lista: el detalle sigue abierto
    // dibujo completo: el subtítulo, el contador de la etapa y la barra («Siguiente pendiente») quedan al día
    render({ keepScroll: true });
    offerUndo('Carga borrada', u);
  }
  /** Deshacer (6 s): u = {patches: [{sheet, key, off, prev}], drop: [ops creadas], restore: [ops descartadas]}. */
  function offerUndo(msg, u, kind) {
    S.undo = u;
    toast(msg, { kind: kind || 'ok', ms: 6000, action: { label: 'Deshacer', icon: 'undo', fn: function () { doUndo(u); } } });
  }
  /** Una marca nueva sobre un control incluido en el último Deshacer lo anula (no se repone a ciegas). */
  function voidUndo(reg, off) {
    var u = S.undo;
    if (u && u.patches.some(function (p) { return p.sheet === reg.sheet && p.off === off && liveKey(p.key) === liveKey(reg.key); })) {
      S.undo = null;
      if (toastCur && toastCur.action) hideToast();
    }
  }
  function doUndo(u) {
    if (S.undo !== u) { toast('Ya no se puede deshacer: el control cambió después.', { kind: 'info' }); return; }
    S.undo = null;
    // lo creado tiene que seguir sin enviar (la retención de 6 s lo asegura); si ya salió, no se toca nada
    var sent = u.drop.filter(function (o) { return S.queue.indexOf(o) < 0 || (o.status !== 'pending' && o.status !== 'error'); });
    if (sent.length) { toast(sent[0].op === 'liberar' ? 'No se puede deshacer: la liberación ya llegó al PIE.' : 'No se puede deshacer: la FUM ya se cerró en el FOG 01.', { kind: 'err' }); return; }
    u.drop.forEach(function (o) { dropOp(o); delete S.hold[o.id]; });
    // lo descartado vuelve a la cola (una FUM nueva vuelve a quedar retenida si su detalle sigue abierto)
    u.restore.forEach(function (o) { o.status = 'pending'; if (S.queue.indexOf(o) < 0) S.queue.push(o); });
    u.patches.forEach(function (p) {
      var r = getReg(p.sheet, p.key);
      if (!r || !r.items.some(function (x) { return x.off === p.off; })) return;
      // un N° de FUM vacío no se repone: la FUM pudo numerarse mientras tanto
      var prev = {};
      Object.keys(p.prev).forEach(function (k) { if (k !== 'fum' || p.prev.fum) prev[k] = p.prev[k]; });
      editItem(r, p.off, prev);
    });
    queueChanged();
    render({ keepScroll: true });
    toast('Listo, se deshizo', { kind: 'info' });
  }

  /*
   * Marcar un control (§6.1-6.2). Las preguntas van con ask(), nunca con el diálogo nativo: primero se
   * decide (decideMark, puede preguntar) y después se aplica sin preguntar (applyMark).
   * Tocar el estado que ya tiene no lo borra: para eso está «Borrar carga» en el detalle.
   */
  /**
   * Qué pasa con la FUM abierta del control al marcar AP o N/A:
   * 'drop': es nueva y sigue retenida (el RZ fue un error y se corrige con el detalle abierto): se descarta
   *   sin preguntar y no llega nada al FOG 01;
   * 'ask': es una reinspección real (numerada, o nueva pero ya liberada o enviada): se pregunta antes de
   *   cerrarla. Cambio deliberado respecto de la v1.5: un rechazo real cargado sin señal ya no desaparece;
   * 'none': no hay FUM abierta (o se marca RZ).
   */
  function fumAction(f, st) {
    if (st === 'rz' || !f.open) return 'none';
    return f.pend && f.pend.status === 'pending' && !f.pend.sent && isHeld(f.pend) ? 'drop' : 'ask';
  }
  function askFumClose(f, st) {
    var num = fumOpenNum(f), la = 'La ' + (num ? 'FUM N° ' + num : 'FUM');
    return ask(st === 'ap'
      ? { title: '¿Pasó la reinspección?', body: la + ' se cierra como aprobada, con fecha de hoy.', ok: { label: 'Cerrar FUM y marcar AP', tone: 'ap' } }
      : { title: '¿El control no aplica?', body: la + ' se anula en el FOG 01 y el control queda N/A.', ok: { label: 'Anular FUM y marcar N/A', tone: 'danger' } });
  }
  /*
   * Plano superado al marcar AP o RZ (§6.6, C10): tres salidas y una sola pregunta por registro y revisión.
   * Devuelve Promise<'ok' (pasar a la vigente) | 'alt' (marcar con la vieja) | 'none' (no hace falta) | null (no marcar)>.
   */
  function askPlano(reg, it) {
    var doc = docDefault(reg) || it.documento;
    var ds = doc && docStatus({ documento: doc, estado: '', fecha: '' });
    if (!ds || ds.level !== 'old') return Promise.resolve('none');
    var kk = 'docKeep.' + reg.sheet + '.' + reg.key, kv = ds.code + '|' + ds.latest;
    if (LS.get(kk, null) === kv) return Promise.resolve('alt');   // ya eligió seguir con la vieja para esta revisión
    return ask({
      title: 'Plano superado',
      body: 'Este registro usa ' + ds.code + ' en ' + revLabel(ds.used) + ' y rige la ' + revLabel(ds.latest) +
        (ds.fecha ? ' (desde ' + fmtDate(ds.fecha) + ')' : '') + '.\nElegí con cuál marcar este control y los siguientes de este registro.',
      ok: { label: 'Pasar a ' + revLabel(ds.latest) + ' y marcar', tone: 'primary' },
      alt: { label: 'Marcar con ' + revLabel(ds.used) },
      cancel: 'No marcar'
    }).then(function (r) { if (r === 'alt') LS.set(kk, kv); return r; });
  }
  /**
   * Preguntas antes de marcar (§6.2). Devuelve Promise<plan | null>; null = no marcar.
   * plan = {reg (releído), openFum, dropFum (op), closeFum: {resultado}, upgrade, doc}.
   * opts.silent (aprobar en lote): sin preguntas; un control cuya FUM habría que cerrar no se marca.
   */
  function decideMark(reg, it, st, opts) {
    opts = opts || {};
    var off = it.off;
    var plan = {};
    var p = Promise.resolve(plan);
    if (fumAction(itemFum(reg, it), st) === 'ask') {
      if (opts.silent) return Promise.resolve(null);   // una FUM nunca se cierra sin preguntar
      p = askFumClose(itemFum(reg, it), st).then(function (r) {
        if (r !== 'ok') return null;
        plan.closeOk = true;
        return plan;
      });
    }
    if ((st === 'ap' || st === 'rz') && !opts.silent) {
      p = p.then(function (pl) {
        if (!pl) return null;
        return askPlano(reg, it).then(function (r) {
          if (r === null) return null;
          if (r === 'ok') pl.upgrade = true;
          else if (r === 'alt') pl.doc = docDefault(reg) || it.documento;
          return pl;
        });
      });
    }
    // mientras se preguntaba pudo terminar un envío: se vuelve a leer el registro y su FUM antes de aplicar
    var settle = function (pl) {
      if (!pl) return null;
      var r = getReg(reg.sheet, reg.key), it2 = r && itemOf(r, off);
      if (!it2 || itemState(it2) === st) return null;
      var f = itemFum(r, it2);
      pl.cancelClose = null;
      if (f.closing && f.closing.status !== 'sending' && !f.closing.sent) {
        // el cierre (o la anulación) sigue en el celular: se cancela y la FUM cuenta como abierta
        pl.cancelClose = f.closing;
        f = { pend: f.pend, server: f.server, closing: null, open: true };
      }
      var fa = fumAction(f, st);
      pl.reg = r;
      // un N° cargado a mano sin FUM conocida no abre otra; una FUM cerrada o anulada sí
      pl.openFum = st === 'rz' && !f.open && !(it2.fum && !f.server && !f.pend);
      pl.dropFum = fa === 'drop' ? f.pend : null;
      pl.closeFum = null;
      if (fa !== 'ask') return pl;
      if (pl.closeOk) { pl.closeFum = { resultado: st === 'ap' ? 'Reinspección AP' : 'Anulada' }; return pl; }
      if (opts.silent) return null;
      // la FUM salió del celular (o apareció) mientras tanto: ya no se descarta sin preguntar
      return askFumClose(f, st).then(function (a) {
        if (a !== 'ok') return null;
        pl.closeOk = true;
        return settle(pl);
      });
    };
    return p.then(settle);
  }
  /** Aviso de «Pasar a la revisión vigente» (§7.10). */
  function upgradeMsg(nd, n) {
    var ur = docRefs(nd)[0];
    return (ur ? 'Registro pasado a ' + revLabel(ur.doc[1]) : 'Plano: ' + nd) +
      (n ? ' · ' + n + (n === 1 ? ' control actualizado' : ' controles actualizados') : '');
  }
  /**
   * Aplica la marca sin preguntar, con el plan de decideMark. Devuelve lo necesario para Deshacer
   * ({patches, drop, restore}) y deja en el plan los textos de los avisos: closeMsg (cierre o anulación
   * encolados) y upgraded (registro pasado a la revisión vigente).
   */
  function applyMark(reg, off, st, plan) {
    var it = itemOf(reg, off);
    if (!it) return null;
    voidUndo(reg, off);
    var me = S.settings.inspector;
    var u = { patches: [{ sheet: reg.sheet, key: reg.key, off: off, prev: prevOf(it) }], drop: [], restore: [] };
    if (plan.cancelClose && S.queue.indexOf(plan.cancelClose) >= 0) {
      u.restore.push(plan.cancelClose);
      dropOp(plan.cancelClose);
      delete S.hold[plan.cancelClose.id];
    }
    var f = itemFum(reg, it);
    if (plan.dropFum) {
      // RZ por error corregido con el detalle abierto: la FUM nueva (retenida) se descarta y no llega al FOG 01
      u.restore = u.restore.concat(S.queue.filter(function (o) { return o === plan.dropFum || o.ref === plan.dropFum.id; }));
      dropOp(plan.dropFum);
    }
    if (plan.closeFum) {
      // reinspección (AP: se cierra) o no aplica (N/A: se anula, así el FOG 01 no dice «aprobada»).
      // Queda retenida 6 s para poder deshacer.
      var cf = closeFields(f, plan.closeFum.resultado);
      if (cf) {
        var c = queueFum(reg, it, cf);
        hold(c, 6000);
        u.drop.push(c);
        plan.closeMsg = (cf.num != null ? 'FUM N° ' + cf.num : 'La FUM') +
          (plan.closeFum.resultado === 'Anulada' ? ' se anula al enviar' : ' se cierra al enviar');
      }
    }
    if (plan.openFum) {
      var fo = queueFum(reg, it, { accion: 'abrir', obs: it.obs || '', accionInmediata: 'Reparar' });
      // retenida mientras su detalle siga abierto (§6.3): si el RZ fue un error, no llega nada al FOG 01
      S.hold[fo.id] = { since: Date.now(), until: 0, det: reg.key + ':' + off, key: reg.key };
    }
    if (st === 'rz') S.ui.open[reg.key + ':' + off] = true;
    var patch;
    if (st === 'na') {
      patch = { estado: '', fecha: 'NA', resp: it.resp || me };
    } else {
      patch = { estado: st.toUpperCase(), resp: it.resp || me };
      if (!/^\d{4}-\d{2}-\d{2}$/.test(it.fecha)) patch.fecha = today();
      var doc = plan.doc || docDefault(reg) || it.documento;
      if (doc) {
        if (plan.upgrade) {
          // «Pasar a R07 y marcar»: el registro pasa a la revisión vigente (también pendientes y N/A)
          var nd = docUpgrade(doc);
          plan.upgraded = upgradeMsg(nd, setRegDoc(reg, nd));
          doc = nd;
        }
        if (doc !== it.documento) patch.documento = doc;
      }
      if (needsSerial(it.instrumento) && instrMemo(it.instrumento)) patch.instrumento = instrMemo(it.instrumento);
    }
    editItem(reg, off, patch);
    return u;
  }
/* <reglas-liberacion> Mismo texto en Beta.gs y en la app (lo comprueba tests/reglas.test.mjs): la pantalla
 * muestra exactamente lo que el servidor va a aceptar o rechazar al liberar una etapa. */
var RL = (function () {
  var ACC = { 'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U', 'Ü': 'U', 'Ñ': 'N' };
  function t(v) { return v == null ? '' : String(v).trim(); }
  function k(v) { return t(v).toUpperCase().replace(/[ÁÉÍÓÚÜÑ]/g, function (c) { return ACC[c]; }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function valid(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return '';
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.toISOString().slice(0, 10) === s ? s : '';
  }
  /** Fecha de la planilla (aaaa-mm-dd, dd/mm/aa o dd/mm/aaaa) como aaaa-mm-dd; '' si no es una fecha real. */
  function iso(v) {
    var s = t(v);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return valid(s);
    var m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4}|\d{2})$/.exec(s);
    return m ? valid((m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(m[2]) + '-' + pad(m[1])) : '';
  }
  function ser(s) { return k(s).replace(/[^A-Z0-9]/g, ''); }
  function code(s) { return k(s).replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  /** «-», «S/N» o vacío en la columna de revisión del FOD 02: el documento no tiene revisión. */
  function noRev(r) { return /^(|-+|S\/?N|S\/?R)$/i.test(t(r)); }
  function revKey(v) {
    var s = k(v).replace(/^0+(?=\d)/, '');
    return /^\d+$/.test(s) ? [1, Number(s)] : [0, s];
  }
  function revCmp(a, b) {
    var x = revKey(a), y = revKey(b);
    if (x[0] !== y[0]) return x[0] - y[0];
    return x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0;
  }
  function revLabel(r) { var s = t(r); return /^\d$/.test(s) ? 'R0' + s : 'R' + s; }

      ev.stopPropagation();
