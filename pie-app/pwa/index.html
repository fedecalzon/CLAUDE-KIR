    var el = ev.target;
    if (el.dataset.input === 'pl-state') {
      PL.stateFilter = el.value; PL.sel = null;
      PL_ORDER.concat(['x']).forEach(function (k) { PL.hide[k] = el.value !== 'all' && el.value !== k; });
      plDraw(); return;
    }
    if (el.dataset.input === 'doccat' && picker) { picker.cat = el.value; renderDocList(); return; }
    if (el.dataset.photo) {
      S.ui.picking = 0;
      var pm = /^\/c\/([^/]+)\//.exec(S.route);
      var preg = pm && getReg(pm[1], el.dataset.key);
      if (preg) addPhotos(preg, 0, el.files || []);
      el.value = '';
      return;
    }
    var det = el.closest('.det');
    if (!det || !(el.dataset.field || el.dataset.fum)) return;
    var m = /^\/c\/([^/]+)\//.exec(S.route);
    var reg = getReg(m[1], det.dataset.key);
    if (!reg) return;
    var doff = Number(det.dataset.off);
    var dit = reg.items.filter(function (x) { return x.off === doff; })[0];
    if (el.dataset.fum) {
      var ff = {};
      ff[el.dataset.fum] = el.value.trim();
      if (el.dataset.fum === 'plazo') {
        var sf = det.querySelector('[data-sinfecha]');
        if (sf) sf.hidden = !!ff.plazo;
      }
      return editFum(reg, dit, ff);
    }
    if (el.dataset.field === 'instrumento' && needsSerial(dit.instrumento) && !needsSerial(el.value)) {
      LS.set('instr.' + normDoc(dit.instrumento), el.value);   // se recuerda para los próximos controles
    }
    if (el.dataset.field === 'obs') editFum(reg, dit, { obs: el.value.trim() });
    var patch = {};
    patch[el.dataset.field] = el.value.trim();
    editItem(reg, doff, patch);
    if (el.dataset.field === 'instrumento' || el.dataset.field === 'documento') refreshItem(getReg(m[1], det.dataset.key), doff);
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target;
    if (f.id === 'hdrForm') {
      ev.preventDefault();
      var m = /^\/c\/([^/]+)\//.exec(S.route);
      var reg = getReg(m[1], f.dataset.key);
      if (!reg) return;
      editHeader(reg, {
        elemento: f.elemento.value.trim(), piso: f.piso.value.trim(), sector: f.sector.value.trim(), etapa: f.etapa.value.trim(),
        responsables: [].slice.call(f.querySelectorAll('select[name=resp]')).map(function (s) { return s.value; })
      });
      S.ui.open['hdr:' + reg.key] = false;
      toast('Datos del registro guardados', { kind: 'ok' });
      render({ keepScroll: true });
    }
    if (f.id === 'cfgForm') {
      ev.preventDefault();
      // la validación queda debajo del campo hasta corregirla (no en un aviso que se va)
      S.ui.cfgErr = '';
      if (f.apiUrl) {
        var u = f.apiUrl.value.trim();
        if (u && /docs\.google\.com\/spreadsheets/.test(u)) S.ui.cfgErr = 'Ese es el enlace de la planilla. Va el de la app: en el PIE, menú PIE › Ver enlace de la app.';
        else if (u && !/^https?:\/\/\S+\/exec(\?\S*)?$/.test(u)) S.ui.cfgErr = 'El enlace tiene que terminar en /exec.';
        if (S.ui.cfgErr) {
          render({ keepScroll: true });
          var ue = document.querySelector('#cfgForm [name=apiUrl]');
          if (ue) { try { ue.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
          return;
        }
        S.settings.apiUrl = u;
      }
      S.settings.token = f.token.value.trim();
      saveSettings();
      render({ keepScroll: true });   // saca el error anterior; el formulario ya coincide con lo guardado
      clearOldErrors();
      toast('Probando conexión…');
      sync({ full: true, manual: true }).then(function (ok) { if (ok) { toast('Conectado al PIE', { kind: 'ok' }); render({ keepScroll: true }); } });
    }
  });

  // Enter en un buscador cierra el teclado (la lista ya está filtrada)
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.type === 'search') { ev.preventDefault(); ev.target.blur(); }
  });

  // un dibujo que se postergó porque había un campo en edición se hace al salir del campo
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (S.ui.renderOnBlur && !isEditing()) { S.ui.renderOnBlur = false; render({ keepScroll: true }); }
    }, 50);
  });

  /* Ciclo de vida: iOS congela la app en segundo plano y puede cerrarla sin aviso. */
  var swReg = null;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();   // dispara 'change': guarda lo escrito
      saveQueue();
    } else {
      onResume();
    }
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) onResume(); });
  /** Al volver a la app: se envía lo pendiente enseguida (los temporizadores estaban congelados). */
  function onResume() {
    renderTop();
    if ((navigator.onLine || IN_GAS) && S.queue.some(function (o) { return o.status === 'pending'; })) sync();
    if (swReg) { try { swReg.update().catch(function () { /* sin señal */ }); } catch (e) { /* noop */ } }
  }

  window.addEventListener('online', function () { renderTop(); sync(); });
  window.addEventListener('offline', function () { renderTop(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__piePrompt = e; });
  setInterval(function () { if (S.queue.some(function (o) { return o.status === 'pending'; }) && navigator.onLine) sync(); }, 120000);

  /* ================================================================
   *  Arranque
   * ================================================================ */
  function boot() {
    document.addEventListener('touchstart', function () {}, { passive: true });   // sin esto iOS no aplica :active
    try { history.scrollRestoration = 'manual'; } catch (e) { /* noop */ }
    applyTheme(LS.get('theme', 'auto'), true);   // color de la barra de estado si el tema está forzado
    // Configuración por enlace: index.html?api=<url>&token=<clave>
    if (MODE === 'pwa') {
      var qs = new URLSearchParams(location.search);
      if (qs.get('api')) { S.settings.apiUrl = qs.get('api'); }
      if (qs.get('token')) { S.settings.token = qs.get('token'); }
      if (qs.get('api') || qs.get('token')) {
        saveSettings();
        try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* noop */ }
      }
      if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) {
        var hadCtrl = !!navigator.serviceWorker.controller;   // primera instalación: no hay «versión nueva»
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          swReg = reg;
          if (!reg) return;
          // versión nueva instalada en segundo plano: se avisa y se ofrece recargar (§6.11)
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (!w) return;
            w.addEventListener('statechange', function () {
              if (w.state === 'activated' && hadCtrl) {
                S.updateReady = true;
                toast('Hay una versión nueva de la app', { kind: 'info', action: { label: 'Recargar', fn: function () { location.reload(); } } });
              }
            });
          });
        }, function () { /* sin SW */ });
      }
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
      var r = decodeURIComponent(location.hash.slice(1));
      if (r) S.route = r;
      // pedir que el navegador no borre lo guardado sin señal
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* noop */ }); } catch (e) { /* noop */ }
    }
    S.resolved = LS.get('resolved', {});
    Promise.all([KV.get('catalog'), KV.get('queue')]).then(function (v) {
      S.catalog = v[0] || null;
      S.queue = (v[1] || []).map(function (o) { if (o.status === 'sending') o.status = 'pending'; return o; });
      queueLoaded = true;
      migrateResolved();
      render();
      // miniaturas de las fotos pendientes: al terminar de leerlas se vuelve a dibujar (sin señal no llega otro aviso)
      Promise.all(S.queue.filter(function (o) { return o.op === 'photo'; }).map(function (o) {
        return KV.get('thumb:' + o.id).then(function (t) {
          if (t) return t;
          return KV.get(o.img).then(function (d) {
            return d ? thumbFrom(d).then(function (m) { if (m) KV.setBig('thumb:' + o.id, m).catch(function () { /* noop */ }); return m; }) : null;
          });
        }).then(function (t) { if (t) { S.thumbs[o.id] = t; return 1; } return 0; }, function () { return 0; });
      })).then(function (n) {
        if (n.some(Boolean) && /\/r\//.test(S.route)) finishRender();
      });
      if (IN_GAS || navigator.onLine) {
        sync({ full: true }).then(function () {
          if (S.catalog && !S.settings.inspector && S.route === '/') nav('/quien');
        });
      }
    });
  }
  boot();
})();
</script>
</body>
</html>
