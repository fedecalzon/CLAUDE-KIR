  /* ================================================================
   *  Eventos
   * ================================================================ */
  document.addEventListener('click', function (ev) {
    if (ev.target.id === 'modal') return closeModal();
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var a = el.dataset.act;
    var reg;
    if (a === 'back') return back();
    if (a === 'go') return nav(el.dataset.to);
    if (a === 'net') return netTap();
    if (a === 'sync') {
      // «Enviar ahora» sólo envía; «Enviar y actualizar ahora» y «Descargar el PIE» también actualizan
      var sfull = !!el.dataset.full;
      return sync(sfull ? { full: true, manual: true } : { manual: true }).then(function (ok) {
        // sólo si de verdad no quedó nada: con errores ya avisó el error, y lo retenido sale después
        if (ok && !pendingChanges() && !S.queue.some(function (o) { return o.status === 'error'; })) {
          toast(sfull ? 'Todo enviado y actualizado' : 'Todo enviado', { kind: 'ok' });
        }
      });
    }
    if (a === 'tab') { S.ui.tab[el.dataset.sheet] = el.dataset.tab; return render(); }
    if (a === 'who') {
      var wr = datos().responsables.filter(function (x) { return x.abrev === el.dataset.abrev; })[0];
      S.settings.inspector = el.dataset.abrev; saveSettings();
      toast('Vas a firmar como ' + el.dataset.abrev + (wr ? ' (' + wr.nombre + ')' : ''), { kind: 'ok' });
      return back();
    }
    if (a === 'theme') { applyTheme(el.dataset.theme); return render({ keepScroll: true }); }
    if (a === 'reload') { location.reload(); return; }
    if (a === 'install' && window.__piePrompt) { window.__piePrompt.prompt(); window.__piePrompt = null; return; }
    if (a === 'discard') {
      var did = el.dataset.id;
      var dop = S.queue.filter(function (o) { return o.id === did; })[0];
      if (!dop) return;
      return ask(discardQuestion(dop)).then(function (r) {
        if (r !== 'ok') return;
        // también lo que depende de lo descartado (p. ej. la FUM de un registro nuevo y su cierre)
        var ids = {};
        ids[did] = true;
        for (var grew = true; grew;) {
          grew = false;
          S.queue.forEach(function (o) { if (!ids[o.id] && o.ref && ids[o.ref]) { ids[o.id] = true; grew = true; } });
        }
        S.queue = S.queue.filter(function (o) {
          if (!ids[o.id]) return true;
          if (o.img) { KV.del(o.img); delete S.thumbs[o.id]; }
          delete S.hold[o.id];
          return false;
        });
        saveQueue(); render({ keepScroll: true });
      });
    }
    if (a === 'retry') {
      var rids = String(el.dataset.id || '').split(',');
      S.queue.forEach(function (o) { if (rids.indexOf(o.id) >= 0) { o.status = 'pending'; o.error = ''; } });
      saveQueue(); return sync({ manual: true });
    }
    if (a === 'closemodal' || (a === 'modalbg')) return closeModal();
    if (a === 'pkmode' && picker) {
      picker.mode = el.dataset.mode === 'add' ? 'add' : 'replace';
      [].forEach.call(el.parentNode.children, function (b) { b.setAttribute('aria-selected', String(b === el)); });
      return;
    }
    if ((a === 'pickdoc' || a === 'pickfree') && picker) {
      var val = a === 'pickfree' ? picker.q.trim() : docRef(fodDocs()[Number(el.dataset.i)]);
      var cb = picker.onPick, pmode = picker.mode;
      if (!val) return;
      closeModal();
      return cb(val, pmode);
    }
    if (a === 'rmphoto') {
      var pid = el.dataset.id;
      var findPhoto = function () { return S.queue.filter(function (o) { return o.id === pid; })[0]; };
      var po = findPhoto();
      if (!po || po.status === 'sending') return;
      return ask({ title: '¿Quitar esta foto?', body: 'Todavía no se envió; se borra del celular.', ok: { label: 'Quitar foto', tone: 'danger' } }).then(function (r) {
        po = findPhoto();
        if (r !== 'ok' || !po || po.status === 'sending') return;   // si ya se está enviando, queda
        S.queue.splice(S.queue.indexOf(po), 1);
        KV.del(po.img); delete S.thumbs[po.id];
        saveQueue();
        render({ keepScroll: true });
      });
    }
    if (a === 'docpick') {
      var mm = /^\/c\/([^/]+)\//.exec(S.route);
      if (el.dataset.target === 'new') {
        return openDocPicker({ title: 'Elegí el plano', sub: 'Última revisión de cada uno (FOD 02)', onPick: function (val) {
          var f = document.getElementById('newForm');
          if (f) { f.documento.value = val; updateNewDocChip(val); }
          toast('Plano: ' + val, { kind: 'ok' });
        } });
      }
      var rgp = mm && getReg(mm[1], el.dataset.key);
      if (!rgp) return;
      // plano del registro: reemplazar, o agregar otro (A // B) si ya tiene uno
      return openDocPicker({ title: 'Plano del registro', sub: 'Se aplica a pendientes y N/A. AP y RZ quedan con su plano.', modes: !!docDefault(rgp),
        onPick: function (val, mode) {
          var rg0 = getReg(mm[1], el.dataset.key);   // se vuelve a leer: pudo terminar un envío
          if (!rg0) return;
          var cur0 = docDefault(rg0);
          var nv = mode === 'add' && cur0 ? cur0 + ' // ' + val : val;
          var n0 = setRegDoc(rg0, nv);
          render({ keepScroll: true });
          var dr = view.querySelector('.docrow');
          if (dr) { try { dr.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
          toast('Plano: ' + nv + (n0 ? ' · aplicado a ' + n0 + (n0 === 1 ? ' control' : ' controles') : ''), { kind: 'ok' });
        } });
    }
    if (a === 'fold') {
      var fk = el.dataset.k, fi = fk.indexOf('|');
      fk = liveKey(fk.slice(0, fi)) + fk.slice(fi);   // la pantalla puede tener la clave de un alta ya creada
      S.ui.folded[fk] = !S.ui.folded[fk];
      return render({ keepScroll: true });
    }
    if (a === 'nextpend') {
      // lo que quedaba a la vista por el filtro (keep) se va: se pasa a lo que falta
      var npm = /^\/c\/[^/]+\/r\/(.+)$/.exec(S.route), npk = npm && liveKey(npm[1]);
      var npf = npk && S.ui.filter[npk];
      if (npk) S.ui.keep[npk] = {};
      // con el filtro AP, RZ o N/A no hay pendientes en pantalla: se pasa a «Pend.» y se va al primero
      var npSwitch = npf === 'ap' || npf === 'rz' || npf === 'na';
      if (npSwitch) S.ui.filter[npk] = 'pend';
      render({ keepScroll: true });
      // el próximo control pendiente debajo de lo que se está viendo (si no hay, el primero)
      var all = [].slice.call(view.querySelectorAll('.item.pend'));
      // debajo del header y de la banda de etapa, que quedan fijos arriba
      var top = document.getElementById('top').getBoundingClientRect().bottom + 48 + 8;
      var nx = npSwitch ? all[0] : all.filter(function (x) { return x.getBoundingClientRect().top > top + 10; })[0] || all[0];
      if (!nx) {
        // puede estar en una etapa plegada: desplegar todo y reintentar
        Object.keys(S.ui.folded).forEach(function (k) { S.ui.folded[k] = false; });
        render({ keepScroll: true });
        nx = document.querySelector('.item.pend');
      }
      if (nx) {
        window.scrollTo({ top: window.scrollY + nx.getBoundingClientRect().top - top, behavior: scrollMode() });
        flash(nx);
      }
      return;
    }
    if (a === 'gofum') {
      var gk = liveKey(el.dataset.key);
      S.ui.open[gk + ':' + el.dataset.off] = true;
      S.ui.focus = Number(el.dataset.off);
      S.ui.filter[gk] = 'all';   // el control de la FUM tiene que estar en la lista
      return nav('/c/' + el.dataset.sheet + '/r/' + gk);
    }
    if (a === 'goto') {
      google.script.run.irA(el.dataset.sheet, Number(el.dataset.row));
      return;
    }
    var m = /^\/c\/([^/]+)\//.exec(S.route);
    var sheet = m && m[1];
    if (el.dataset.key && sheet) reg = getReg(sheet, el.dataset.key);
    var lk = reg ? reg.key : liveKey(el.dataset.key);
    if (a === 'filter') { S.ui.filter[lk] = el.dataset.f; delete S.ui.keep[lk]; return render({ keepScroll: true }); }
    if (a === 'hdr') { S.ui.open['hdr:' + lk] = !S.ui.open['hdr:' + lk]; return render({ keepScroll: true }); }
    if (!reg) return;
    var off = Number(el.dataset.off);
    if (a === 'mark') {
      if (!S.settings.inspector) { toast('Primero elegí quién sos', { kind: 'info' }); return nav('/quien'); }
      var mst = el.dataset.st, mlk = reg.key + ':' + off, now = Date.now();
      // rebote o doble toque con guante: otro toque sobre el mismo control antes de 700 ms se ignora sin aviso
      // (el bloqueo es por control: se pueden marcar controles distintos seguidos)
      if (S.ui.lastMark[mlk] && now - S.ui.lastMark[mlk] < 700) return;
      S.ui.lastMark[mlk] = now;
      var mit = itemOf(reg, off);
      if (!mit) return;
      if (itemState(mit) === mst) { toast('Ya está en ' + EST[mst] + '. Para borrarlo: Detalle › Borrar carga.', { kind: 'info' }); return; }
      return decideMark(reg, mit, mst).then(function (plan) {
        if (!plan) return;
        var u = applyMark(plan.reg, off, mst, plan);
        keepItem(plan.reg, off);   // con un filtro puesto, lo marcado no desaparece bajo el dedo
        // dibujo completo anclado al control: contadores, etapa, subtítulo y barra quedan al día sin correrse
        render({ keepScroll: true });
        var mb = view.querySelector('#it-' + off + ' [data-st=' + mst + ']');
        if (mb) { try { mb.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
        if (u) markToasts(plan, u);
      });
    }
    if (a === 'more') {
      var k = reg.key + ':' + off;
      S.ui.open[k] = !S.ui.open[k];
      refreshItem(reg, off);
      // al cerrar el detalle se suelta la FUM nueva retenida: sale con el próximo envío
      if (!S.ui.open[k]) releaseHolds(function (h) { return h.det === k; });
      return;
    }
    if (a === 'serial') {
      // el chip «Falta N° de serie» abre el detalle directo en el instrumento
      S.ui.open[reg.key + ':' + off] = true;
      refreshItem(reg, off);
      var ssel = document.querySelector('#it-' + off + ' select[data-field=instrumento]');
      if (ssel) {
        try { ssel.focus({ preventScroll: true }); } catch (e) { /* noop */ }
        ssel.scrollIntoView({ block: 'center', behavior: scrollMode() });
      }
      return;
    }
    if (a === 'clear') {
      var cit = itemOf(reg, off);
      if (!cit) return;
      return ask(clearQuestion(itemFum(reg, cit))).then(function (r) {
        if (r !== 'ok') return;
        var cr = getReg(reg.sheet, reg.key);   // pudo terminar un envío mientras se preguntaba
        if (cr) clearItem(cr, off);           // clearItem vuelve a mirar el estado de la FUM
      });
    }
    if (a === 'docupdall') {
      var nd = docUpgrade(docDefault(reg) || '');
      toast(upgradeMsg(nd, setRegDoc(reg, nd)), { kind: 'ok' });
      return render({ keepScroll: true });
    }
    if (a === 'bulk') {
      if (!S.settings.inspector) { toast('Primero elegí quién sos', { kind: 'info' }); return nav('/quien'); }
      var bst = el.dataset.stage;
      var pendOf = function (r) { return r.items.filter(function (it) { return (it.etapa || '—') === bst && itemState(it) === 'pend'; }); };
      var bl = pendOf(reg);
      var nb = bl.length;
      if (!nb) return;
      // §6.5: plano superado primero (una sola pregunta para todo el lote; ninguna si ya eligió seguir con la vieja)
      var bpr = null;
      return askPlano(reg, bl[0]).then(function (pr) {
        if (pr === null) return null;
        bpr = pr;
        return ask({
          title: nb === 1 ? '¿Aprobar el control pendiente de ' + bst + '?' : '¿Aprobar los ' + nb + ' controles pendientes de ' + bst + '?',
          body: 'Quedan AP con fecha de hoy y RESP. ' + S.settings.inspector + '.',
          ok: { label: 'Aprobar ' + nb, tone: 'ap' }
        });
      }).then(function (r) {
        if (r !== 'ok') return;
        // se vuelve a leer: sólo lo que sigue pendiente al confirmar
        var br = getReg(reg.sheet, reg.key);
        if (!br) return;
        var upMsg = '', bdoc = docDefault(br) || bl[0].documento;
        if (bpr === 'ok' && bdoc) {
          // «Pasar a R07 y marcar»: una sola vez para todo el lote
          var bnd = docUpgrade(bdoc);
          upMsg = upgradeMsg(bnd, setRegDoc(br, bnd));
        }
        // Deshacer devuelve cada control a como estaba (el plano del registro queda en la vigente)
        var u = { patches: [], drop: [], restore: [] }, n = 0;
        var chain = Promise.resolve();
        pendOf(getReg(reg.sheet, reg.key) || br).forEach(function (bit) {
          chain = chain.then(function () {
            var r0 = getReg(reg.sheet, reg.key), i0 = r0 && itemOf(r0, bit.off);
            if (!i0) return;
            // sin preguntas: un control cuya FUM habría que cerrar queda pendiente
            return decideMark(r0, i0, 'ap', { silent: true }).then(function (plan) {
              var uu = plan && applyMark(plan.reg, bit.off, 'ap', plan);
              if (!uu) return;
              u.patches = u.patches.concat(uu.patches);
              u.drop = u.drop.concat(uu.drop);
              u.restore = u.restore.concat(uu.restore);
              keepItem(plan.reg, bit.off);
              n++;
            });
          });
        });
        return chain.then(function () {
          render({ keepScroll: true });
          if (n) offerUndo(n === 1 ? '1 control aprobado' : n + ' controles aprobados', u);
          if (upMsg) toast(upMsg, { kind: 'ok' });
        });
      });
    }
  });

  /** Hoja de «Descartar» en Ajustes › Envíos (§7.9), según el tipo de envío. */
  function discardQuestion(o) {
    var ok = { label: 'Descartar', tone: 'danger' };
    if (o.op === 'create') {
      return { title: '¿Descartar el registro nuevo «' + (o.header.elemento || 'sin elemento') + '»?',
        body: 'Se borra del celular con todo lo cargado (controles, fotos y FUM). No se puede deshacer.', ok: ok };
    }
    if (o.op === 'update') {
      var n = Object.keys(o.items || {}).length;
      var c = o.ref && pendingCreate(o.ref);
      var el = o.elemento || (c ? c.header.elemento : '') || (o.h ? 'fila ' + o.h : 'registro nuevo');
      return { title: '¿Descartar los cambios en «' + el + '»?',
        body: (n ? n + (n === 1 ? ' control' : ' controles') + '. ' : '') + 'Vuelven a como están en el PIE.', ok: ok };
    }
    if (o.op === 'photo') return { title: '¿Descartar esta foto?', body: 'Todavía no se envió.', ok: ok };
    if (o.accion === 'abrir') return { title: '¿Descartar la FUM de «' + recorte(o.criterio) + '»?', body: 'El control queda en RZ sin FUM.', ok: ok };
    return { title: '¿Descartar este cambio de la ' + (o.num ? 'FUM N° ' + o.num : 'FUM') + '?', body: 'La FUM queda como está en el FOG 01.', ok: ok };
  }

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.input === 'docq' && picker) { picker.q = el.value; renderDocList(); return; }
    // buscadores (§6.10): el campo no se vuelve a dibujar; sólo su lista, 150 ms después de la última tecla
    if (el.dataset.input === 'search' || el.dataset.input === 'regSearch') {
      if (el.dataset.input === 'search') S.ui.search = el.value; else S.ui.regSearch[el.dataset.sheet] = el.value;
      clearTimeout(searchT);
      searchT = setTimeout(refreshSearchList, 150);
      return;
    }
    if (el.name === 'documento' && el.form && el.form.id === 'newForm') updateNewDocChip(el.value);
  });
  var searchT = null;

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.input === 'doccat' && picker) { picker.cat = el.value; renderDocList(); return; }
    if (el.dataset.photo) {
      var pm = /^\/c\/([^/]+)\//.exec(S.route);
      var preg = pm && getReg(pm[1], el.dataset.key);
      if (preg) addPhotos(preg, Number(el.dataset.off), el.files || []);
      el.value = '';
      return;
    }
    var det = el.closest('.det');
    if (!det || !(el.dataset.field || el.dataset.fum)) return;
    var m = /^\/c\/([^/]+)\//.exec(S.route);
    var reg = getReg(m[1], det.dataset.key);
    if (!reg) return;
    var doff = Number(det.dataset.off);
    var dit = reg.items.filter(function (x) { return x.off === doff; })[0];
    if (el.dataset.fum) {
      var ff = {};
      ff[el.dataset.fum] = el.value.trim();
      if (el.dataset.fum === 'plazo') {
        var sf = det.querySelector('[data-sinfecha]');
        if (sf) sf.hidden = !!ff.plazo;
      }
      return editFum(reg, dit, ff);
    }
    if (el.dataset.field === 'instrumento' && needsSerial(dit.instrumento) && !needsSerial(el.value)) {
      LS.set('instr.' + normDoc(dit.instrumento), el.value);   // se recuerda para los próximos controles
    }
    if (el.dataset.field === 'obs') editFum(reg, dit, { obs: el.value.trim() });
    var patch = {};
    patch[el.dataset.field] = el.value.trim();
    editItem(reg, doff, patch);
    if (el.dataset.field === 'instrumento' || el.dataset.field === 'documento') refreshItem(getReg(m[1], det.dataset.key), doff);
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target;
    if (f.id === 'hdrForm') {
      ev.preventDefault();
      var m = /^\/c\/([^/]+)\//.exec(S.route);
      var reg = getReg(m[1], f.dataset.key);
      if (!reg) return;
      editHeader(reg, {
        elemento: f.elemento.value.trim(), piso: f.piso.value.trim(), sector: f.sector.value.trim(), etapa: f.etapa.value.trim(),
        responsables: [].slice.call(f.querySelectorAll('select[name=resp]')).map(function (s) { return s.value; })
      });
      S.ui.open['hdr:' + reg.key] = false;
      toast('Datos del registro guardados', { kind: 'ok' });
      render({ keepScroll: true });
    }
    if (f.id === 'cfgForm') {
      ev.preventDefault();
      // la validación queda debajo del campo hasta corregirla (no en un aviso que se va)
      S.ui.cfgErr = '';
      if (f.apiUrl) {
        var u = f.apiUrl.value.trim();
        if (u && /docs\.google\.com\/spreadsheets/.test(u)) S.ui.cfgErr = 'Ese es el enlace de la planilla. Va el de la app: en el PIE, menú PIE › Ver enlace de la app.';
        else if (u && !/^https?:\/\/\S+\/exec(\?\S*)?$/.test(u)) S.ui.cfgErr = 'El enlace tiene que terminar en /exec.';
        if (S.ui.cfgErr) {
          render({ keepScroll: true });
          var ue = document.querySelector('#cfgForm [name=apiUrl]');
          if (ue) { try { ue.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
          return;
        }
        S.settings.apiUrl = u;
      }
      S.settings.token = f.token.value.trim();
      saveSettings();
      render({ keepScroll: true });   // saca el error anterior; el formulario ya coincide con lo guardado
      toast('Probando conexión…');
      sync({ full: true, manual: true }).then(function (ok) { if (ok) { toast('Conectado al PIE', { kind: 'ok' }); render({ keepScroll: true }); } });
    }
  });

  // Enter en un buscador cierra el teclado (la lista ya está filtrada)
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.type === 'search') { ev.preventDefault(); ev.target.blur(); }
  });

  // un dibujo que se postergó porque había un campo en edición se hace al salir del campo
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (S.ui.renderOnBlur && !isEditing()) { S.ui.renderOnBlur = false; render({ keepScroll: true }); }
    }, 50);
  });

  /* Ciclo de vida: iOS congela la app en segundo plano y puede cerrarla sin aviso. */
  var swReg = null;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();   // dispara 'change': guarda lo escrito
      saveQueue();
    } else {
      onResume();
    }
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) onResume(); });
  /** Al volver a la app: se envía lo pendiente enseguida (los temporizadores estaban congelados). */
  function onResume() {
    renderTop();
    if ((navigator.onLine || IN_GAS) && S.queue.some(function (o) { return o.status === 'pending'; })) sync();
    if (swReg) { try { swReg.update().catch(function () { /* sin señal */ }); } catch (e) { /* noop */ } }
  }

  window.addEventListener('online', function () { renderTop(); sync(); });
  window.addEventListener('offline', function () { renderTop(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__piePrompt = e; });
  setInterval(function () { if (S.queue.some(function (o) { return o.status === 'pending'; }) && navigator.onLine) sync(); }, 120000);

  /* ================================================================
   *  Arranque
   * ================================================================ */
  function boot() {
    document.addEventListener('touchstart', function () {}, { passive: true });   // sin esto iOS no aplica :active
    try { history.scrollRestoration = 'manual'; } catch (e) { /* noop */ }
    applyTheme(LS.get('theme', 'auto'), true);   // color de la barra de estado si el tema está forzado
    // Configuración por enlace: index.html?api=<url>&token=<clave>
    if (MODE === 'pwa') {
      var qs = new URLSearchParams(location.search);
      if (qs.get('api')) { S.settings.apiUrl = qs.get('api'); }
      if (qs.get('token')) { S.settings.token = qs.get('token'); }
      if (qs.get('api') || qs.get('token')) {
        saveSettings();
        try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* noop */ }
      }
      if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) {
        navigator.serviceWorker.register('sw.js').then(function (reg) { swReg = reg; }, function () { /* sin SW */ });
      }
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
      var r = decodeURIComponent(location.hash.slice(1));
      if (r) S.route = r;
      // pedir que el navegador no borre lo guardado sin señal
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* noop */ }); } catch (e) { /* noop */ }
    }
    S.resolved = LS.get('resolved', {});
    Promise.all([KV.get('catalog'), KV.get('queue')]).then(function (v) {
      S.catalog = v[0] || null;
      S.queue = (v[1] || []).map(function (o) { if (o.status === 'sending') o.status = 'pending'; return o; });
      queueLoaded = true;
      migrateResolved();
      render();
      S.queue.filter(function (o) { return o.op === 'photo'; }).forEach(function (o) {
        KV.get(o.img).then(function (d) { if (d) { S.thumbs[o.id] = d; } });
      });
      if (IN_GAS || navigator.onLine) {
        sync({ full: true }).then(function () {
          if (S.catalog && !S.settings.inspector && S.route === '/') nav('/quien');
        });
      }
    });
  }
  boot();
})();
</script>
</body>
