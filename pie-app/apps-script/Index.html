    if (r.code === 'conflict' && (op.op === 'create' || op.op === 'update')) return ERR.conflict;
    return null;
  }

  function callApi(req) {
    req.token = S.settings.token || '';
    if (IN_GAS) {
      return new Promise(function (res, rej) {
        google.script.run
          .withSuccessHandler(function (r) { r && r.ok ? res(r) : rej(apiFail(r)); })
          .withFailureHandler(function () { rej(apiError(ERR.network, 'network')); })
          .api(req);
      });
    }
    var url = (S.settings.apiUrl || '').trim();
    if (!url) return Promise.reject(apiError(ERR.noUrl, 'config'));
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 90000);

    p = fetch(url, {
      method: 'POST', redirect: 'follow', signal: ctl && ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(req)

    return p.then(function (r) {
      clearTimeout(t);
      return r.text().then(function (txt) {
        var data;
        try { data = JSON.parse(txt); } catch (e) {
          throw apiError(ERR.notJson, 'config');
        }
        if (!data || !data.ok) throw apiFail(data);
        return data;
      });
    }, function () {
      clearTimeout(t);
      throw apiError(ERR.network, 'network');
    });
  }

  function mergeCategories(cats) {
    if (!S.catalog || !cats) return;
    cats.forEach(function (c) {
      var i = S.catalog.categorias.findIndex(function (x) { return x.sheet === c.sheet; });
      if (i >= 0) S.catalog.categorias[i] = c; else S.catalog.categorias.push(c);

  function stripOp(o) {

  /** Aviso del PIE en palabras de obra (§7.8). */

  /*

  function handleResults(res) {
    var errors = [];

    res.results.forEach(function (r) {
      var op = S.queue.filter(function (o) { return o.id === r.id; })[0];
      if (!op) return;
      if (r.ok) {
        if (op.op === 'create') S.resolved[op.id] = { sheet: r.sheet || op.sheet, h: r.h };

        (r.warnings || []).forEach(function (w) { toast(warnText(w), { kind: 'warn' }); });
        if (op.op === 'fum' && op.accion === 'abrir' && r.fum != null && !r.dup) fumNums.push(r.fum);

  /** Sube las fotos pendientes de a una (cada una es una request chica). */
  function sendPhotos() {
    var list = S.queue.filter(function (o) { return o.op === 'photo' && o.status === 'pending'; });
    return list.reduce(function (p, o) {
      return p.then(function () {
        if (o.ref && pendingCreate(o.ref)) return; // espera a que exista el registro
        return KV.get(o.img).then(function (data) {
          if (!data) { o.status = 'error'; o.error = ERR.photoLost; saveQueue(); return; }
          o.status = 'sending';
          renderTop();
          var payload = stripOp(o);
          payload.data = String(data).split(',')[1];
          return callApi({ action: 'batch', ops: [payload] }).then(handleResults, function (e) {
            if (o.status === 'sending') o.status = 'pending';

          });
        });
      });
    }, Promise.resolve());

  var syncWaiters = [];
  var weakT = null;
  function sync(opts) {
    opts = opts || {};
    if (S.syncing) return new Promise(function (r) { syncWaiters.push(r); });
    if (!navigator.onLine && !IN_GAS) { renderTop(); return Promise.resolve(false); }
    S.syncing = true;
    S.syncSince = Date.now();
    S.lastError = '';
    S.lastErrorCode = '';
    // si a los 15 s sigue enviando, el indicador pasa a «Señal débil»
    clearTimeout(weakT);
    weakT = setTimeout(function () { if (S.syncing) renderTop(); }, 15100);
    renderTop();
    // primera descarga: «Sin datos» pasa a «Descargando el PIE…»
    if (!S.catalog && S.route !== '/ajustes') render();
    var t0 = Date.now();
    // primero altas y cambios en un solo lote; las fotos van después, de a una. Lo retenido espera.
    var sending = S.queue.filter(function (o) { return o.status === 'pending' && o.op !== 'photo' && !isHeld(o); });
    var chain = Promise.resolve();
    if (sending.length) {
      sending.forEach(function (o) { o.status = 'sending'; });
      saveQueue();
      chain = callApi({ action: 'batch', ops: sending.map(stripOp) }).then(handleResults, function (e) {
        sending.forEach(function (o) { if (o.status === 'sending') o.status = 'pending'; });
        saveQueue();
        throw e;
      });
    }
    return chain.then(sendPhotos).then(function () {
      if (opts.full || !S.catalog || Date.now() - S.lastSync > 10 * 60 * 1000) {
        return callApi({ action: 'catalog' }).then(function (c) {
          S.catalog = c;
          KV.set('catalog', c).catch(function () { /* se vuelve a descargar */ });
        });
      }
    }).then(function () {
      S.lastSync = Date.now();
      LS.set('lastSync', S.lastSync);
      return true;
    }).catch(function (e) {
      S.lastError = e.message;
      S.lastErrorCode = e.code || '';   // sólo en memoria: decide el estado del indicador
      if (e.code === 'auth' || e.code === 'config' || opts.manual) toast(e.message, { kind: 'err' });
      return false;
    }).then(function (ok) {
      S.syncing = false;
      clearTimeout(weakT);
      // altas confirmadas: las claves 'p' + id pasan a 'h' + fila (lo abierto, el filtro, el plano…)
      migrateResolved();
      // si el usuario estaba viendo un alta que ya se creó, la ruta pasa al registro real sin
      // volver a dibujar desde arriba (nunca nav() ni scrollTo(0, 0))
      var m = /^\/c\/([^/]+)\/r\/p(.+)$/.exec(S.route);
      if (m && S.resolved[m[2]] && !pendingCreate(m[2])) {
        S.route = '/c/' + m[1] + '/r/h' + S.resolved[m[2]].h;
        if (!IN_GAS) { try { history.replaceState(null, '', '#' + S.route); } catch (e) { /* iframe */ } }
      }
      finishRender();   // no pisa lo que se está escribiendo ni corta un desplazamiento
      // lo que entró (o se liberó) mientras se enviaba sale enseguida, sin esperar otro aviso
      if (ok && S.queue.some(function (o) {
        return o.status === 'pending' && !isHeld(o) && (o.createdAt >= t0 || (o.op !== 'photo' && sending.indexOf(o) < 0));
      })) { clearTimeout(autoSyncT); autoSyncT = setTimeout(sync, 300); }
      syncWaiters.splice(0).forEach(function (r) { r(ok); });
      return ok;
    });
  }

  /*
   * Dibujo que no pidió el usuario (al terminar un envío, §6.8). Mientras la pantalla se desplaza espera
   * (dibujar ahí frena en seco el desplazamiento por inercia de iOS). Con un campo en edición o un buscador
   * enfocado sólo se actualiza el header: el resto se dibuja al salir del campo (renderOnBlur).
   */
  var lastScroll = 0, finT = null;
  window.addEventListener('scroll', function () { lastScroll = Date.now(); }, { passive: true });
  function finishRender() {
    clearTimeout(finT);
    if (Date.now() - lastScroll < 400) { renderTop(); finT = setTimeout(finishRender, 400); return; }
    var a = document.activeElement;
    if (isEditing()) {
      renderTop();
      S.ui.renderOnBlur = true;
      return;
    }
    // buscador enfocado (§6.10): sólo su lista; el campo, el teclado y el dictado siguen como estaban
    if (a && view.contains(a) && a.type === 'search') {
      renderTop();
      refreshSearchList();
      return;
    }
    render({ keepScroll: true });
  }

  /* ================================================================
   *  Navegación
   * ================================================================ */
  /*
   * El navegador no restaura el desplazamiento (history.scrollRestoration = 'manual'): se guarda
   * por ruta al salir y se repone al volver atrás. Hacia adelante, la pantalla nueva arranca arriba.
   */
  function nav(route, o) {
    o = o || {};
    if (route === S.route) return render();
    S.scroll[S.route] = window.scrollY;
    if (!o.replace) S.stack.push(S.route);
    S.route = route;
    if (!IN_GAS) {
      try { history[o.replace ? 'replaceState' : 'pushState'](null, '', '#' + route); } catch (e) { /* iframe */ }
    }
    window.scrollTo(0, 0);   // antes de dibujar: así no pisa un desplazamiento hecho al dibujar (p. ej. ir a una FUM)
    render();
  }
  function back() {
    if (!IN_GAS && S.stack.length) { history.back(); return; }
    var prev = S.stack.pop();
    S.route = prev || parentOf(S.route);
    render();
    window.scrollTo(0, S.scroll[S.route] || 0);
  }
  function parentOf(r) {
    var m;
    if ((m = /^\/c\/([^/]+)\/.+/.exec(r))) return '/c/' + m[1];
    return '/';
  }
  window.addEventListener('popstate', function () {
    if (askCur) askCur(null);   // volver atrás con una hoja abierta = Cancelar
    if (picker) { closeModal(); }
    S.scroll[S.route] = window.scrollY;
    S.stack.pop();
    S.route = decodeURIComponent(location.hash.slice(1)) || '/';
    render();
    window.scrollTo(0, S.scroll[S.route] || 0);
  });

  /* ================================================================
   *  Render
   * ================================================================ */
  var view = document.getElementById('view');

  /*
   * Cambios guardados sólo en el celular (§4.2): cuenta cambios, no operaciones de la cola.
   * Las operaciones con error no cuentan acá (tienen su propio estado). Lo retenido sí cuenta.
   */
  function pendingChanges() {
    return S.queue.reduce(function (n, o) {
      if (o.status === 'error') return n;
      if (o.op === 'create') {
        return n + 1 + Object.keys(o.items || {}).filter(function (off) {
          return Object.keys(o.items[off]).some(function (k) { return FIELDS.indexOf(k) >= 0 && k !== 'documento'; });
        }).length;
      }
      if (o.op === 'update') return n + (Object.keys(o.items || {}).length || 1);
      return n + 1;   // foto o FUM
    }, 0);
  }
  /** Estado del indicador de envíos (§4.2): gana la primera condición que se cumple. */
  function netState() {
    var n = pendingChanges();
    var nErr = S.queue.filter(function (o) { return o.status === 'error'; }).length;
    var online = IN_GAS || navigator.onLine;
    var q = n ? ' q' : '';
    var s;
    if (S.syncing) {
      var slow = Date.now() - S.syncSince >= 15000;
      s = n ? { lbl: (slow ? 'Señal débil' : 'Enviando…') + ' · ', cnt: n } : { lbl: 'Actualizando…', cnt: '' };
      s.cls = 'busy' + q; s.icon = 'sync'; s.act = '';
    } else if (S.lastErrorCode === 'auth' || S.lastErrorCode === 'config') {
      s = { cls: 'fix', icon: 'alert', lbl: 'Revisar conexión', cnt: '', act: 'conexion' };
    } else if (nErr) {
      s = { cls: 'err', icon: 'alert', lbl: 'Con error · ', cnt: nErr, act: 'envios' };
    } else if (!online) {
      s = { cls: 'off' + q, icon: 'cloud-off', lbl: n ? 'Sin señal · ' : 'Sin señal', cnt: n || '', act: 'offline' };
    } else if (S.lastError) {
      s = { cls: 'weak' + q, icon: 'cloud-off', lbl: n ? 'No conecta · ' : 'No conecta', cnt: n || '', act: 'send' };
    } else if (n) {
      s = { cls: 'pend q', icon: 'cloud-up', lbl: 'Sin enviar · ', cnt: n, act: 'send' };
    } else {
      s = { cls: 'ok', icon: 'cloud-ok', lbl: 'Al día', cnt: '', act: 'full' };
    }
    s.n = n;
    // el nombre accesible contiene el texto visible (WCAG 2.5.3)
    var unit = function (k, one, many) { return k + (k === 1 ? one : many); };
    s.aria = 'Envíos: ' + s.lbl + (s.cnt === '' ? (n ? ' · ' + unit(n, ' cambio', ' cambios') + ' sin enviar' : '')
      : s.cls === 'err' ? unit(s.cnt, ' envío', ' envíos') : unit(s.cnt, ' cambio', ' cambios'));
    return s;
  }
  /** Tocar el indicador: lleva a lo que hay que resolver, explica que no hay señal o envía ahora. */
  function netTap() {
    var s = netState();
    if (!s.act) return;   // ya está enviando
    if (s.act === 'conexion' || s.act === 'envios') { nav('/ajustes'); scrollToId(s.act); return; }
    if (s.act === 'offline') {
      toast(!s.n ? 'Sin señal. Lo que cargues queda en el celular.'
        : s.n === 1 ? 'Sin señal. Tu cambio queda en el celular y se envía solo al volver la señal.'
        : 'Sin señal. Tus ' + s.n + ' cambios quedan en el celular y se envían solos al volver la señal.', { kind: 'info' });
      return;
    }
    sync(s.act === 'full' ? { full: true, manual: true } : { manual: true });
  }
  /** Desplaza hasta una sección dejándola justo debajo del header fijo. */
  function scrollToId(id) {
    var t = document.getElementById(id);
    if (!t) return;
    var lim = document.getElementById('top').getBoundingClientRect().bottom + 8;
    window.scrollTo(0, Math.max(0, window.scrollY + t.getBoundingClientRect().top - lim));
  }

  /*
   * Header (§4.1). Volver: en todas las pantallas salvo Inicio y «Sin datos». Engranaje: sólo en
   * Inicio, «Sin datos» y FUM; en el resto el lugar es del título (Ajustes también se abre desde el
   * indicador cuando hay que revisar algo).
   */
  function renderTop(title, sub) {
    var top = document.getElementById('top');
    if (title !== undefined) { top.dataset.title = title; top.dataset.sub = sub || ''; }
    var noData = !S.catalog && S.route !== '/ajustes';
    var root = S.route === '/' || noData;
    var gear = root || S.route === '/fum';
    var s = netState();
    top.innerHTML =
      (root ? '' : '<button class="back" data-act="back" aria-label="Volver">' + ic('back', 'ic-24') + '</button>') +
      '<div class="ttl"><b>' + esc(top.dataset.title || 'PIE · Carga') + '</b><small>' + esc(top.dataset.sub || '') + '</small></div>' +
      '<button class="net ' + s.cls + '" data-act="net" aria-label="' + esc(s.aria) + '">' + ic(s.icon) +
      '<span class="lbl">' + esc(s.lbl) + '</span>' + (s.cnt === '' ? '' : '<span class="cnt">' + s.cnt + '</span>') + '</button>' +
      (gear ? '<button class="icon-btn" data-act="go" data-to="/ajustes" aria-label="Ajustes">' + ic('settings', 'ic-24') + '</button>' : '');
  }

  /** Barra inferior acoplada (§4.10): va dentro de #view, como último hijo. */
  function bbar(inner) { return '<div class="bbar"><div class="bbar-in">' + inner + '</div></div>'; }

  /*
   * La barra se oculta con el teclado (visualViewport: en iOS el teclado achica sólo la vista
   * visible; con focusin se ocultaría también al enfocar sin teclado) y mientras un detalle
   * de control está a la vista (no alcanza con «hay uno abierto»: tras un RZ queda abierto).
   */
  var vv = window.visualViewport;
  function kbCheck() { document.body.classList.toggle('kb', !!vv && (window.innerHeight - vv.height * vv.scale) > 150); }
  if (vv) vv.addEventListener('resize', function () { kbCheck(); fitPicker(); });
  var detIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { e.target._vis = e.isIntersecting; });
    document.body.classList.toggle('det-vis', [].some.call(view.querySelectorAll('.det'), function (d) { return d._vis; }));
  }) : null;
  function watchDets() {
    if (!detIO) return;
    detIO.disconnect();
    var dets = view.querySelectorAll('.det');
    // si hay detalles, la clase la corrige el primer aviso del observador (así la barra no parpadea)
    if (!dets.length) { document.body.classList.remove('det-vis'); return; }
    [].forEach.call(dets, function (d) { detIO.observe(d); });
  }
  /** Después de cada render(): reserva el lugar de la barra y vigila los detalles abiertos. */
  function afterRender() {
    document.body.classList.toggle('has-bbar', !!view.querySelector('.bbar'));
    watchDets();
  }

  /** Pantalla de una ruta; un alta ya creada ('p' + id) es la misma pantalla que su fila ('h' + fila). */
  function screenOf(route) {
    var m = /^\/c\/([^/]+)\/r\/(.+)$/.exec(route);
    return m ? '/c/' + m[1] + '/r/' + liveKey(m[2]) : route;
  }
  /*
   * Al salir de un registro (§6.8): se vacía su keep y se sueltan las retenciones de sus detalles
   * (la FUM nueva queda confirmada y sale con el próximo envío).
   */
  var shownScreen = null;
  function checkLeave() {
    var prev = shownScreen;
    shownScreen = screenOf(S.route);
    var m = prev && /^\/c\/[^/]+\/r\/(.+)$/.exec(prev);
    if (!m || screenOf(prev) === shownScreen) return;
    var old = liveKey(m[1]);
    delete S.ui.keep[old];
    releaseHolds(function (h) { return !!h.det && h.key === old; });
  }
  /** Primer control a la vista debajo del header y de la banda de etapa (para anclar el dibujo). */
  function itemAnchor() {
    var lim = document.getElementById('top').getBoundingClientRect().bottom + 48, a = null;
    [].some.call(view.querySelectorAll('.item'), function (el) {
      var rc = el.getBoundingClientRect();
      if (rc.bottom > lim) { a = { id: el.id, top: rc.top }; return true; }
    });
    return a;
  }

  /*
   * Dibuja la pantalla de la ruta actual. keepScroll: queda anclado al primer control a la vista (§6.8),
   * así no se corre aunque arriba aparezca o desaparezca algo (Safari no compensa); sin controles,
   * se conserva el desplazamiento.
   */
  function render(o) {
    o = o || {};
    S.ui.renderOnBlur = false;
    clearTimeout(finT);   // lo que esperaba para dibujarse ya queda dibujado ahora
    checkLeave();
    var y = window.scrollY;
    var r = S.route, m;
    var scr0 = screenOf(r);
    var anchor = o.keepScroll ? itemAnchor() : null;
    if (!S.catalog && r !== '/ajustes') {
      renderTop('PIE · Carga', 'Plan de Inspección y Ensayo');
      // Sin datos y primera descarga (§5.1)
      view.innerHTML = S.syncing
        ? emptyHtml('Descargando el PIE… puede tardar hasta un minuto.', 'sync', true)
        : '<div class="empty"><div class="ico">' + ic('download', 'ic-24') + '</div>' +
          '<p>Todavía no hay datos en este celular. Hace falta señal una sola vez; después funciona sin conexión.</p>' +
          (S.lastError ? noteHtml('err', esc(S.lastError)) : '') +
          '<div class="empty-btns"><button type="button" class="btn primary lg" data-act="sync" data-full="1" data-manual="1">Descargar el PIE</button>' +
          (MODE === 'pwa' ? '<button type="button" class="btn" data-act="go" data-to="/ajustes">Configurar conexión</button>' : '') + '</div></div>';
      afterRender();
      return;
    }
    if (r === '/') renderHome();
    else if (r === '/ajustes') renderSettings();
    else if (r === '/quien') renderWho();
    else if (r === '/fum') renderFum();
    else if ((m = /^\/c\/([^/]+)$/.exec(r))) renderCategory(m[1]);
    else if ((m = /^\/c\/([^/]+)\/nuevo$/.exec(r))) renderNew(m[1]);
    else if ((m = /^\/c\/([^/]+)\/r\/([ph].+)$/.exec(r))) renderReg(m[1], m[2]);
    else { S.route = '/'; renderHome(); }
    afterRender();
    // si al dibujar se pasó a otra pantalla (p. ej. el registro ya no existe), esa arranca donde la dejó nav()
    if (o.keepScroll && screenOf(S.route) === scr0) {
      var n = anchor && document.getElementById(anchor.id);
      if (n) window.scrollBy(0, n.getBoundingClientRect().top - anchor.top);
      else window.scrollTo(0, y);
    }
  }

  /* ---------- Piezas comunes de las pantallas (§4.14) ---------- */
  var NO_MODEL = 'Esta planilla todavía no tiene registros para usar de modelo. Cargá el primero en el PIE desde la computadora.';
  var NOTE_IC = { info: 'info', warn: 'alert', err: 'alert' };
  /** Nota con ícono a la izquierda y el contenido (HTML ya escapado) en un bloque aparte. */
  function noteHtml(kind, inner, icon) {
    return '<div class="note ' + kind + '">' + ic(icon || NOTE_IC[kind] || 'info') + '<div>' + inner + '</div></div>';
  }
  function chipHtml(cls, txt) { return '<span class="chip ' + cls + '">' + esc(txt) + '</span>'; }
  function emptyHtml(txt, icon, spin) {
    return '<div class="empty">' + (icon ? '<div class="ico' + (spin ? ' spin' : '') + '">' + ic(icon, 'ic-24') + '</div>' : '') + '<p>' + esc(txt) + '</p></div>';
  }
  function searchTerms(s) { return norm(String(s || '').trim()).split(/\s+/).filter(Boolean); }

  /* ---------- Inicio (§5.3) ---------- */
  /*
   * El buscador se dibuja una sola vez; al escribir sólo se reemplaza #homeList (§6.10), así el teclado
   * y el dictado no se cortan, ni siquiera cuando termina un envío.
   */
  function renderHome() {
    var d = datos();
    renderTop(d.obra || 'PIE · Carga', 'PIE · FOP 01');
    var html = '<label class="search-box top-search">' + ic('search') +
      '<input class="search" type="search" data-input="search" aria-label="Buscar planilla" placeholder="Buscar planilla (ej. hormigón, 28)"' +
      ' enterkeyhint="search" autocomplete="off" autocorrect="off" value="' + esc(S.ui.search) + '"></label>';
    if (MODE === 'pwa' && !isStandalone()) {
      html += noteHtml('warn', 'Instalá la app: en Safari, Compartir › Agregar a inicio. Así no se borra lo cargado sin señal.', 'download');
    }
    if (!S.settings.inspector) {
      html += noteHtml('info', '<p>Elegí quién sos: tus iniciales se cargan solas en RESP.</p>' +
        '<div class="btns"><button class="btn sm" data-act="go" data-to="/quien">Elegir</button></div>');
    }
    view.innerHTML = html + '<div id="homeList">' + homeListHtml() + '</div>';
  }
  /** Lo que cambia con la búsqueda o con un envío: estado de las FUM, planillas por rubro, ocultas y pie. */
  function homeListHtml() {
    var raw = String(S.ui.search || '').trim();
    var terms = searchTerms(raw);
    var groups = {};
    var order = [];
    var hidden = [];
    S.catalog.categorias.forEach(function (c) {
      var hay = norm(c.sheet + ' ' + c.titulo);
      if (terms.length && !terms.every(function (t) { return hay.indexOf(t) >= 0; })) return;
      if (c.oculta && !terms.length && !hasLocal(c.sheet)) { hidden.push(c); return; }
      if (!groups[c.rubro]) { groups[c.rubro] = []; order.push(c.rubro); }
      groups[c.rubro].push(c);
    });
    // mientras se busca, la lista arranca directo con las planillas
    var html = terms.length ? '' : fumStatusRow();
    order.forEach(function (g) {
      html += '<h2 class="sec">' + esc(g) + '</h2><div class="list">' + groups[g].map(catRow).join('') + '</div>';
    });
    if (hidden.length) {
      html += '<details class="hid ocultas"><summary class="row">' + '<span class="grow t16">' + esc('Planillas ocultas · ' + hidden.length) + '</span>' +
        ic('chev-d', 'chev') + '</summary><div class="list">' + hidden.map(catRow).join('') + '</div></details>';
    }
    if (terms.length && !order.length && !hidden.length) {
      html += emptyHtml('No hay planillas con «' + raw + '». Probá con el número (28) o una palabra (hormigón).', 'search');
    }
    var s = ago(S.lastSync);
    html += '<p class="help center foot">' + esc((s === 'nunca' ? 'Sin actualizar' : 'Actualizado ' + (/^(hace|recién)/.test(s) ? s : 'el ' + s)) + ' · v' + APP_VERSION) + '</p>';
    return html;
  }
  /** Estado de las FUM (V15, FLOW-17): una línea discreta si no hay abiertas; roja si hay. Siempre lleva a /fum. */
  function fumStatusRow() {
    var of = openFums(), t = today();
    if (!of.length) {
      return '<button class="row slim" data-act="go" data-to="/fum">' + ic('check-circle', 't-ap') + '<span class="grow t16">Sin FUM abiertas</span>' + ic('chev-r', 'chev') + '</button>';
    }
    var venc = of.filter(function (f) { return f.plazo && f.plazo < t; }).length;
    var sinF = of.filter(function (f) { return !f.plazo; }).length;
    var meta = [venc ? venc + (venc === 1 ? ' vencida' : ' vencidas') : '', sinF ? sinF + ' sin fecha de reinspección' : ''].filter(Boolean).join(' · ') || 'Ninguna vencida';
    return '<button class="row alert" data-act="go" data-to="/fum">' + ic('alert') + '<span class="grow"><span class="ttl2">' +
      esc(of.length === 1 ? '1 FUM abierta' : of.length + ' FUM abiertas') + '</span><span class="meta">' + esc(meta) + '</span></span>' + ic('chev-r', 'chev') + '</button>';
  }
  function isStandalone() {
    try { return !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); } catch (e) { return false; }
  }
  function hasLocal(sheet) { return S.queue.some(function (o) { return o.sheet === sheet; }); }
  /** Fila de planilla: número como etiqueta, título tal cual viene del PIE, cantidad como texto y chips sólo de estado. */
  function catRow(c) {
    var regs = c.registros;
    var local = S.queue.filter(function (o) { return o.sheet === c.sheet && o.op === 'create'; }).length;
    var usedRegs = regs.filter(function (r) { return r.elemento || r.piso || r.items.some(function (x) { return x[5] || x[3]; }); });
    var used = usedRegs.length;
    var inProgress = usedRegs.filter(function (r) {
      return r.items.some(function (x) { return !String(x[5]).trim() && String(x[3]).toUpperCase() !== 'NA'; });
    }).length;
    var supers = usedRegs.filter(function (r) { var n = regDocAlerts(r.items.map(rawItem)); return n.bad || n.old; }).length;
    var fumN = fumsAll().filter(function (f) { return f[1] === c.sheet && f[5] === 'Abierta'; }).length;
    var chips = (inProgress && used ? chipHtml('pend', inProgress + ' con pendientes') : '') +
      (fumN ? chipHtml('rz', fumN + (fumN === 1 ? ' FUM abierta' : ' FUM abiertas')) : '') +
      (supers ? '<span class="chip rz">' + ic('alert', 'ic-16') + esc(supers + ' con plano superado') + '</span>' : '') +
      (local ? chipHtml('sync', local + (local === 1 ? ' nuevo sin enviar' : ' nuevos sin enviar')) : '') +
      (c.oculta ? chipHtml('', 'Oculta') : '');
    return '<button class="row" data-act="go" data-to="/c/' + esc(c.sheet) + '">' +
      '<span class="tag solid">' + esc(c.sheet) + '</span><span class="grow"><span class="ttl2">' + esc(c.titulo) + '</span>' +
      '<span class="meta">' + used + (used === 1 ? ' registro' : ' registros') + '</span>' +
      (chips ? '<span class="chips">' + chips + '</span>' : '') + '</span>' + ic('chev-r', 'chev') + '</button>';
  }

  /* ---------- Planilla: registros y requisitos (§5.4) ---------- */
  function renderCategory(sheet) {
    var cat = category(sheet);
    if (!cat) { nav('/', { replace: true }); return; }
    renderTop(cat.titulo, 'Planilla ' + cat.sheet + (cat.rubro ? ' · ' + cat.rubro : ''));
    var tab = S.ui.tab[sheet] || 'reg';
    var tabBtn = function (k, label) {
      return '<button type="button" role="tab" aria-selected="' + (tab === k) + '" data-act="tab" data-sheet="' + esc(sheet) + '" data-tab="' + k + '">' + label + '</button>';
    };
    var html = '<div class="seg" role="tablist" aria-label="' + esc('Planilla ' + cat.sheet) + '">' + tabBtn('reg', 'Registros') + tabBtn('req', 'Requisitos') + '</div>';
    html += tab === 'reg' ? regTab(sheet) : reqList(sheet);
    // sin registros no hay modelo para copiar: sin barra (.fab se conserva como gancho; ya no flota)
    if (cat.registros.length) html += bbar('<button class="fab btn primary lg block" data-act="go" data-to="/c/' + esc(sheet) + '/nuevo">' + ic('plus') + 'Nuevo registro</button>');
    view.innerHTML = html;
  }
  /** Pestaña Registros: el buscador (si hay más de 5) se dibuja una vez y la lista va en #regListBox (§6.10). */
  function regTab(sheet) {
    var regs = listRegs(sheet);
    var html = '';
    if (regs.length > 5) {
      html += '<label class="search-box top-search">' + ic('search') + '<input class="search" type="search" data-input="regSearch" data-sheet="' + esc(sheet) + '"' +
        ' aria-label="Buscar registro" placeholder="Buscar elemento, piso o sector" enterkeyhint="search" autocomplete="off" autocorrect="off"' +
        ' value="' + esc(S.ui.regSearch[sheet] || '') + '"></label>';
    }
    if (category(sheet).oculta) html += noteHtml('warn', 'Esta planilla está oculta en el PIE. Se vuelve a mostrar al crear un registro.', 'info');
    return html + '<div id="regListBox">' + regListHtml(sheet, regs) + '</div>';
  }
  function regListHtml(sheet, regs) {
    regs = regs || listRegs(sheet);
    if (!regs.length) return emptyHtml(NO_MODEL, 'doc');
    var raw = regs.length > 5 ? String(S.ui.regSearch[sheet] || '').trim() : '';
    var terms = searchTerms(raw);
    var shown = regs.filter(function (r) {
      var hay = norm([r.elemento, r.piso, r.sector, r.etapa].join(' '));
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
    if (!shown.length) return emptyHtml('Ningún registro coincide con «' + raw + '».', 'search');
    return '<div class="list">' + shown.map(regRow).join('') + '</div>';
  }
  /** Fila de registro: elemento, dónde está, chips de estado y la barra de avance con hechos/total. */
  function regRow(r) {
    var s = stats(r.items);
    var meta = [r.piso ? 'Piso ' + r.piso : '', r.sector, r.etapa ? 'Etapa ' + r.etapa : '', r.h ? 'fila ' + r.h : ''].filter(Boolean).join(' · ');
    var na = regDocAlerts(r.items);
    var chips = (s.pend ? (s.total - s.pend ? chipHtml('pend', 'faltan ' + s.pend) : chipHtml('', 'Sin iniciar')) : (s.rz ? '' : chipHtml('ap', 'Completo'))) +
      (s.rz ? chipHtml('rz', s.rz + ' RZ') : '') +
      (r.pending ? chipHtml('sync', 'Nuevo · sin enviar') : r.dirty ? chipHtml('sync', 'Cambios sin enviar') : '') +
      (na.bad || na.old ? '<span class="chip rz">' + ic('alert', 'ic-16') + 'Plano superado</span>' : '');
    return '<button class="row" data-act="go" data-to="/c/' + esc(r.sheet) + '/r/' + r.key + '"><span class="grow">' +
      '<span class="ttl2">' + esc(r.elemento || 'Sin elemento') + '</span>' +
      (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') +
      (chips ? '<span class="chips">' + chips + '</span>' : '') +
      '<span class="bar-row">' + barHtml(s) + '<span class="n">' + (s.total - s.pend) + '/' + s.total + '</span></span>' +
      '</span>' + ic('chev-r', 'chev') + '</button>';
  }
  /** Barra de avance (§4.5): RZ, AP y N/A, en ese orden; lo pendiente queda como hueco. */
  function barHtml(s, cls) {
    var seg = s.total ? ['rz', 'ap', 'na'].filter(function (k) { return s[k]; }).map(function (k) {
      return '<i class="' + k + '" style="width:' + (100 * s[k] / s.total).toFixed(1) + '%"></i>';
    }).join('') : '';
    return '<span class="bar' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + seg + '</span>';
  }
  /** Cabecera de tarea: el nombre tal cual viene del PIE y la muestra como texto. */
  function taskHead(tk) {
    return '<div class="task-h"><h3>' + esc(tk.name) + '</h3>' +
      (tk.muestra !== '' && tk.muestra != null ? '<span class="meta">Muestra ' + esc(fmtMuestra(tk.muestra)) + '</span>' : '') + '</div>';
  }
  function groupItems(items) {
    var stages = [];
    var byStage = {};
    items.forEach(function (it) {
      var st = it.etapa || '—';
      if (!byStage[st]) { byStage[st] = { name: st, tasks: [], byTask: {} }; stages.push(byStage[st]); }
      var g = byStage[st];
      var tk = it.tarea || '—';
      var last = g.tasks[g.tasks.length - 1];
      if (!last || last.name !== tk) { last = { name: tk, muestra: it.muestra, items: [] }; g.tasks.push(last); }
      last.items.push(it);
    });
    return stages;
  }
  function reqList(sheet) {
    var t = templateReg(sheet);
    if (!t) return emptyHtml(NO_MODEL, 'doc');
    var html = '<p class="help intro">' + esc('Los ' + t.items.length + ' controles que se copian en cada registro nuevo. IV = inspección visual · ID = inspección dimensional.') + '</p>';
    groupItems(t.items).forEach(function (g) {
      // misma banda que en el registro, pero fija en su lugar y sin plegar
      html += '<div class="stage"><div class="stage-h static"><span class="st-name">' + esc(g.name) + '</span><span class="st-cnt">' +
        g.tasks.reduce(function (a, x) { return a + x.items.length; }, 0) + '</span></div>';
      g.tasks.forEach(function (tk) {
        html += '<div class="task">' + taskHead(tk) +
          tk.items.map(function (it) {
            return '<div class="req-crit"><p class="txt">' + esc(it.criterio) + '</p><p class="meta">' +
              esc([it.metodo, it.instrumento && it.instrumento !== 'NA' ? it.instrumento : ''].filter(Boolean).join(' · ')) + '</p></div>';
          }).join('') + '</div>';
      });
      html += '</div>';
    });
    return html;
  }
  /** Con un buscador enfocado sólo se reemplaza su lista (al escribir y al terminar un envío). */
  function refreshSearchList() {
    var hl = document.getElementById('homeList');
    if (hl && S.route === '/' && S.catalog) { hl.innerHTML = homeListHtml(); return; }
    var m = /^\/c\/([^/]+)$/.exec(S.route), box = document.getElementById('regListBox');
    if (m && box && category(m[1])) box.innerHTML = regListHtml(m[1]);
  }

  /** Nota fija mientras no se pueda guardar en el celular. */
  function storageNote() {
    return S.storageError ? noteHtml('err', '<b>No se pudo guardar en el celular.</b><p>No cierres la app y liberá espacio: lo cargado sigue en pantalla y se envía al tener señal.</p>') : '';
  }

  /* ---------- Nuevo registro (§5.5) ---------- */
  /** Chip en vivo del plano escrito o elegido: vigente, superado o fuera del FOD 02. */
  function newDocChipHtml(val) {
    val = String(val || '').trim();
    if (!val) return '';
    var r = docRefs(val)[0];
    if (!r) return chipHtml('', 'No está en el FOD 02');
    if (isNo(r.doc[7])) return chipHtml('rz', 'No vigente');
    if (r.used == null) return String(r.doc[1] == null ? '' : r.doc[1]).trim() ? chipHtml('', 'Sin rev. · rige ' + revLabel(r.doc[1])) : chipHtml('ap', 'vigente');
    return revCmp(r.used, r.doc[1]) < 0
      ? chipHtml('rz', revLabel(r.used) + ' · superado: rige ' + revLabel(r.doc[1]))
      : chipHtml('ap', revLabel(r.used) + ' · vigente');
  }
  function updateNewDocChip(val) {
    var b = document.getElementById('newDocChip');
    if (b) b.innerHTML = newDocChipHtml(val);
  }
  function renderNew(sheet) {
    var cat = category(sheet);
    if (!cat) { nav('/', { replace: true }); return; }
    renderTop('Nuevo registro', 'Planilla ' + cat.sheet + ' · ' + cat.titulo);
    if (!cat.registros.length) { view.innerHTML = emptyHtml(NO_MODEL, 'doc'); return; }
    // un modelo por cada estructura distinta de criterios (la más reciente)
    var models = [];
    var seen = {};
    cat.registros.slice().reverse().forEach(function (r) {
      if (seen[r.sig]) return;
      seen[r.sig] = true;
      models.push(r);
    });
    var last = cat.registros[cat.registros.length - 1];
    var sugg = function (k) {
      var vals = {};
      cat.registros.forEach(function (r) { if (r[k]) vals[r[k]] = true; });
      return Object.keys(vals).slice(0, 40).map(function (v) { return '<option value="' + esc(v) + '">'; }).join('');
    };
    var docs = {};
    cat.registros.slice(-5).forEach(function (r) { r.items.forEach(function (x) { if (x[2] && x[2] !== 'NA') docs[x[2]] = true; }); });
    var respOpts = function (sel) {
      var names = datos().responsables.map(function (x) { return x.nombre; }).concat(['N/A']);
      if (sel && names.indexOf(sel) < 0) names.push(sel);
      return '<option value="">Sin responsable</option>' + names.map(function (n) {
        return '<option' + (n === sel ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');
    };
    // teclado de iOS (eng-15): códigos sin autocorrector ni mayúscula inicial forzada
    var code = ' autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off"';
    var html = '<form id="newForm" class="card pad" autocomplete="off">' +
      '<label class="f"><span>Elemento a verificar (obligatorio)</span><input class="in" name="elemento" required placeholder="Ej.: Losa sobre 3° piso, V12-V14" list="dl-el"' +
      ' autocapitalize="sentences" autocorrect="off"></label>' +
      '<datalist id="dl-el">' + sugg('elemento') + '</datalist>' +
      '<div class="grid3">' +
      '<label class="f"><span>Piso</span><input class="in" name="piso" list="dl-piso" placeholder="Ej.: 5P"' + code + '></label>' +
      '<label class="f"><span>Sector</span><input class="in" name="sector" list="dl-sector" autocapitalize="sentences" autocorrect="off"></label>' +
      '<label class="f"><span>Etapa</span><input class="in" name="etapa" list="dl-etapa" autocorrect="off"></label></div>' +
      '<datalist id="dl-piso">' + sugg('piso') + '</datalist><datalist id="dl-sector">' + sugg('sector') + '</datalist><datalist id="dl-etapa">' + sugg('etapa') + '</datalist>' +
      '<label class="f"><span>Plano (FOD 02)</span><span class="pick"><input class="in" name="documento" list="dl-doc" placeholder="Código del plano"' + code + '>' +
      '<button type="button" class="btn" data-act="docpick" data-target="new" aria-label="Elegir plano del FOD 02">FOD 02</button></span>' +
      '<span class="chips" id="newDocChip" aria-live="polite"></span></label>' +
      '<datalist id="dl-doc">' + Object.keys(docs).map(function (v) { return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>' +
      '<fieldset class="f"><legend>Responsables</legend><div id="respList"></div></fieldset>' +
      '<label class="f"><span>Controles a copiar</span><select class="in" name="modelo">' +
      models.map(function (r, i) {
        return '<option value="' + r.h + '">' + esc(r.items.length + ' controles · como ' + (r.elemento || 'sin elemento') + (i === 0 ? ' (último)' : '')) + '</option>';
      }).join('') + '</select></label>' +
      '<p class="help">' + esc('Se agrega al final de la planilla ' + cat.sheet + ' con todos los controles pendientes.') + '</p>' +
      '</form>' +
      // el único botón de enviar de la pantalla: en la barra, asociado al formulario con form=
      bbar('<button type="submit" form="newForm" class="btn primary lg block">Crear registro</button>');
    view.innerHTML = html;
    var form = document.getElementById('newForm');
    var drawResp = function () {
      var h = Number(form.modelo.value);
      var r = cat.registros.filter(function (x) { return x.h === h; })[0] || last;
      var cur = [].slice.call(form.querySelectorAll('select[name=resp]')).map(function (s) { return s.value; });
      var src = cur.length ? cur : last.resp;
      var box = document.getElementById('respList');
      var slots = Math.max(1, r.slots || 3);
      var htmlR = '';
      for (var i = 0; i < slots; i++) {
        htmlR += '<label class="f"><span>Responsable ' + (i + 1) + '</span><select class="in" name="resp">' + respOpts(src[i] || '') + '</select></label>';
      }
      box.innerHTML = htmlR;
    };
    drawResp();
    form.modelo.addEventListener('change', drawResp);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var h = Number(form.modelo.value);
      var base = cat.registros.filter(function (x) { return x.h === h; })[0] || last;
      var doc = form.documento.value.trim();
      var op = {
        id: uid(), op: 'create', sheet: sheet, status: 'pending', createdAt: Date.now(), by: S.settings.inspector,
        base: { h: base.h, sig: base.sig },
        slots: base.slots,
        header: {
          responsables: [].slice.call(form.querySelectorAll('select[name=resp]')).map(function (s) { return s.value; }),
          piso: form.piso.value.trim(), sector: form.sector.value.trim(), etapa: form.etapa.value.trim(),
          elemento: form.elemento.value.trim()
        },
        items: {},
        docDefault: doc,
        snapshot: base.items.map(function (x) {
          var c = cat.crit[x[1]];
          return [x[0], c[0], c[1], c[2], c[3], c[4], c[5]];
        })
      };
      if (doc) {
        op.snapshot.forEach(function (s) { op.items[s[0]] = { criterio: s[4], tarea: s[2], documento: doc }; });
      }
      S.queue.push(op);
      queueChanged();
      toast(navigator.onLine || IN_GAS ? 'Registro guardado · enviando…' : 'Guardado en el celular · se envía al tener señal', { kind: 'ok' });
      nav('/c/' + sheet + '/r/p' + op.id, { replace: true });
    });
  }

  /* ---------- Registro: checklist ---------- */
  function renderReg(sheet, key) {
    var cat = category(sheet);
    var reg = cat && getReg(sheet, key);
    if (!reg) {
      var rid = key.charAt(0) === 'p' && S.resolved[key.slice(1)];
      if (rid) { nav('/c/' + sheet + '/r/h' + rid.h, { replace: true }); return; }
      nav('/c/' + sheet, { replace: true });
      return;
    }
    if (reg.key !== key) {
      // ruta vieja de un alta ya creada (p. ej. al volver atrás): se corrige sin mover la pantalla
      S.route = '/c/' + sheet + '/r/' + reg.key;
      if (!IN_GAS) { try { history.replaceState(null, '', '#' + S.route); } catch (e) { /* iframe */ } }
    }
    var s = stats(reg.items);
    renderTop(reg.elemento || 'Registro',
      [reg.piso, 'Planilla ' + cat.sheet, (s.total - s.pend) + '/' + s.total, s.rz ? s.rz + ' RZ' : ''].filter(Boolean).join(' · '));
    // filtro inicial (§6.1): «Pend.» si el registro ya tiene avance y le quedan pendientes; si no, «Todos».
    // Se decide una sola vez por registro y sesión; una elección del usuario se respeta.
    if (S.ui.filter[reg.key] == null) S.ui.filter[reg.key] = s.pend > 0 && s.total - s.pend > 0 ? 'pend' : 'all';
    var filter = S.ui.filter[reg.key];
    // lo marcado con un filtro puesto sigue a la vista (keep): nada se corre bajo el dedo
    var keep = S.ui.keep[reg.key] || {};
    var rdoc = docDefault(reg);
    // resumen compacto (§5.6): datos, fila del plano y avance; la edición de datos va adentro de #hdr
    var html = storageNote() + '<section class="card sum"><div id="hdr">' + (S.ui.open['hdr:' + reg.key] ? headerForm(reg) : sumHead(reg)) + '</div>' +
      docRow(reg, rdoc) + barHtml(s) + '</section>';
    html += docBanner(reg, rdoc) + sendErrNote(reg);
    html += filtersHtml(reg, s, filter);
    groupItems(reg.items).forEach(function (g) {
      var gs = stats([].concat.apply([], g.tasks.map(function (t) { return t.items; })));
      var visibleTasks = g.tasks.map(function (tk) {
        return { name: tk.name, muestra: tk.muestra, items: tk.items.filter(function (it) { return filter === 'all' || itemState(it) === filter || keep[it.off]; }) };
      }).filter(function (tk) { return tk.items.length; });
      if (!visibleTasks.length) return;
      var fk = reg.key + '|' + g.name;
      var folded = !!S.ui.folded[fk];
      // banda de etapa fija bajo el header mientras se recorre la etapa (§4.9)
      html += '<div class="stage' + (gs.pend ? '' : ' done') + '" data-stage="' + esc(g.name) + '"><div class="stage-h">' +
        '<button type="button" class="fold" data-act="fold" data-k="' + esc(fk) + '" aria-expanded="' + !folded + '">' + ic('chev-d', 'chev') +
        '<span class="st-name">' + esc(g.name) + '</span><span class="st-cnt">' + (gs.total - gs.pend) + '/' + gs.total + '</span>' + barHtml(gs, 'mini') + '</button></div>';
      if (folded) { html += '</div>'; return; }
      visibleTasks.forEach(function (tk) {
        html += '<div class="card task">' + taskHead(tk) + tk.items.map(function (it) { return itemCard(reg, it); }).join('') + '</div>';
      });
      // al final de la etapa, después de mirar los controles; con el filtro AP, RZ o N/A no se ofrece:
      // aprobaría pendientes que no están en pantalla (C17)
      if (gs.pend && (filter === 'all' || filter === 'pend')) {
        html += '<button type="button" class="btn block ap-line bulk" data-act="bulk" data-key="' + reg.key + '" data-stage="' + esc(g.name) + '">' + ic('check2') +
          esc(gs.pend === 1 ? 'Aprobar el pendiente de ' + g.name : 'Aprobar los ' + gs.pend + ' pendientes de ' + g.name) + '</button>';
      }
      html += '</div>';
    });
    html += s.pend
      ? bbar('<button class="nextpend" data-act="nextpend" aria-label="Ir al siguiente control pendiente (quedan ' + s.pend + ')">' +
        ic('arrow-d') + 'Siguiente pendiente<span class="cnt">' + s.pend + '</span></button>')
      // sin pendientes: el resumen y la vuelta a la planilla (FLOW-11)
      : bbar('<div class="done-sum">' + ic('check-circle', 't-ap') + '<span>' +
        esc((s.rz ? 'Sin pendientes' : 'Completo') + ' · ' + s.ap + ' AP · ' + s.na + ' N/A · ' + s.rz + ' RZ') + '</span></div>' +
        '<button class="btn" data-act="go" data-to="/c/' + esc(sheet) + '">Planilla ' + esc(sheet) + '</button>');
    view.innerHTML = html;
    // el elemento completo va en el resumen sólo si en el header quedó cortado
    var tb = document.querySelector('#top .ttl b'), se = view.querySelector('.sum-el');
    if (tb && se && tb.scrollWidth > tb.clientWidth) se.hidden = false;
    if (S.ui.focus != null) {
      var fe = document.getElementById('it-' + S.ui.focus);
      S.ui.focus = null;
      if (fe) { fe.scrollIntoView({ block: 'center', behavior: scrollMode() }); flash(fe); }
    }
  }
  /** Datos del registro en dos renglones; «Planilla 6 · fila N» y «cambios sin enviar» quedan en #hdr. */
  function sumHead(reg) {
    var resp = reg.resp.filter(function (x) { return x && x !== 'N/A'; }).map(function (x) { return abrevOf(x) || x; });
    var meta = [reg.piso, reg.sector, reg.etapa ? 'Etapa ' + reg.etapa : '', resp.join(', ')].filter(Boolean).join(' · ');
    return '<h1 class="sum-el" hidden>' + esc(reg.elemento || 'Registro') + '</h1>' +
      '<div class="sum-row"><div class="grow">' +
      (meta ? '<p class="sum-meta">' + esc(meta) + '</p>' : '') +
      '<p class="sum-foot">' + (reg.pending ? 'Planilla ' + esc(reg.sheet) + ' · nuevo, se crea en el PIE al enviarse'
        : 'Planilla ' + esc(reg.sheet) + ' · fila ' + reg.h + (reg.dirty ? ' · <span class="t-sync">cambios sin enviar</span>' : '')) + '</p></div>' +
      (MODE === 'sidebar' && !reg.pending ? '<button class="icon-btn" type="button" data-act="goto" data-sheet="' + esc(reg.sheet) + '" data-row="' + reg.h + '" aria-label="Ver fila en la planilla">' + ic('ext') + '</button>' : '') +
      '<button class="icon-btn" type="button" data-act="hdr" data-key="' + reg.key + '" aria-label="Editar datos del registro">' + ic('pencil') + '</button></div>';
  }
  /** Chip de una parte del plano del registro contra el FOD 02. */
  function docChip(part) {
    var r = docRefs(part)[0];
    if (!r) return ['', 'fuera del FOD 02'];
    if (isNo(r.doc[7])) return ['rz', 'no vigente'];
    if (r.used == null) return ['', 'sin rev.'];
    return revCmp(r.used, r.doc[1]) < 0 ? ['rz', 'superado'] : ['ap', 'vigente'];
  }
  /*
   * Plano del registro como fila-botón (a11y-12): el código completo, que corta renglón en vez de esconder
   * la revisión, con su chip. Abre el selector del FOD 02 (reemplazar, agregar otro o texto libre).
   */
  function docRow(reg, rdoc) {
    var parts = String(rdoc || '').split('//').map(function (x) { return x.trim(); }).filter(Boolean);
    var codes = parts.length ? parts.map(function (part) {
      var c = docChip(part);
      return '<span class="dr"><span class="code">' + esc(part) + '</span> <span class="chip ' + c[0] + '">' + esc(c[1]) + '</span></span>';
    }).join('') : '<span class="dr"><span class="code missing">Falta plano · elegí el del FOD 02</span></span>';
    return '<button class="docrow" type="button" data-act="docpick" data-target="default" data-key="' + reg.key + '" data-regdoc="1" data-value="' + esc(rdoc) + '"' +
      ' aria-label="' + esc('Plano del registro: ' + (rdoc || 'sin plano') + '. Cambiar') + '">' + ic('doc') +
      '<span class="docrow-codes">' + codes + '</span>' + ic('chev-r', 'chev') + '</button>';
  }
  /** Banner de plano superado (§7.5): queda como recordatorio mientras haya algo con una revisión vieja. */
  function docBanner(reg, rdoc) {
    var dd = docStatus({ documento: rdoc, estado: '', fecha: '' });
    var regOld = !!(dd && dd.level === 'old');
    var na = regDocAlerts(reg.items);
    if (!na.bad && !na.old && !regOld) return '';
    var lines = [];
    if (regOld) lines.push('El registro usa ' + revLabel(dd.used) + '; rige la ' + revLabel(dd.latest) + (dd.fecha ? ' desde ' + fmtDate(dd.fecha) : '') + '.');
    if (na.old) lines.push(na.old + (na.old > 1 ? ' pendientes usan' : ' pendiente usa') + ' una revisión vieja.');
    if (na.bad) lines.push(na.bad + (na.bad > 1 ? ' controles marcados' : ' control marcado') + ' con una revisión ya reemplazada: ' + (na.bad > 1 ? 'revisalos.' : 'revisalo.'));
    var cur = docRefs(rdoc)[0];
    var latest = regOld ? dd.latest : cur ? cur.doc[1] : null;
    return '<div class="note err">' + ic('alert') + '<div><b>Plano superado</b>' +
      lines.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') +
      (regOld || na.old ? '<div class="btns"><button type="button" class="btn sm primary" data-act="docupdall" data-key="' + reg.key + '">' +
        esc(latest != null ? 'Pasar a ' + revLabel(latest) : 'Pasar a la revisión vigente') + '</button></div>' : '') + '</div></div>';
  }
  /** Envío rechazado por el PIE para este registro. */
  function sendErrNote(reg) {
    var errs = S.queue.filter(function (o) { return o.status === 'error' && (o.op === 'create' ? o.id === reg.opId : opTargets(o, reg)); });
    if (!errs.length) return '';
    return '<div class="note err">' + ic('alert') + '<div><p>' + esc('No se pudo enviar al PIE: ' + String(errs[0].error || 'error').replace(/[\s.]+$/, '')) + '</p>' +
      '<div class="btns"><button type="button" class="btn sm" data-act="retry" data-id="' + esc(errs.map(function (o) { return o.id; }).join(',')) + '">Reintentar</button>' +
      '<button type="button" class="btn sm" data-act="go" data-to="/ajustes">Ver envíos</button></div></div></div>';
  }
  /** Filtros (§4.8): cinco celdas iguales con el número arriba; la activa toma el color de su estado. */
  function filtersHtml(reg, s, filter) {
    return '<div class="filters" role="group" aria-label="Filtrar controles">' +
      [['all', 'Todos', s.total], ['pend', 'Pend.', s.pend], ['ap', 'AP', s.ap], ['rz', 'RZ', s.rz], ['na', 'N/A', s.na]].map(function (f) {
        var on = filter === f[0];
        return '<button type="button" class="f-' + f[0] + (on ? ' on' : '') + (f[2] ? '' : ' zero') + '" data-act="filter" data-key="' + reg.key + '" data-f="' + f[0] + '"' +
          ' aria-pressed="' + on + '"><b>' + f[2] + '</b><span>' + f[1] + '</span></button>';
      }).join('') + '</div>';
  }
  function headerForm(reg) {
    var names = datos().responsables.map(function (x) { return x.nombre; }).concat(['N/A']);
    var opts = function (sel) {
      var n = names.slice();
      if (sel && n.indexOf(sel) < 0) n.push(sel);
      return '<option value="">Sin responsable</option>' + n.map(function (x) { return '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
    };
    var slots = Math.max(reg.slots || 0, reg.resp.length, 1);
    var r = '';
    for (var i = 0; i < slots; i++) r += '<label class="f"><span>Responsable ' + (i + 1) + '</span><select class="in" name="resp">' + opts(reg.resp[i] || '') + '</select></label>';
    var code = ' autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off"';
    return '<form id="hdrForm" data-key="' + reg.key + '">' +
      '<label class="f"><span>Elemento a verificar</span><input class="in" name="elemento" value="' + esc(reg.elemento) + '" autocapitalize="sentences" autocorrect="off"></label>' +
      '<div class="grid3"><label class="f"><span>Piso</span><input class="in" name="piso" value="' + esc(reg.piso) + '"' + code + '></label>' +
      '<label class="f"><span>Sector</span><input class="in" name="sector" value="' + esc(reg.sector) + '" autocapitalize="sentences" autocorrect="off"></label>' +
      '<label class="f"><span>Etapa</span><input class="in" name="etapa" value="' + esc(reg.etapa) + '"></label></div>' +
      '<div>' + r + '</div>' +
      '<div class="btns"><button type="button" class="btn" data-act="hdr" data-key="' + reg.key + '">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>';
  }
  function docDefault(reg) {
    var k = 'doc.' + reg.sheet + '.' + reg.key;
    var v = LS.get(k, null);
    if (v != null) return v;
    if (reg.pending) { var op = pendingCreate(reg.opId); if (op && op.docDefault) return op.docDefault; }
    var count = {};
    reg.items.forEach(function (it) { if (it.documento && it.documento !== 'NA') count[it.documento] = (count[it.documento] || 0) + 1; });
    var best = '';
    Object.keys(count).forEach(function (d) { if (!best || count[d] > count[best]) best = d; });
    return best;
  }
  /** Fija el plano del registro y lo aplica a todos los controles no controlados (pendientes y N/A). */
  function setRegDoc(reg, val) {
    val = String(val || '').trim();
    LS.set('doc.' + reg.sheet + '.' + reg.key, val);
    if (reg.pending) { var op = pendingCreate(reg.opId); if (op && op.status === 'pending') op.docDefault = val; }
    var n = 0;
    reg.items.forEach(function (it) {
      var st = itemState(it);
      if ((st === 'pend' || st === 'na') && it.documento !== val) { editItem(reg, it.off, { documento: val }); n++; }
    });
    if (!n) queueChanged();
    return n;
  }
  /** Control que se ve sólo porque se marcó con un filtro puesto (keep, §6.1): queda atenuado (.kept). */
  function isKept(reg, it) {
    var f = S.ui.filter[reg.key] || 'all';
    return f !== 'all' && itemState(it) !== f && !!(S.ui.keep[reg.key] || {})[it.off];
  }
  /** Con un filtro puesto, lo que se acaba de marcar o borrar queda a la vista hasta cambiar de filtro. */
  function keepItem(reg, off) {
    if ((S.ui.filter[reg.key] || 'all') !== 'all') (S.ui.keep[reg.key] = S.ui.keep[reg.key] || {})[off] = true;
  }
  /*
   * Tarjeta de control (§4.6). Todo lo que aparece al marcar (resumen, avisos, detalle) va debajo de
   * AP/RZ/N/A, así los botones no se corren bajo el dedo.
   */
  function itemCard(reg, it) {
    var st = itemState(it);
    var open = !!S.ui.open[reg.key + ':' + it.off];
    var fz = itemFum(reg, it);
    var rdocIt = docDefault(reg);
    var nFotos = ((reg.fotos && reg.fotos[it.off]) || []).length + ((reg.localFotos && reg.localFotos[it.off]) || []).length;
    var fotosTxt = nFotos ? nFotos + (nFotos === 1 ? ' foto' : ' fotos') : '';
    // resumen de lo cargado (sólo con el detalle cerrado): el estado primero, en palabras
    var fumTxt = fz.server
      ? 'FUM ' + fz.server[0] + (fz.closing ? (fz.closing.resultado === 'Anulada' ? ' se anula al enviar' : ' se cierra al enviar')
        : fz.open ? ' abierta' : ' ' + String(fz.server[5] || '').toLowerCase())
      : fz.pend ? 'FUM nueva (sin enviar)' : it.fum ? 'FUM ' + it.fum : '';
    var filled = [fumTxt,
      String(it.fecha || '').toUpperCase() === 'NA' ? '' : fmtDate(it.fecha),
      it.resp,
      it.documento && it.documento !== rdocIt ? 'Plano: ' + it.documento : '',
      fotosTxt,
      it.obs ? '“' + it.obs + '”' : ''].filter(Boolean).map(esc);
    if (st !== 'pend') filled.unshift('<b class="t-' + st + '">' + EST[st] + '</b>');
    var b = function (cls, icon) {
      return '<button type="button" class="st ' + cls + (st === cls ? ' on' : '') + '" data-act="mark" data-key="' + reg.key + '" data-off="' + it.off + '" data-st="' + cls + '"' +
        ' aria-pressed="' + (st === cls) + '" aria-describedby="crit-' + it.off + '">' + ic(icon) + EST[cls] + '</button>';
    };
    var meta = [it.metodo, it.instrumento && it.instrumento !== 'NA' ? it.instrumento : ''].filter(Boolean).join(' · ');
    var warn = ((st === 'ap' || st === 'rz') && needsSerial(it.instrumento)
      ? '<button type="button" class="chip pend" data-act="serial" data-key="' + reg.key + '" data-off="' + it.off + '">Falta N° de serie</button>' : '') +
      docWarnHtml(reg, it);
    var moreLabel = 'Detalle del control' + (fotosTxt ? ', ' + fotosTxt : '') + (it.obs ? ', con observación' : '');
    var h = '<div class="item ' + st + (isKept(reg, it) ? ' kept' : '') + '" id="it-' + it.off + '">' +
      '<p class="crit" id="crit-' + it.off + '">' + esc(it.criterio) + '</p>' +
      (meta ? '<p class="meta">' + esc(meta) + '</p>' : '') +
      '<div class="acts' + (st !== 'pend' ? ' set' : '') + '" role="group" aria-label="Resultado del control">' + b('ap', 'check') + b('rz', 'x') + b('na', 'minus') +
      '<button type="button" class="more' + (nFotos || it.obs ? ' has' : '') + '" data-act="more" data-key="' + reg.key + '" data-off="' + it.off + '"' +
      ' aria-expanded="' + open + '" aria-controls="det-' + it.off + '" aria-label="' + esc(moreLabel) + '">' + ic('chev-d') + '</button></div>';
    if (filled.length && !open) h += '<p class="filled">' + filled.join(' · ') + '</p>';
    if (warn) h += '<div class="warn">' + warn + '</div>';
    if (open) h += detailHtml(reg, it, st, fz, rdocIt, nFotos);
    return h + '</div>';
  }
  /*
   * Detalle del control (§4.7), en este orden: FUM (si hay), fotos (sin desplazarse), observaciones,
   * datos del control y el pie con «Borrar carga» (sólo si hay algo cargado) y «Listo».
   */
  function detailHtml(reg, it, st, fz, rdocIt, nFotos) {
    var attrs = ' data-key="' + reg.key + '" data-off="' + it.off + '"';
    var abrevs = datos().responsables.map(function (x) { return x.abrev; }).filter(Boolean);
    if (it.resp && abrevs.indexOf(it.resp) < 0) abrevs.push(it.resp);
    var fecha = /^\d{4}-\d{2}-\d{2}$/.test(it.fecha) ? it.fecha : '';
    var canClear = st !== 'pend' || it.fecha || it.resp || it.fum || it.obs || fz.open;
    return '<div class="det" id="det-' + it.off + '"' + attrs + '>' +
      fumBox(reg, it) +
      '<fieldset class="sec"><legend>Fotos' + (nFotos ? ' · ' + nFotos : '') + '</legend>' +
      '<div class="thumbs">' + photoThumbs(reg, it) + '</div>' +
      '<div class="grid2">' +
      '<label class="btn file-btn">' + ic('camera') + 'Cámara<input type="file" accept="image/*" capture="environment" data-photo="1"' + attrs + '></label>' +
      '<label class="btn file-btn">' + ic('image') + 'Galería<input type="file" accept="image/*" multiple data-photo="1"' + attrs + '></label></div></fieldset>' +
      '<label class="f sec"><span>Observaciones</span><textarea class="in" data-field="obs" autocapitalize="sentences">' + esc(it.obs) + '</textarea></label>' +
      '<div class="sec"><div class="grid2">' +
      '<label class="f"><span>Fecha</span><input class="in" type="date" data-field="fecha" value="' + esc(fecha) + '">' +
      (fecha ? '' : '<span class="help">Vacía = hoy al marcar</span>') + '</label>' +
      '<label class="f"><span>Resp.</span><select class="in" data-field="resp"><option value="">Sin responsable</option>' +
      abrevs.map(function (x) { return '<option' + (x === it.resp ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></label></div>' +
      instrSelect(reg, it) +
      (it.documento && it.documento !== rdocIt ? '<p class="help">Plano de este control: <span class="mono">' + esc(it.documento) + '</span></p>' : '') +
      // N° de FUM a mano: sólo si ya tiene uno y la FUM no está ni en la cola ni en el FOG 01
      (it.fum && !fz.pend && !fz.server ? '<label class="f"><span>FUM N°</span><input class="in" data-field="fum" inputmode="numeric" value="' + esc(it.fum) + '"></label>' : '') +
      '</div>' +
      '<div class="det-foot">' +
      (canClear ? '<button type="button" class="btn ghost danger" data-act="clear"' + attrs + '>Borrar carga</button>' : '') +
      '<button type="button" class="btn primary" data-act="more"' + attrs + '>' + ic('check') + 'Listo</button></div></div>';
  }
  function refreshItem(reg, off) {
    var it = reg.items.filter(function (x) { return x.off === off; })[0];
    var el = document.getElementById('it-' + off);
    if (!el || !it) return render({ keepScroll: true });
    var tmp = document.createElement('div');
    tmp.innerHTML = itemCard(reg, it);
    el.replaceWith(tmp.firstChild);
    watchDets();
  }

  /*
   * FUM abierta del control: su número en el FOG 01 (null si todavía no se envió) y a qué FUM apunta un
   * cierre (por número si está abierta en el FOG 01; si no, por el id de su alta en la cola).
   */
  function fumOpenNum(f) { return f.server && f.server[5] === 'Abierta' ? f.server[0] : null; }
  function closeFields(f, resultado) {
    var n = fumOpenNum(f);
    var c = n != null ? { num: n } : f.pend ? { ref: f.pend.id } : null;
    if (!c) return null;
    c.accion = 'cerrar';
    c.resultado = resultado;
    c.fecha = today();
    return c;
  }
  /** Datos de un control antes de cambiarlo (para Deshacer). */
  function prevOf(it) {
    var p = {};
    ['estado', 'fecha', 'resp', 'fum', 'obs', 'documento', 'instrumento'].forEach(function (k) { p[k] = it[k]; });
    return p;
  }

  /** Hoja de «Borrar carga» (§7.9), según haya FUM nueva, FUM ya enviada o ninguna. */
  function clearQuestion(f) {
    var num = fumOpenNum(f);
    var discard = f.open && f.pend && f.pend.status === 'pending';   // misma condición que clearItem
    var annul = f.open && !discard;
    return {
      title: '¿Borrar la carga de este control?',
      body: 'Vuelve a pendiente y se borran fecha, responsable y observaciones. Las fotos quedan.' +
        (discard ? '\n\nLa FUM nueva se descarta (todavía no se envió).'
          : annul ? '\n\nLa ' + (num ? 'FUM N° ' + num : 'FUM') + ' queda ANULADA en el FOG 01. Si ya se corrigió, cancelá y marcá AP.' : ''),
      ok: { label: annul ? 'Borrar y anular FUM' : 'Borrar carga', tone: 'danger' }
    };
  }
  /**
   * «Borrar carga» (§6.4): el control vuelve a pendiente (las fotos quedan). La FUM nueva sin enviar se
   * descarta; la ya enviada se anula, retenida 6 s para poder deshacer. Ofrece Deshacer.
   */
  function clearItem(reg, off) {
    var it = itemOf(reg, off);
    if (!it) return;
    var f = itemFum(reg, it);   // se vuelve a mirar al confirmar: pudo haber llegado un envío
    var u = { patches: [{ sheet: reg.sheet, key: reg.key, off: it.off, prev: prevOf(it) }], drop: [], restore: [] };
    if (f.open) {
      if (f.pend && f.pend.status === 'pending') {
        u.restore = S.queue.filter(function (o) { return o === f.pend || o.ref === f.pend.id; });
        dropOp(f.pend);
      } else {
        var cf = closeFields(f, 'Anulada');
        if (cf) {
          var anul = queueFum(reg, it, cf);
          hold(anul, 6000);
          u.drop.push(anul);
        }
      }
    }
    editItem(reg, it.off, { estado: '', fecha: '', resp: '', fum: '', obs: '' });
    keepItem(reg, it.off);   // con un filtro puesto (p. ej. AP) no desaparece de la lista: el detalle sigue abierto
    // dibujo completo: el subtítulo, el contador de la etapa y la barra («Siguiente pendiente») quedan al día
    render({ keepScroll: true });
    offerUndo('Carga borrada', u);
  }
  /** Deshacer (6 s): u = {patches: [{sheet, key, off, prev}], drop: [ops creadas], restore: [ops descartadas]}. */
  function offerUndo(msg, u, kind) {
    S.undo = u;
    toast(msg, { kind: kind || 'ok', ms: 6000, action: { label: 'Deshacer', icon: 'undo', fn: function () { doUndo(u); } } });
  }
  function doUndo(u) {
    if (S.undo !== u) return;
    S.undo = null;
    // lo creado tiene que seguir sin enviar (la retención de 6 s lo asegura); si ya salió, no se toca nada
    var sent = u.drop.filter(function (o) { return S.queue.indexOf(o) < 0 || (o.status !== 'pending' && o.status !== 'error'); });
    if (sent.length) { toast('No se puede deshacer: la FUM ya se cerró en el FOG 01.', { kind: 'err' }); return; }
    u.drop.forEach(function (o) { dropOp(o); delete S.hold[o.id]; });
    // lo descartado vuelve a la cola (una FUM nueva vuelve a quedar retenida si su detalle sigue abierto)
    u.restore.forEach(function (o) { o.status = 'pending'; if (S.queue.indexOf(o) < 0) S.queue.push(o); });
    u.patches.forEach(function (p) {
      var r = getReg(p.sheet, p.key);
      if (r && r.items.some(function (x) { return x.off === p.off; })) editItem(r, p.off, p.prev);
    });
    queueChanged();
    render({ keepScroll: true });
    toast('Listo, se deshizo', { kind: 'info' });
  }

  /*
   * Marcar un control (§6.1-6.2). Las preguntas van con ask(), nunca con el diálogo nativo: primero se
   * decide (decideMark, puede preguntar) y después se aplica sin preguntar (applyMark).
   * Tocar el estado que ya tiene no lo borra: para eso está «Borrar carga» en el detalle.
   */
  /**
   * Qué pasa con la FUM abierta del control al marcar AP o N/A:
   * 'drop': es nueva y sigue retenida (el RZ fue un error y se corrige con el detalle abierto): se descarta
   *   sin preguntar y no llega nada al FOG 01;
   * 'ask': es una reinspección real (numerada, o nueva pero ya liberada o enviada): se pregunta antes de
   *   cerrarla. Cambio deliberado respecto de la v1.5: un rechazo real cargado sin señal ya no desaparece;
   * 'none': no hay FUM abierta (o se marca RZ).
   */
  function fumAction(f, st) {
    if (st === 'rz' || !f.open) return 'none';
    return f.pend && f.pend.status === 'pending' && isHeld(f.pend) ? 'drop' : 'ask';
  }
  function askFumClose(f, st) {
    var num = fumOpenNum(f), la = 'La ' + (num ? 'FUM N° ' + num : 'FUM');
    return ask(st === 'ap'
      ? { title: '¿Pasó la reinspección?', body: la + ' se cierra como aprobada, con fecha de hoy.', ok: { label: 'Cerrar FUM y marcar AP', tone: 'ap' } }
      : { title: '¿El control no aplica?', body: la + ' se anula en el FOG 01 y el control queda N/A.', ok: { label: 'Anular FUM y marcar N/A', tone: 'danger' } });
  }
  /*
   * Plano superado al marcar AP o RZ (§6.6, C10): tres salidas y una sola pregunta por registro y revisión.
   * Devuelve Promise<'ok' (pasar a la vigente) | 'alt' (marcar con la vieja) | 'none' (no hace falta) | null (no marcar)>.
   */
  function askPlano(reg, it) {
    var doc = docDefault(reg) || it.documento;
    var ds = doc && docStatus({ documento: doc, estado: '', fecha: '' });
    if (!ds || ds.level !== 'old') return Promise.resolve('none');
    var kk = 'docKeep.' + reg.sheet + '.' + reg.key, kv = ds.code + '|' + ds.latest;
    if (LS.get(kk, null) === kv) return Promise.resolve('alt');   // ya eligió seguir con la vieja para esta revisión
    return ask({
      title: 'Plano superado',
      body: 'Este registro usa ' + ds.code + ' en ' + revLabel(ds.used) + ' y rige la ' + revLabel(ds.latest) +
        (ds.fecha ? ' (desde ' + fmtDate(ds.fecha) + ')' : '') + '.\nElegí con cuál marcar este control y los siguientes de este registro.',
      ok: { label: 'Pasar a ' + revLabel(ds.latest) + ' y marcar', tone: 'primary' },
      alt: { label: 'Marcar con ' + revLabel(ds.used) },
      cancel: 'No marcar'
    }).then(function (r) { if (r === 'alt') LS.set(kk, kv); return r; });
  }
  /**
   * Preguntas antes de marcar (§6.2). Devuelve Promise<plan | null>; null = no marcar.
   * plan = {reg (releído), openFum, dropFum (op), closeFum: {resultado}, upgrade, doc}.
   * opts.silent (aprobar en lote): sin preguntas; un control cuya FUM habría que cerrar no se marca.
   */
  function decideMark(reg, it, st, opts) {
    opts = opts || {};
    var off = it.off;
    var plan = {};
    var p = Promise.resolve(plan);
    if (fumAction(itemFum(reg, it), st) === 'ask') {
      if (opts.silent) return Promise.resolve(null);   // una FUM nunca se cierra sin preguntar
      p = askFumClose(itemFum(reg, it), st).then(function (r) {
        if (r !== 'ok') return null;
        plan.closeOk = true;
        return plan;
      });
    }
    if ((st === 'ap' || st === 'rz') && !opts.silent) {
      p = p.then(function (pl) {
        if (!pl) return null;
        return askPlano(reg, it).then(function (r) {
          if (r === null) return null;
          if (r === 'ok') pl.upgrade = true;
          else if (r === 'alt') pl.doc = docDefault(reg) || it.documento;
          return pl;
        });
      });
    }
    // mientras se preguntaba pudo terminar un envío: se vuelve a leer el registro y su FUM antes de aplicar
    var settle = function (pl) {
      if (!pl) return null;
      var r = getReg(reg.sheet, reg.key), it2 = r && itemOf(r, off);
      if (!it2 || itemState(it2) === st) return null;
      var f = itemFum(r, it2), fa = fumAction(f, st);
      pl.reg = r;
      pl.openFum = st === 'rz' && !f.open && !it2.fum;
      pl.dropFum = fa === 'drop' ? f.pend : null;
      pl.closeFum = null;
      if (fa !== 'ask') return pl;
      if (pl.closeOk) { pl.closeFum = { resultado: st === 'ap' ? 'Reinspección AP' : 'Anulada' }; return pl; }
      if (opts.silent) return null;
      // la FUM salió del celular (o apareció) mientras tanto: ya no se descarta sin preguntar
      return askFumClose(f, st).then(function (a) {
        if (a !== 'ok') return null;
        pl.closeOk = true;
        return settle(pl);
      });
    };
    return p.then(settle);
  }
  /** Aviso de «Pasar a la revisión vigente» (§7.10). */
  function upgradeMsg(nd, n) {
    var ur = docRefs(nd)[0];
    return (ur ? 'Registro pasado a ' + revLabel(ur.doc[1]) : 'Plano: ' + nd) +
      (n ? ' · ' + n + (n === 1 ? ' control actualizado' : ' controles actualizados') : '');
  }
  /**
   * Aplica la marca sin preguntar, con el plan de decideMark. Devuelve lo necesario para Deshacer
   * ({patches, drop, restore}) y deja en el plan los textos de los avisos: closeMsg (cierre o anulación
   * encolados) y upgraded (registro pasado a la revisión vigente).
   */
  function applyMark(reg, off, st, plan) {
    var it = itemOf(reg, off);
    if (!it) return null;
    var me = S.settings.inspector;
    var f = itemFum(reg, it);
    var u = { patches: [{ sheet: reg.sheet, key: reg.key, off: off, prev: prevOf(it) }], drop: [], restore: [] };
    if (plan.dropFum) {
      // RZ por error corregido con el detalle abierto: la FUM nueva (retenida) se descarta y no llega al FOG 01
      u.restore = S.queue.filter(function (o) { return o === plan.dropFum || o.ref === plan.dropFum.id; });
      dropOp(plan.dropFum);
    }
    if (plan.closeFum) {
      // reinspección (AP: se cierra) o no aplica (N/A: se anula, así el FOG 01 no dice «aprobada»).
      // Queda retenida 6 s para poder deshacer.
      var cf = closeFields(f, plan.closeFum.resultado);
      if (cf) {
        var c = queueFum(reg, it, cf);
        hold(c, 6000);
        u.drop.push(c);
        plan.closeMsg = (cf.num != null ? 'FUM N° ' + cf.num : 'La FUM') +
          (plan.closeFum.resultado === 'Anulada' ? ' se anula al enviar' : ' se cierra al enviar');
      }
    }
    if (plan.openFum) {
      var fo = queueFum(reg, it, { accion: 'abrir', obs: it.obs || '', accionInmediata: 'Reparar' });
      // retenida mientras su detalle siga abierto (§6.3): si el RZ fue un error, no llega nada al FOG 01
      S.hold[fo.id] = { since: Date.now(), until: 0, det: reg.key + ':' + off, key: reg.key };
    }
    if (st === 'rz') S.ui.open[reg.key + ':' + off] = true;
    var patch;
    if (st === 'na') {
      patch = { estado: '', fecha: 'NA', resp: it.resp || me };
    } else {
      patch = { estado: st.toUpperCase(), resp: it.resp || me };
      if (!/^\d{4}-\d{2}-\d{2}$/.test(it.fecha)) patch.fecha = today();
      var doc = plan.doc || docDefault(reg) || it.documento;
      if (doc) {
        if (plan.upgrade) {
          // «Pasar a R07 y marcar»: el registro pasa a la revisión vigente (también pendientes y N/A)
          var nd = docUpgrade(doc);
          plan.upgraded = upgradeMsg(nd, setRegDoc(reg, nd));
          doc = nd;
        }
        if (doc !== it.documento) patch.documento = doc;
      }
      if (needsSerial(it.instrumento) && instrMemo(it.instrumento)) patch.instrumento = instrMemo(it.instrumento);
    }
    editItem(reg, off, patch);
    return u;
  }
  /** Avisos después de marcar: cierre, anulación o descarte de la FUM con Deshacer; plano pasado a la vigente. */
  function markToasts(plan, u) {
    if (plan.closeMsg) offerUndo(plan.closeMsg, u);
    else if (plan.dropFum) offerUndo('FUM descartada: no se había enviado.', u, 'info');
    if (plan.upgraded) toast(plan.upgraded, { kind: 'ok' });   // espera su turno detrás del Deshacer
  }

  /* ---------- Ajustes (§5.8) ---------- */
  /** Datos de la FUM a la que apunta una operación: criterio, registro y si todavía es nueva (sin número). */
  function fumOpInfo(o) {
    if (o.accion === 'abrir') return { criterio: o.criterio, key: o.ref ? liveKey('p' + o.ref) : 'h' + o.h, isNew: true };
    if (o.num != null) {
      var f = fumsAll().filter(function (x) { return x[0] === o.num; })[0];
      return { criterio: o.criterio || (f ? f[9] : ''), key: f ? 'h' + f[2] : null, isNew: false };
    }
    var ab = S.queue.filter(function (x) { return x.id === o.ref; })[0];
    if (!ab) return { criterio: o.criterio || '', key: null, isNew: false };
    return { criterio: o.criterio || ab.criterio, key: ab.ref ? liveKey('p' + ab.ref) : 'h' + ab.h, isNew: true };
  }
  /** Título de cada envío pendiente (§7.7, C16). */
  function opTitle(o) {
    if (o.op === 'create') return 'Registro nuevo · ' + (o.header.elemento || 'sin elemento');
    if (o.op === 'update') {
      var n = Object.keys(o.items || {}).length;
      var c = o.ref && pendingCreate(o.ref);
      var el = o.elemento || (c ? c.header.elemento : '') || (o.h ? 'fila ' + o.h : 'registro nuevo');
      return 'Cambios en ' + el + ' · ' + (n ? n + (n === 1 ? ' control' : ' controles') : 'datos del registro');
    }
    if (o.op === 'photo') return 'Foto · ' + recorte(o.criterio);
    var info = fumOpInfo(o);
    var acc = o.accion === 'cerrar' && o.resultado === 'Anulada' ? 'anular' : o.accion;
    var nTxt = o.num != null ? ' N° ' + o.num : info.isNew ? ' nueva' : '';
    var t = { abrir: 'Abrir FUM', cerrar: 'Cerrar FUM' + nTxt, anular: 'Anular FUM' + nTxt, editar: 'Editar FUM' + nTxt }[acc] || 'FUM' + nTxt;
    return t + (info.criterio ? ' · ' + recorte(info.criterio) : '');
  }

  function opRegKey(o) {
