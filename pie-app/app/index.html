      return markItem(reg, off, el.dataset.st).then(function (ok) { if (ok) render({ keepScroll: true }); });
    }
    if (a === 'more') { var k = reg.key + ':' + off; S.ui.open[k] = !S.ui.open[k]; return refreshItem(reg, off); }
    if (a === 'clear') {
      var cit = itemOf(reg, off);
      if (!cit) return;
      return ask(clearQuestion(itemFum(reg, cit))).then(function (r) {
        if (r !== 'ok') return;
        var cr = getReg(reg.sheet, reg.key);   // pudo terminar un envío mientras se preguntaba
        if (cr) clearItem(cr, off);           // clearItem vuelve a mirar el estado de la FUM
      });
    }
    if (a === 'docupdall') {
      var nd = docUpgrade(docDefault(reg) || '');
      var n = setRegDoc(reg, nd);
      toast('Plano actualizado a ' + nd + (n ? ' en ' + n + ' control' + (n === 1 ? '' : 'es') + ' pendiente' + (n === 1 ? '' : 's') : ''), { kind: 'ok' });
      return render({ keepScroll: true });
    }
    if (a === 'bulk') {
      if (!S.settings.inspector) { toast('Primero elegí quién sos', { kind: 'info' }); return nav('/quien'); }
      var bst = el.dataset.stage;
      var pendOf = function (r) { return r.items.filter(function (it) { return it.etapa === bst && itemState(it) === 'pend'; }); };
      var nb = pendOf(reg).length;
      if (!nb) return;
      return ask({
        title: nb === 1 ? '¿Aprobar el control pendiente de ' + bst + '?' : '¿Aprobar los ' + nb + ' controles pendientes de ' + bst + '?',
        body: 'Quedan AP con fecha de hoy y RESP. ' + S.settings.inspector + '.',
        ok: { label: 'Aprobar ' + nb, tone: 'ap' }
      }).then(function (r) {
        if (r !== 'ok') return;
        // se vuelve a leer: sólo lo que sigue pendiente al confirmar
        var br = getReg(reg.sheet, reg.key);
        if (!br) return;
        pendOf(br).forEach(function (it) { applyMark(getReg(reg.sheet, reg.key), it.off, 'ap', {}); });
        render({ keepScroll: true });
      });
    }
  });

  /** Hoja de «Descartar» en Ajustes › Envíos (§7.9), según el tipo de envío. */
  function discardQuestion(o) {
    var ok = { label: 'Descartar', tone: 'danger' };
    if (o.op === 'create') {
      return { title: '¿Descartar el registro nuevo «' + (o.header.elemento || 'sin elemento') + '»?',
        body: 'Se borra del celular con todo lo cargado (controles, fotos y FUM). No se puede deshacer.', ok: ok };
    }
    if (o.op === 'update') {
      var n = Object.keys(o.items || {}).length;
      var c = o.ref && pendingCreate(o.ref);
      var el = o.elemento || (c ? c.header.elemento : '') || (o.h ? 'fila ' + o.h : 'registro nuevo');
      return { title: '¿Descartar los cambios en «' + el + '»?',
        body: (n ? n + (n === 1 ? ' control' : ' controles') + '. ' : '') + 'Vuelven a como están en el PIE.', ok: ok };
    }
    if (o.op === 'photo') return { title: '¿Descartar esta foto?', body: 'Todavía no se envió.', ok: ok };
    if (o.accion === 'abrir') return { title: '¿Descartar la FUM de «' + recorte(o.criterio) + '»?', body: 'El control queda en RZ sin FUM.', ok: ok };
    return { title: '¿Descartar este cambio de la ' + (o.num ? 'FUM N° ' + o.num : 'FUM') + '?', body: 'La FUM queda como está en el FOG 01.', ok: ok };
  }

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.input === 'docq' && picker) { picker.q = el.value; renderDocList(); return; }
    if (el.dataset.input === 'search') { S.ui.search = el.value; var pos = el.selectionStart; renderHome(); var s = view.querySelector('[data-input=search]'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) { /* type=search */ } return; }
    if (el.dataset.input === 'regSearch') {
      S.ui.regSearch[el.dataset.sheet] = el.value;
      var p2 = el.selectionStart;
      render();
      var s2 = view.querySelector('[data-input=regSearch]');
      s2.focus();
      try { s2.setSelectionRange(p2, p2); } catch (e) { /* type=search */ }
      return;
    }

  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.regdoc) {
      var rm = /^\/c\/([^/]+)\//.exec(S.route);
      var rr = rm && getReg(rm[1], el.dataset.key);
      if (rr) {
        var cnt = setRegDoc(rr, el.value);
        if (cnt) toast('Plano aplicado a ' + cnt + ' control' + (cnt === 1 ? '' : 'es'), { kind: 'ok' });
        render({ keepScroll: true });
      }
      return;
    }
    if (el.dataset.photo) {
      var pm = /^\/c\/([^/]+)\//.exec(S.route);
      var preg = pm && getReg(pm[1], el.dataset.key);
      if (preg) addPhotos(preg, Number(el.dataset.off), el.files || []);
      el.value = '';
      return;
    }
    var det = el.closest('.det');
    if (!det || !(el.dataset.field || el.dataset.fum)) return;
    var m = /^\/c\/([^/]+)\//.exec(S.route);
    var reg = getReg(m[1], det.dataset.key);
    if (!reg) return;
    var doff = Number(det.dataset.off);
    var dit = reg.items.filter(function (x) { return x.off === doff; })[0];
    if (el.dataset.fum) {
      var ff = {};
      ff[el.dataset.fum] = el.value.trim();
      return editFum(reg, dit, ff);
    }
    if (el.dataset.field === 'instrumento' && needsSerial(dit.instrumento) && !needsSerial(el.value)) {
      LS.set('instr.' + normDoc(dit.instrumento), el.value);   // se recuerda para los próximos controles
    }
    if (el.dataset.field === 'obs') editFum(reg, dit, { obs: el.value.trim() });
    var patch = {};
    patch[el.dataset.field] = el.value.trim();
    editItem(reg, doff, patch);
    if (el.dataset.field === 'instrumento' || el.dataset.field === 'documento') refreshItem(getReg(m[1], det.dataset.key), doff);
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target;
    if (f.id === 'hdrForm') {
      ev.preventDefault();
      var m = /^\/c\/([^/]+)\//.exec(S.route);
      var reg = getReg(m[1], f.dataset.key);
      if (!reg) return;
      editHeader(reg, {
        elemento: f.elemento.value.trim(), piso: f.piso.value.trim(), sector: f.sector.value.trim(), etapa: f.etapa.value.trim(),
        responsables: [].slice.call(f.querySelectorAll('select[name=resp]')).map(function (s) { return s.value; })
      });
      S.ui.open['hdr:' + reg.key] = false;
      toast('Encabezado guardado', { kind: 'ok' });
      render({ keepScroll: true });
    }
    if (f.id === 'cfgForm') {
      ev.preventDefault();
      if (f.apiUrl) {
        var u = f.apiUrl.value.trim();
        if (u && !/^https:\/\/script\.google\.com\/.*\/exec(\?.*)?$/.test(u)) {
          toast(/docs\.google\.com\/spreadsheets/.test(u)
            ? 'Ese es el enlace de la planilla. Va el de la web app: Apps Script › Implementar › Administrar implementaciones (termina en /exec)'
            : 'La URL tiene que ser la de la web app de Apps Script y terminar en /exec', { kind: 'err', ms: 7000 });
          return;
        }
        S.settings.apiUrl = u;
      }
      S.settings.token = f.token.value.trim();
      saveSettings();
      toast('Probando conexión…');
      sync({ full: true, manual: true }).then(function (ok) { if (ok) { toast('Conectado', { kind: 'ok' }); render(); } });
    }
  });

  // un dibujo que se postergó porque había un campo en edición se hace al salir del campo
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (S.ui.renderOnBlur && !isEditing()) { S.ui.renderOnBlur = false; render({ keepScroll: true }); }
    }, 50);
  });

  /* Ciclo de vida: iOS congela la app en segundo plano y puede cerrarla sin aviso. */
  var swReg = null;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();   // dispara 'change': guarda lo escrito
      saveQueue();
    } else {
      onResume();
    }
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) onResume(); });
  /** Al volver a la app: se envía lo pendiente enseguida (los temporizadores estaban congelados). */
  function onResume() {
    renderTop();
    if ((navigator.onLine || IN_GAS) && S.queue.some(function (o) { return o.status === 'pending'; })) sync();
    if (swReg) { try { swReg.update().catch(function () { /* sin señal */ }); } catch (e) { /* noop */ } }
  }

  window.addEventListener('online', function () { renderTop(); sync(); });
  window.addEventListener('offline', function () { renderTop(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__piePrompt = e; });
  setInterval(function () { if (S.queue.some(function (o) { return o.status === 'pending'; }) && navigator.onLine) sync(); }, 120000);

  /* ================================================================
   *  Arranque
   * ================================================================ */
  function boot() {
    document.addEventListener('touchstart', function () {}, { passive: true });   // sin esto iOS no aplica :active
    try { history.scrollRestoration = 'manual'; } catch (e) { /* noop */ }
    applyTheme(LS.get('theme', 'auto'), true);   // color de la barra de estado si el tema está forzado
    // Configuración por enlace: index.html?api=<url>&token=<clave>
    if (MODE === 'pwa') {
      var qs = new URLSearchParams(location.search);
      if (qs.get('api')) { S.settings.apiUrl = qs.get('api'); }
      if (qs.get('token')) { S.settings.token = qs.get('token'); }
      if (qs.get('api') || qs.get('token')) {
        saveSettings();
        try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* noop */ }
      }
      if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) {
        navigator.serviceWorker.register('sw.js').then(function (reg) { swReg = reg; }, function () { /* sin SW */ });
      }
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
      var r = decodeURIComponent(location.hash.slice(1));
      if (r) S.route = r;
      // pedir que el navegador no borre lo guardado sin señal
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* noop */ }); } catch (e) { /* noop */ }
    }
    S.resolved = LS.get('resolved', {});
    Promise.all([KV.get('catalog'), KV.get('queue')]).then(function (v) {
      S.catalog = v[0] || null;
      S.queue = (v[1] || []).map(function (o) { if (o.status === 'sending') o.status = 'pending'; return o; });
      queueLoaded = true;
      migrateResolved();
      render();
      S.queue.filter(function (o) { return o.op === 'photo'; }).forEach(function (o) {
        KV.get(o.img).then(function (d) { if (d) { S.thumbs[o.id] = d; } });
      });
      if (IN_GAS || navigator.onLine) {
        sync({ full: true }).then(function () {
          if (S.catalog && !S.settings.inspector && S.route === '/') nav('/quien');
        });
      }
    });
  }
  boot();
})();
</script>
</body>
</html>
