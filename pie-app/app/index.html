<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PIE">
<title>PIE · Carga</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #17202c;
    --muted: #5d6b7c;
    --line: #dde3ea;
    --brand: #1d3557;
    --brand-ink: #ffffff;
    --accent: #2f6fde;
    --ap: #18733f;
    --ap-bg: #e3f4ea;
    --rz: #b42828;
    --rz-bg: #fbe5e5;
    --na: #6b7684;
    --na-bg: #eceff3;
    --pend: #8a5a12;
    --pend-bg: #fdf3e1;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a;
      --card: #18202a;
      --ink: #e6ebf1;
      --muted: #97a3b1;
      --line: #2a3542;
      --brand: #142338;
      --accent: #6b9cf0;
      --ap: #4cc27f;
      --ap-bg: #173325;
      --rz: #f07171;
      --rz-bg: #3a1c1e;
      --na: #a0abb8;
      --na-bg: #232c37;
      --pend: #e2a64a;
      --pend-bg: #33291a;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--brand); color: var(--brand-ink);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  header.top .back {
    background: transparent; border: 0; color: inherit; font-size: 22px; line-height: 1;
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; flex: none;
  }
  header.top .back:active { background: rgba(255,255,255,.15); }
  header.top .ttl { flex: 1; min-width: 0; }
  header.top .ttl b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top .ttl small { display: block; opacity: .75; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .net {
    flex: none; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: inherit;
    border-radius: 999px; padding: 5px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .net i { width: 8px; height: 8px; border-radius: 50%; background: #9aa5b1; display: inline-block; }
  .net.on i { background: #46d38a; }
  .net.off i { background: #f0a43a; }
  .net.busy i { background: #6bb6ff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .icon-btn { background: transparent; border: 0; color: inherit; width: 44px; height: 44px; border-radius: 10px; font-size: 20px; flex: none; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 12px calc(96px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }
  h2.sec { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; font-weight: 600; }
  .search { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  .row:active { transform: scale(.995); }
  .row .num { flex: none; min-width: 38px; height: 38px; border-radius: 10px; background: var(--na-bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; padding: 0 6px; }
  .row .grow { flex: 1; min-width: 0; }
  .row .grow b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .row .chev { color: var(--muted); flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--na-bg); color: var(--muted); white-space: nowrap; }
  .chip.ap { background: var(--ap-bg); color: var(--ap); }
  .chip.rz { background: var(--rz-bg); color: var(--rz); }
  .chip.pend { background: var(--pend-bg); color: var(--pend); }
  .chip.sync { background: #e7efff; color: #2753b8; }
  @media (prefers-color-scheme: dark) { .chip.sync { background: #1d2c4a; color: #9dbbff; } }
  .bar { height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--na-bg); margin-top: 8px; }
  .bar span { display: block; height: 100%; }
  .bar .ap { background: var(--ap); } .bar .rz { background: var(--rz); } .bar .na { background: #9aa5b1; }
  .seg { display: flex; background: var(--na-bg); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 15;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 700;
    box-shadow: 0 6px 16px rgba(47,111,222,.35); display: flex; align-items: center; gap: 8px;
  }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 10px 14px; border-radius: 10px; font-weight: 600; min-height: 44px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--rz); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-height: 42px; }
  textarea.in { min-height: 64px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
  @media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .stage { margin-top: 14px; }
  .stage-h { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; }
  .stage-h .fold { border: 0; background: transparent; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0; font: inherit; color: inherit; }
  .nextpend {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 15;
    background: var(--ink); color: var(--card); border: 0; border-radius: 999px; padding: 0 22px; min-height: 52px;
    font-weight: 700; font-size: 15px; box-shadow: 0 6px 16px rgba(0,0,0,.25); white-space: nowrap;
  }
  .stage-h b { font-size: 13px; letter-spacing: .05em; }
  .stage-h .sp { flex: 1; }
  .task { margin-bottom: 10px; }
  .task-h { font-weight: 600; font-size: 14px; padding: 10px 14px 6px; display: flex; gap: 8px; align-items: baseline; }
  .task-h .mu { margin-left: auto; font-weight: 500; }
  .item { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
  .item:first-of-type { border-top: 0; }
  .item.ap { box-shadow: inset 4px 0 0 var(--ap); }
  .item.rz { box-shadow: inset 4px 0 0 var(--rz); }
  .item.na { box-shadow: inset 4px 0 0 #9aa5b1; }
  .item .crit { font-size: 16px; line-height: 1.35; white-space: pre-line; }
  .item .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .acts { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .acts .st { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; min-height: 48px; font-weight: 800; font-size: 15px; min-width: 0; }
  .acts .st.ap.on { background: var(--ap); border-color: var(--ap); color: #fff; }
  .acts .st.rz.on { background: var(--rz); border-color: var(--rz); color: #fff; }
  .acts .st.na.on { background: var(--na); border-color: var(--na); color: #fff; }
  .acts .more { flex: none; width: 52px; min-height: 48px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; font-size: 18px; }
  .filled { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .det { margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); }
  .det .grid2 label.f, .det label.f { margin-bottom: 8px; }
  .det .in { background: var(--card); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); font-size: 12px; text-transform: uppercase; padding-top: 2px; }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .empty { text-align: center; padding: 32px 16px; color: var(--muted); }
  .note { background: var(--pend-bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; border: 1px solid transparent; }
  .note.info { background: #e7efff; }
  @media (prefers-color-scheme: dark) { .note.info { background: #1d2c4a; } }
  .note.err { background: var(--rz-bg); }
  .req-crit { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .req-crit:first-of-type { border-top: 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: #222b36; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
    pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .filters { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 2px; padding-bottom: 2px; }
  .filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; min-height: 44px; font-size: 14px; white-space: nowrap; }
  .filters button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  details.hid > summary { cursor: pointer; list-style: none; }
  details.hid > summary::-webkit-details-marker { display: none; }
  .op { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-top: 1px solid var(--line); }
  .op:first-child { border-top: 0; }
  .op .grow { flex: 1; min-width: 0; }
  .spacer { height: 10px; }
  .flex { display: flex; gap: 8px; align-items: center; }
  .flex .grow { flex: 1; }
  .modal { position: fixed; inset: 0; z-index: 40; background: rgba(10, 15, 25, .45); display: flex; align-items: flex-end; justify-content: center; }
  .modal .panel { background: var(--card); width: 100%; max-width: 760px; height: 88vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  .modal .ph { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  .modal .pb { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .doc { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 14px; }
  .doc:first-child { border-top: 0; }
  .doc:active { background: var(--na-bg); }
  .doc .code { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
  .pick, label.f > span.pick { display: flex; gap: 6px; font-size: inherit; font-weight: 400; text-transform: none; letter-spacing: 0; color: inherit; margin: 0; }
  .pick .in { flex: 1; min-width: 0; }
  .pick .btn { flex: none; padding: 8px 12px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .thumbs .t { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: var(--na-bg); display: grid; place-items: center; font-size: 22px; position: relative; border: 0; padding: 0; color: var(--muted); text-decoration: none; }
  .thumbs .t img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .thumbs .t i { position: absolute; right: 3px; bottom: 3px; font-style: normal; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; border-radius: 6px; padding: 0 4px; }
  .file-btn { position: relative; overflow: hidden; text-align: center; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .warn { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .warn .chip { white-space: normal; }
  .fumbox { margin: 4px 0 10px; padding: 10px; border-radius: 10px; background: var(--rz-bg); border: 1px solid transparent; }
  .fumbox b { color: var(--rz); }
  .fumbox.ok { background: var(--ap-bg); }
  .fumbox.ok b { color: var(--ap); }
  .fumrow .late { color: var(--rz); font-weight: 700; }
  .hl { animation: hl 1.4s ease-out; }
  @keyframes hl { from { background: #fff4c2; } }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<script>/*PIE_BOOT*/</script>
<script>
(function () {
  'use strict';

  /* ================================================================
   *  Entorno
   * ================================================================ */
  var BOOT = window.PIE_BOOT || {};
  var IN_GAS = !!(window.google && google.script && google.script.run);
  var MODE = IN_GAS ? (BOOT.mode || 'webapp') : 'pwa';
  var APP_VERSION = '1.5.0';
  var ETAPAS = ['PRE', 'DURANTE', 'POST', 'DOC'];
  var FIELDS = ['documento', 'fecha', 'resp', 'estado', 'fum', 'obs', 'instrumento'];

  /* ================================================================
   *  Almacenamiento local (IndexedDB con respaldo en localStorage)
   * ================================================================ */
  var LS = {
    get: function (k, d) {
      try { var v = localStorage.getItem('pie.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem('pie.' + k, JSON.stringify(v)); } catch (e) { /* sin espacio o bloqueado */ }
    }
  };

  var KV = (function () {
    var dbp = null;
    function db() {
      if (dbp) return dbp;
      dbp = new Promise(function (res, rej) {
        if (!window.indexedDB) return rej(new Error('sin indexedDB'));
        var r = indexedDB.open('pie', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
      return dbp;
    }
    var mem = {};
    return {
      get: function (k) {
        return db().then(function (d) {
          return new Promise(function (res, rej) {
            var q = d.transaction('kv').objectStore('kv').get(k);
            q.onsuccess = function () { res(q.result); };
            q.onerror = function () { rej(q.error); };
          });
        }).catch(function () { return LS.get('kv.' + k, mem[k]); });
      },
      set: function (k, v) {
        mem[k] = v;
        return db().then(function (d) {
          return new Promise(function (res, rej) {
            var t = d.transaction('kv', 'readwrite');
            t.objectStore('kv').put(v, k);
            t.oncomplete = function () { res(); };
            t.onerror = function () { rej(t.error); };
          });
        }).catch(function () { LS.set('kv.' + k, v); });
      },
      del: function (k) {
        delete mem[k];
        return db().then(function (d) {
          return new Promise(function (res) {
            var t = d.transaction('kv', 'readwrite');
            t.objectStore('kv').delete(k);
            t.oncomplete = function () { res(); };
            t.onerror = function () { res(); };
          });
        }).catch(function () { try { localStorage.removeItem('pie.kv.' + k); } catch (e) { /* noop */ } });
      }
    };
  })();

  /* ================================================================
   *  Estado
   * ================================================================ */
  var S = {
    catalog: null,          // respuesta de action=catalog
    queue: [],              // operaciones pendientes de sincronizar
    resolved: {},           // id de alta local -> {sheet, h}
    settings: LS.get('settings', { apiUrl: '', token: '', inspector: '' }),
    syncing: false,
    lastSync: LS.get('lastSync', 0),
    lastError: '',
    route: '/',
    stack: [],
    thumbs: {},             // id de foto pendiente -> dataURL (miniatura local)
    ui: { tab: {}, filter: {}, open: {}, search: '', regSearch: {}, folded: {} }
  };
  if (BOOT.token) S.settings.token = BOOT.token;

  function saveSettings() { LS.set('settings', S.settings); }
  function saveQueue() { return KV.set('queue', S.queue); }

  /* ================================================================
   *  Utilidades
   * ================================================================ */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* contexto no seguro */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function localStamp() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return today() + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function today() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(v) {
    if (!v) return '';
    if (String(v).toUpperCase() === 'NA') return 'N/A';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : v;
  }
  function fmtMuestra(m) {
    if (m === '' || m == null) return '';
    var n = Number(m);
    return isFinite(n) && n <= 1 ? Math.round(n * 100) + '%' : String(m);
  }
  function ago(ts) {
    if (!ts) return 'nunca';
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return 'recién';
    if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
    return new Date(ts).toLocaleDateString('es-AR');
  }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  var toastT;
  function toast(msg, ms) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove('show'); }, ms || 2600);
  }
  function datos() { return (S.catalog && S.catalog.datos) || { responsables: [], obra: '' }; }
  function abrevOf(nombre) {
    var r = datos().responsables.filter(function (x) { return x.nombre === nombre; })[0];
    return r ? r.abrev : '';
  }

  /* ================================================================
   *  Modelo: catálogo + cola local
   * ================================================================ */
  function category(sheet) {
    if (!S.catalog) return null;
    return S.catalog.categorias.filter(function (c) { return c.sheet === sheet; })[0] || null;
  }
  function expandItem(cat, raw) {
    var c = cat.crit[raw[1]];
    return {
      off: raw[0], etapa: c[0], tarea: c[1], muestra: c[2], criterio: c[3], metodo: c[4], instrumento: c[5],
      documento: raw[2], fecha: raw[3], resp: raw[4], estado: raw[5], fum: raw[6], obs: raw[7]
    };
  }
  function applyPatch(item, patch) {
    FIELDS.forEach(function (f) { if (patch.hasOwnProperty(f)) item[f] = patch[f]; });
  }
  function pendingCreate(id) {
    return S.queue.filter(function (o) { return o.id === id && o.op === 'create'; })[0] || null;
  }

  /** Registro "vivo": datos del servidor + cambios locales sin sincronizar. */
  function getReg(sheet, key) {
    var cat = category(sheet);
    var reg;
    if (key.charAt(0) === 'p') {
      var id = key.slice(1);
      var op = pendingCreate(id);
      if (!op) return null;
      reg = {
        key: key, pending: true, opId: id, sheet: sheet, h: null, sig: op.base.sig,
        resp: (op.header.responsables || []).slice(), slots: op.slots || 3,
        piso: op.header.piso || '', sector: op.header.sector || '', etapa: op.header.etapa || '', elemento: op.header.elemento || '',
        items: op.snapshot.map(function (s) {
          var it = { off: s[0], etapa: s[1], tarea: s[2], muestra: s[3], criterio: s[4], metodo: s[5], instrumento: s[6], documento: '', fecha: '', resp: '', estado: '', fum: '', obs: '' };
          if (op.items[it.off]) applyPatch(it, op.items[it.off]);
          return it;
        }),
        dirty: true
      };

  /* ================================================================

  function normDoc(s) { return norm(s).toUpperCase().replace(/[^A-Z0-9°º]+/g, '-').replace(/^-+|-+$/g, ''); }

  function docRefs(text) {

    String(text).split(/\/\/|;/).forEach(function (part) {

    view.innerHTML = html;

  /* ================================================================
   *  Fotos de control
   * ================================================================ */
  function compressImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1600;
        var w = img.naturalWidth, h = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * k);
        c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Imagen inválida')); };
      img.src = url;
    });
  }
  function addPhotos(reg, off, files) {
    var it = reg.items.filter(function (x) { return x.off === off; })[0];
    if (!it || !files.length) return;
    toast('Procesando ' + (files.length === 1 ? 'foto' : files.length + ' fotos') + '…');
    [].slice.call(files).reduce(function (p, f) {
      return p.then(function () { return compressImage(f); }).then(function (dataUrl) {
        var id = uid();
        var op = {
          id: id, op: 'photo', sheet: reg.sheet, off: off, criterio: it.criterio, tarea: it.tarea, mime: 'image/jpeg',
          img: 'img:' + id, status: 'pending', createdAt: Date.now(), by: S.settings.inspector, takenAt: localStamp()
        };
        if (reg.pending) op.ref = reg.opId; else { op.h = reg.h; op.sig = reg.sig; op.elemento = reg.elemento; }
        S.thumbs[id] = dataUrl;
        return KV.set(op.img, dataUrl).then(function () { S.queue.push(op); });
      });
    }, Promise.resolve()).then(function () {
      queueChanged();
      var fresh = getReg(reg.sheet, reg.key);
      if (fresh) refreshItem(fresh, off);
      toast(navigator.onLine || IN_GAS ? 'Foto guardada · subiendo…' : 'Foto guardada en el celular · se sube al tener señal');
    }).catch(function (e) { toast('No se pudo procesar la foto: ' + e.message); });
  }
  function photoThumbs(reg, it) {
    var server = (reg.fotos && reg.fotos[it.off]) || [];
    var local = (reg.localFotos && reg.localFotos[it.off]) || [];
    return server.map(function (f) {
      return '<a class="t" href="' + esc(f[1]) + '" target="_blank" rel="noopener" title="Ver foto">📷' +
        '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(f[0]) + '&sz=w200" alt="" onerror="this.remove()"></a>';
    }).concat(local.map(function (o) {
      return '<button class="t" data-act="rmphoto" data-id="' + esc(o.id) + '" title="Sin subir (tocar para quitar)">' +
        (S.thumbs[o.id] ? '<img src="' + S.thumbs[o.id] + '" alt="">' : '📷') +
        '<i>' + (o.status === 'error' ? '⚠' : '⏳') + '</i></button>';
    })).join('');
  }

  /* ================================================================
   *  Comunicación con Apps Script
   * ================================================================ */
  function apiError(msg, code) { var e = new Error(msg); e.code = code || 'error'; return e; }

  function callApi(req) {
    req.token = S.settings.token || '';
    if (IN_GAS) {
      return new Promise(function (res, rej) {
        google.script.run
          .withSuccessHandler(function (r) { r && r.ok ? res(r) : rej(apiError(r && r.error || 'Error del servidor', r && r.code)); })
          .withFailureHandler(function (e) { rej(apiError(String(e && e.message || e), 'network')); })
          .api(req);
      });
    }
    var url = (S.settings.apiUrl || '').trim();
    if (!url) return Promise.reject(apiError('Configurá la URL de la API en Ajustes', 'config'));
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 90000);
    var p;
    // todo por POST: la clave nunca viaja en la URL
    p = fetch(url, {
      method: 'POST', redirect: 'follow', signal: ctl && ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(req)
    });
    return p.then(function (r) {
      clearTimeout(t);
      return r.text().then(function (txt) {
        var data;
        try { data = JSON.parse(txt); } catch (e) {
          throw apiError('Respuesta inesperada del servidor (¿la web app está publicada con acceso "Cualquier persona"?)', 'config');
        }
        if (!data.ok) throw apiError(data.error || 'Error del servidor', data.code);
        return data;
      });
    }, function (e) {
      clearTimeout(t);
      throw apiError('Sin conexión con el servidor', 'network');
    });
  }

  function mergeCategories(cats) {
    if (!S.catalog || !cats) return;
    cats.forEach(function (c) {
      var i = S.catalog.categorias.findIndex(function (x) { return x.sheet === c.sheet; });
      if (i >= 0) S.catalog.categorias[i] = c; else S.catalog.categorias.push(c);
    });
    KV.set('catalog', S.catalog);
  }

  /** Hay un formulario o campo en edición que un re-render borraría. */
  function isEditing() {
    if (!S.catalog) return false;
    if (/\/nuevo$/.test(S.route) || S.route === '/ajustes') return true;
    if (document.getElementById('hdrForm')) return true;
    var a = document.activeElement;
    return !!(a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'search');
  }

  function stripOp(o) {
    var c = {};
    Object.keys(o).forEach(function (k) {
      if (['snapshot', 'status', 'error', 'createdAt', 'slots', 'docDefault', 'img'].indexOf(k) < 0) c[k] = o[k];
    });
    return c;
  }
  function handleResults(res) {
    var created = [];
    var errors = [];
    var photos = 0;
    res.results.forEach(function (r) {
      var op = S.queue.filter(function (o) { return o.id === r.id; })[0];
      if (!op) return;
      if (r.ok) {
        if (op.op === 'create') { S.resolved[op.id] = { sheet: r.sheet || op.sheet, h: r.h }; created.push(op.id); }
        if (op.op === 'photo') { photos++; KV.del(op.img); delete S.thumbs[op.id]; }
        if (r.warnings && r.warnings.length) toast('Aviso: ' + r.warnings[0], 5000);
        S.queue.splice(S.queue.indexOf(op), 1);
      } else if (['retry', 'busy', 'network'].indexOf(r.code) >= 0) {
        op.status = 'pending';
      } else {
        op.status = 'error';
        op.error = r.error;
        errors.push(r.error);
      }
    });
    LS.set('resolved', S.resolved);
    if (res.fums && S.catalog) S.catalog.fums = res.fums;
    var nuevas = res.results.filter(function (r) { return r.ok && !r.dup && r.fum != null; }).length;
    mergeCategories(res.categorias);
    saveQueue();
    if (errors.length) toast('No se pudo guardar: ' + errors[0], 6000);
    else if (created.length) toast(created.length === 1 ? 'Registro creado en la planilla' : created.length + ' registros creados');
    else if (photos) toast(photos === 1 ? 'Foto subida' : photos + ' fotos subidas');
    else if (nuevas) toast('FUM actualizada en la planilla');
  }
  /** Sube las fotos pendientes de a una (cada una es una request chica). */
  function sendPhotos() {
    var list = S.queue.filter(function (o) { return o.op === 'photo' && o.status === 'pending'; });
    return list.reduce(function (p, o) {
      return p.then(function () {
        if (o.ref && pendingCreate(o.ref)) return; // espera a que exista el registro
        return KV.get(o.img).then(function (data) {
          if (!data) { o.status = 'error'; o.error = 'La foto ya no está guardada en este dispositivo'; saveQueue(); return; }
          o.status = 'sending';
          renderTop();
          var payload = stripOp(o);
          payload.data = String(data).split(',')[1];
          return callApi({ action: 'batch', ops: [payload] }).then(handleResults, function (e) {
            if (o.status === 'sending') o.status = 'pending';
            saveQueue();
            throw e;
          });
        });
      });
    }, Promise.resolve());
  }

  var syncWaiters = [];
  function sync(opts) {
    opts = opts || {};
    if (S.syncing) return new Promise(function (r) { syncWaiters.push(r); });
    if (!navigator.onLine && !IN_GAS) { renderTop(); return Promise.resolve(false); }
    S.syncing = true;
    S.lastError = '';
    renderTop();
    // primero altas y cambios en un solo lote; las fotos van después, de a una
    var sending = S.queue.filter(function (o) { return o.status === 'pending' && o.op !== 'photo'; });
    var chain = Promise.resolve();
    if (sending.length) {
      sending.forEach(function (o) { o.status = 'sending'; });
      saveQueue();
      chain = callApi({ action: 'batch', ops: sending.map(stripOp) }).then(handleResults, function (e) {
        sending.forEach(function (o) { if (o.status === 'sending') o.status = 'pending'; });
        saveQueue();
        throw e;
      });
    }
    return chain.then(sendPhotos).then(function () {
      if (opts.full || !S.catalog || Date.now() - S.lastSync > 10 * 60 * 1000) {
        return callApi({ action: 'catalog' }).then(function (c) {
          S.catalog = c;
          KV.set('catalog', c);
        });
      }
    }).then(function () {
      S.lastSync = Date.now();
      LS.set('lastSync', S.lastSync);
      return true;
    }).catch(function (e) {
      S.lastError = e.message;
      if (e.code === 'auth' || e.code === 'config') {
        toast(e.message, 5000);
      } else if (opts.manual) {
        toast(e.message);
      }
      return false;
    }).then(function (ok) {
      S.syncing = false;
      // si el usuario estaba viendo un alta local que ya se creó, redirigir al registro real
      var m = /^\/c\/([^/]+)\/r\/p(.+)$/.exec(S.route);
      if (m && S.resolved[m[2]] && !pendingCreate(m[2])) {
        nav('/c/' + m[1] + '/r/h' + S.resolved[m[2]].h, { replace: true });
      } else if (isEditing()) {
        renderTop();   // no pisar lo que el usuario está escribiendo
      } else {
        render({ keepScroll: true });
      }
      syncWaiters.splice(0).forEach(function (r) { r(ok); });
      return ok;
    });
  }

  /* ================================================================
   *  Navegación
   * ================================================================ */
  function nav(route, o) {
    o = o || {};
    if (route === S.route) return render();
    if (!o.replace) S.stack.push(S.route);
    S.route = route;
    if (!IN_GAS) {
      try { history[o.replace ? 'replaceState' : 'pushState'](null, '', '#' + route); } catch (e) { /* iframe */ }
    }
    render();
    window.scrollTo(0, 0);
  }
  function back() {
    if (!IN_GAS && S.stack.length) { history.back(); return; }
    var prev = S.stack.pop();
    S.route = prev || parentOf(S.route);
    render();
  }
  function parentOf(r) {
    var m;
    if ((m = /^\/c\/([^/]+)\/.+/.exec(r))) return '/c/' + m[1];
    return '/';
  }
  window.addEventListener('popstate', function () {
    if (picker) { closeModal(); }
    S.stack.pop();
    S.route = decodeURIComponent(location.hash.slice(1)) || '/';
    render();
  });

  /* ================================================================
   *  Render
   * ================================================================ */
  var view = document.getElementById('view');

  function pendingCount() { return S.queue.length; }

  function renderTop(title, sub) {
    var top = document.getElementById('top');
    if (title !== undefined) { top.dataset.title = title; top.dataset.sub = sub || ''; }
    var online = IN_GAS || navigator.onLine;
    var n = pendingCount();
    var cls = S.syncing ? 'busy' : (online ? 'on' : 'off');
    var label = S.syncing ? 'Sincronizando…' : (!online ? 'Sin conexión' : (n ? n + ' sin enviar' : 'Al día'));
    if (!S.syncing && online && S.queue.some(function (o) { return o.status === 'error'; })) { cls = 'off'; label = 'Revisar envíos'; }
    if (online && !S.syncing && n === 0 && S.lastError) { cls = 'off'; label = 'Sin conexión'; }
    if (!online && n) label = 'Offline · ' + n + ' sin enviar';
    var isRoot = S.route === '/';
    top.innerHTML =
      (isRoot ? '' : '<button class="back" data-act="back" aria-label="Volver">‹</button>') +
      '<div class="ttl"><b>' + esc(top.dataset.title || 'PIE') + '</b><small>' + esc(top.dataset.sub || '') + '</small></div>' +
      '<button class="net ' + cls + '" data-act="sync" title="Sincronizar"><i></i>' + esc(label) + '</button>' +
      (S.route === '/ajustes' ? '' : '<button class="icon-btn" data-act="go" data-to="/ajustes" aria-label="Ajustes">⚙︎</button>');
  }

  function render(o) {
    o = o || {};
    var y = window.scrollY;
    var r = S.route, m;
    if (!S.catalog && r !== '/ajustes') {
      renderTop('PIE · Carga', 'Plan de Inspección y Ensayo');
      view.innerHTML = S.syncing
        ? '<div class="empty">Descargando planillas…</div>'
        : '<div class="empty"><p>Todavía no hay datos en este dispositivo.</p>' +
          (S.lastError ? '<p class="note err">' + esc(S.lastError) + '</p>' : '') +
          '<p><button class="btn primary" data-act="sync" data-full="1">Descargar planillas</button></p>' +
          (MODE === 'pwa' ? '<p><button class="btn" data-act="go" data-to="/ajustes">Configurar conexión</button></p>' : '') + '</div>';
      return;
    }
    if (r === '/') renderHome();
    else if (r === '/ajustes') renderSettings();
    else if (r === '/quien') renderWho();
    else if (r === '/fum') renderFum();
    else if ((m = /^\/c\/([^/]+)$/.exec(r))) renderCategory(m[1]);
    else if ((m = /^\/c\/([^/]+)\/nuevo$/.exec(r))) renderNew(m[1]);
    else if ((m = /^\/c\/([^/]+)\/r\/([ph].+)$/.exec(r))) renderReg(m[1], m[2]);
    else { S.route = '/'; renderHome(); }
    if (o.keepScroll) window.scrollTo(0, y);
  }

  /* ---------- Inicio: categorías por rubro ---------- */
  function renderHome() {
    var d = datos();
    renderTop('PIE · ' + (d.obra || 'Obra'), 'FOP 01 · ' + (d.direccion || ''));
    var q = norm(S.ui.search);
    var groups = {};
    var order = [];
    var hidden = [];
    S.catalog.categorias.forEach(function (c) {
      if (q && norm(c.sheet + ' ' + c.titulo).indexOf(q) < 0) return;
      if (c.oculta && !q && !hasLocal(c.sheet)) { hidden.push(c); return; }
      if (!groups[c.rubro]) { groups[c.rubro] = []; order.push(c.rubro); }
      groups[c.rubro].push(c);
    });
    var html = '<input class="search" type="search" placeholder="Buscar planilla (ej. hormigón, 28)" value="' + esc(S.ui.search) + '" data-input="search">';
    var of = openFums();
    var late = of.filter(function (f) { return f.plazo && f.plazo < today(); }).length;
    html += '<div class="spacer"></div><button class="row" data-act="go" data-to="/fum"><span class="num" style="background:' + (of.length ? 'var(--rz-bg);color:var(--rz)' : 'var(--ap-bg);color:var(--ap)') + '">' + of.length + '</span>' +
      '<span class="grow"><b>Rechazos · FUM abiertas</b><span class="chips">' +
      (late ? '<span class="chip rz">' + late + ' con reinspección vencida</span>' : '<span class="chip">' + (of.length ? 'seguimiento de no conformidades' : 'sin rechazos pendientes') + '</span>') +
      '</span></span><span class="chev">›</span></button>';
    if (!S.settings.inspector) {
      html += '<div class="spacer"></div><div class="note info">Elegí quién sos para completar automáticamente el responsable. <button class="btn" data-act="go" data-to="/quien">Elegir</button></div>';
    }
    order.forEach(function (g) {
      html += '<h2 class="sec">' + esc(g) + '</h2><div class="list">' + groups[g].map(catRow).join('') + '</div>';
    });
    if (hidden.length) {
      html += '<details class="hid"><summary><h2 class="sec">Planillas sin uso (ocultas) · ' + hidden.length + ' ▾</h2></summary><div class="list">' +
        hidden.map(catRow).join('') + '</div></details>';
    }
    if (!order.length && !hidden.length) html += '<div class="empty">Sin resultados</div>';
    html += '<p class="tiny muted" style="text-align:center;margin-top:24px">Datos ' + esc(ago(S.lastSync)) + ' · v' + APP_VERSION + '</p>';
    view.innerHTML = html;
  }
  function hasLocal(sheet) { return S.queue.some(function (o) { return o.sheet === sheet; }); }
  function catRow(c) {
    var regs = c.registros;
    var local = S.queue.filter(function (o) { return o.sheet === c.sheet && o.op === 'create'; }).length;
    var usedRegs = regs.filter(function (r) { return r.elemento || r.piso || r.items.some(function (x) { return x[5] || x[3]; }); });
    var used = usedRegs.length;
    var inProgress = usedRegs.filter(function (r) {
      return r.items.some(function (x) { return !String(x[5]).trim() && String(x[3]).toUpperCase() !== 'NA'; });
    }).length;
    var supers = usedRegs.filter(function (r) { var n = regDocAlerts(r.items.map(rawItem)); return n.bad || n.old; }).length;
    var fumN = fumsAll().filter(function (f) { return f[1] === c.sheet && f[5] === 'Abierta'; }).length;
    return '<button class="row" data-act="go" data-to="/c/' + esc(c.sheet) + '">' +
      '<span class="num">' + esc(c.sheet) + '</span><span class="grow"><b>' + esc(c.titulo) + '</b>' +
      '<span class="chips"><span class="chip">' + used + ' registro' + (used === 1 ? '' : 's') + '</span>' +
      (inProgress && used ? '<span class="chip pend">' + inProgress + ' con pendientes</span>' : '') +
      (fumN ? '<span class="chip rz">' + fumN + ' FUM abierta' + (fumN > 1 ? 's' : '') + '</span>' : '') +
      (supers ? '<span class="chip rz">⚠ ' + supers + ' con doc. superado</span>' : '') +
      (local ? '<span class="chip sync">' + local + ' nuevo' + (local > 1 ? 's' : '') + ' sin enviar</span>' : '') +
      (c.oculta ? '<span class="chip">oculta</span>' : '') +
      '</span></span><span class="chev">›</span></button>';
  }

  /* ---------- Categoría: registros y requisitos ---------- */
  function renderCategory(sheet) {
    var cat = category(sheet);
    if (!cat) { nav('/', { replace: true }); return; }
    renderTop(cat.sheet + ' · ' + cat.titulo, cat.rubro);
    var tab = S.ui.tab[sheet] || 'reg';
    var html = '<div class="seg"><button class="' + (tab === 'reg' ? 'on' : '') + '" data-act="tab" data-sheet="' + esc(sheet) + '" data-tab="reg">Registros</button>' +
      '<button class="' + (tab === 'req' ? 'on' : '') + '" data-act="tab" data-sheet="' + esc(sheet) + '" data-tab="req">Requisitos</button></div>';
    html += tab === 'reg' ? regList(sheet) : reqList(sheet);
    html += '<button class="fab" data-act="go" data-to="/c/' + esc(sheet) + '/nuevo"><span style="font-size:20px;line-height:1">＋</span> Nuevo registro</button>';
    view.innerHTML = html;
  }
  function regList(sheet) {
    var regs = listRegs(sheet);
    var q = norm(S.ui.regSearch[sheet]);
    var html = '';
    if (regs.length > 5) {
      html += '<input class="search" type="search" placeholder="Buscar elemento, piso, sector" value="' + esc(S.ui.regSearch[sheet] || '') + '" data-input="regSearch" data-sheet="' + esc(sheet) + '"><div class="spacer"></div>';
    }
    if (category(sheet).oculta) html += '<div class="note">Esta planilla está oculta en el Excel. Al crear un registro se vuelve a mostrar.</div>';
    var shown = regs.filter(function (r) { return !q || norm([r.elemento, r.piso, r.sector, r.etapa].join(' ')).indexOf(q) >= 0; });
    if (!shown.length) return html + '<div class="empty">No hay registros' + (q ? ' que coincidan' : '') + '.</div>';
    html += '<div class="list">' + shown.map(function (r) {

  function refreshItem(reg, off) {
    var it = reg.items.filter(function (x) { return x.off === off; })[0];
    var el = document.getElementById('it-' + off);
    if (!el || !it) return render({ keepScroll: true });
    var tmp = document.createElement('div');
    tmp.innerHTML = itemCard(reg, it);
    el.replaceWith(tmp.firstChild);
  }

  /** Devuelve false si el usuario canceló. */
  function markItem(reg, off, st, opts) {
    opts = opts || {};
    var it = reg.items.filter(function (x) { return x.off === off; })[0];
    var cur = itemState(it);
    var me = S.settings.inspector;
    var f = itemFum(reg, it);
    var fumNum = f.server ? f.server[0] : null;
    var patch;
    if (cur === st) {
      // desmarcar un RZ: la FUM sin enviar se descarta; la ya creada se anula
      if (cur === 'rz' && f.open) {
        if (f.pend && f.pend.status === 'pending') dropOp(f.pend);
        else {
          if (!opts.silent && !confirm('¿Anular la ' + (fumNum ? 'FUM N° ' + fumNum : 'FUM') + ' de este control?')) return false;
          queueFum(reg, it, fumNum ? { accion: 'cerrar', num: fumNum, resultado: 'Anulada', fecha: today() } : { accion: 'cerrar', ref: f.pend.id, resultado: 'Anulada', fecha: today() });
        }
      }
      patch = { estado: '', fecha: '', resp: '' };
    } else {
      if (st === 'rz') {
        if (!f.open && !it.fum) queueFum(reg, it, { accion: 'abrir', obs: it.obs || '', accionInmediata: 'Reparar' });
        S.ui.open[reg.key + ':' + off] = true;
      } else if (f.open) {
        // reinspección: AP / N/A sobre un control con FUM abierta la cierra
        if (f.pend && f.pend.status === 'pending' && !fumNum) dropOp(f.pend);
        else {
          if (!opts.silent && !confirm('¿El control pasó la reinspección? Se cierra la ' + (fumNum ? 'FUM N° ' + fumNum : 'FUM') + '.')) return false;
          var res = st === 'ap' ? 'Reinspección AP' : 'No aplica';
          queueFum(reg, it, fumNum ? { accion: 'cerrar', num: fumNum, resultado: res, fecha: today() } : { accion: 'cerrar', ref: f.pend.id, resultado: res, fecha: today() });
        }
      }
      if (st === 'na') {
        patch = { estado: '', fecha: 'NA', resp: it.resp || me };
      } else {
        patch = { estado: st.toUpperCase(), resp: it.resp || me };
        if (!/^\d{4}-\d{2}-\d{2}$/.test(it.fecha)) patch.fecha = today();
        var doc = docDefault(reg) || it.documento;
        if (doc) {
          var ds = docStatus({ documento: doc, estado: '', fecha: '' });
          if (ds && ds.level === 'old' && !opts.silent &&
              confirm('El plano ' + ds.code + ' R' + ds.used + ' está superado: rige la R' + ds.latest +
                (ds.fecha ? ' (recibida el ' + fmtDate(ds.fecha) + ')' : '') + '.\n\n¿Actualizar el plano del registro a la revisión vigente? Se aplica a todos los controles pendientes.')) {
            doc = docUpgrade(doc);
            setRegDoc(reg, doc);
          }
          if (doc !== it.documento) patch.documento = doc;
        }
        if (needsSerial(it.instrumento) && instrMemo(it.instrumento)) patch.instrumento = instrMemo(it.instrumento);
      }
    }
    editItem(reg, off, patch);
    return true;
  }

  /* ---------- Ajustes ---------- */
  function renderWho() {
    renderTop('¿Quién sos?', 'Se usa para completar RESP.');
    var rs = datos().responsables;
    view.innerHTML = '<div class="list">' + rs.map(function (r) {
      return '<button class="row" data-act="who" data-abrev="' + esc(r.abrev) + '"><span class="num">' + esc(r.abrev) + '</span><span class="grow"><b>' + esc(r.nombre) + '</b></span>' +
        (S.settings.inspector === r.abrev ? '<span class="chip ap">actual</span>' : '') + '</button>';
    }).join('') + '</div>' + (rs.length ? '' : '<div class="empty">Descargá las planillas primero.</div>');
  }

  function renderSettings() {
    renderTop('Ajustes', 'Conexión, usuario y envíos pendientes');
    var me = datos().responsables.filter(function (r) { return r.abrev === S.settings.inspector; })[0];
    var html = '';
    html += '<h2 class="sec">Usuario</h2><button class="row" data-act="go" data-to="/quien"><span class="num">' + esc(S.settings.inspector || '?') + '</span><span class="grow"><b>' +
      esc(me ? me.nombre : 'Elegir responsable') + '</b><span class="small muted">Se completa en la columna RESP. al marcar</span></span><span class="chev">›</span></button>';

    html += '<h2 class="sec">Envíos pendientes · ' + S.queue.length + '</h2>';
    if (!S.queue.length) {
      html += '<div class="card pad small muted">No hay cambios sin enviar.</div>';
    } else {
      html += '<div class="card">' + S.queue.map(function (o) {
        var cat = category(o.sheet);
        var what = o.op === 'create' ? 'Nuevo registro: ' + (o.header.elemento || 'sin elemento')
          : o.op === 'photo' ? 'Foto: ' + String(o.criterio || '').slice(0, 60)
          : o.op === 'fum' ? 'FUM ' + (o.num || '') + ' · ' + ({ abrir: 'abrir', cerrar: o.resultado === 'Anulada' ? 'anular' : 'cerrar', editar: 'editar' }[o.accion] || o.accion) + (o.criterio ? ': ' + String(o.criterio).slice(0, 50) : '')
          : 'Cambios en ' + (o.elemento || (o.ref ? 'registro nuevo' : 'fila ' + o.h));
        var n = Object.keys(o.items || {}).length;
        return '<div class="op"><div class="grow"><b class="small">' + esc(what) + '</b><div class="tiny muted">' + esc(o.sheet + ' · ' + (cat ? cat.titulo : '')) + ' · ' + n + ' control' + (n === 1 ? '' : 'es') + ' · ' + esc(ago(o.createdAt)) + '</div>' +
          (o.status === 'error' ? '<div class="note err" style="margin:6px 0 0">' + esc(o.error || 'Error') + '</div>' : '') + '</div>' +
          (o.status === 'error' ? '<button class="btn tiny" data-act="retry" data-id="' + esc(o.id) + '">Reintentar</button>' : '') +
          '<button class="btn tiny danger" data-act="discard" data-id="' + esc(o.id) + '">Descartar</button></div>';
      }).join('') + '</div>';
    }

    html += '<h2 class="sec">Datos</h2><div class="card pad"><div class="small">Última actualización: <b>' + esc(ago(S.lastSync)) + '</b>' +
      (S.lastError ? '<div class="note err" style="margin:8px 0 0">' + esc(S.lastError) + '</div>' : '') + '</div><div class="spacer"></div>' +
      '<button class="btn primary block" data-act="sync" data-full="1">Sincronizar y descargar todo</button></div>';

    if (MODE === 'pwa') {
      html += '<h2 class="sec">Conexión con la planilla</h2><form id="cfgForm" class="card pad">' +
        '<label class="f"><span>URL de la API (web app de Apps Script)</span><input class="in" name="apiUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(S.settings.apiUrl) + '"></label>' +
        '<label class="f"><span>Clave de acceso</span><input class="in" name="token" type="password" value="' + esc(S.settings.token) + '"></label>' +
        '<button class="btn primary block" type="submit">Guardar y probar</button></form>';
      html += '<h2 class="sec">Instalar</h2><div class="card pad small">' +
        (window.__piePrompt ? '<button class="btn primary block" data-act="install">Instalar en este celular</button>' :
          'Android/Chrome: menú ⋮ → <b>Instalar app</b>. iPhone/Safari: compartir → <b>Agregar a inicio</b>. Una vez instalada abre sin señal.') + '</div>';
    } else {
      html += '<h2 class="sec">Modo sin conexión</h2><div class="card pad small">' +
        (MODE === 'sidebar' ? 'Estás en el panel de la planilla.' : 'Estás usando la web app de Apps Script: si perdés señal podés seguir cargando mientras la página quede abierta y se envía sola al volver la conexión.') +
        ' Para abrir la app <b>sin señal desde cero</b>, usá la versión instalable (PWA) — ver README.</div>';
      if (MODE === 'webapp') {
        html += '<h2 class="sec">Clave de acceso</h2><form id="cfgForm" class="card pad"><label class="f"><span>Clave</span><input class="in" name="token" type="password" value="' + esc(S.settings.token) + '"></label>' +
          '<button class="btn primary block" type="submit">Guardar</button></form>';
      }
    }
    html += '<p class="tiny muted" style="text-align:center;margin-top:24px">PIE · Carga v' + APP_VERSION + ' · modo ' + MODE + '</p>';
    view.innerHTML = html;
  }

  /* ================================================================
   *  Eventos
   * ================================================================ */
  document.addEventListener('click', function (ev) {
    if (ev.target.id === 'modal') return closeModal();
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var a = el.dataset.act;
    var reg;
    if (a === 'back') return back();
    if (a === 'go') return nav(el.dataset.to);
    if (a === 'sync') return sync({ full: true, manual: true }).then(function (ok) { if (ok) toast('Sincronizado'); });
    if (a === 'tab') { S.ui.tab[el.dataset.sheet] = el.dataset.tab; return render(); }
    if (a === 'who') {
      S.settings.inspector = el.dataset.abrev; saveSettings();
      toast('Listo: ' + el.dataset.abrev);
      return back();
    }
    if (a === 'install' && window.__piePrompt) { window.__piePrompt.prompt(); window.__piePrompt = null; return; }
    if (a === 'discard') {
      if (!confirm('¿Descartar este cambio sin enviarlo a la planilla?')) return;
      S.queue = S.queue.filter(function (o) {
        var drop = o.id === el.dataset.id || o.ref === el.dataset.id;
        if (drop && o.img) { KV.del(o.img); delete S.thumbs[o.id]; }
        return !drop;
      });
      saveQueue(); return render();
    }
    if (a === 'retry') {
      S.queue.forEach(function (o) { if (o.id === el.dataset.id) { o.status = 'pending'; o.error = ''; } });
      saveQueue(); return sync({ manual: true });
    }
    if (a === 'closemodal' || (a === 'modalbg')) return closeModal();
    if (a === 'doccat' && picker) {
      picker.cat = el.dataset.cat;
      [].forEach.call(el.parentNode.children, function (b) { b.classList.toggle('on', b === el); });
      return renderDocList();
    }
    if ((a === 'pickdoc' || a === 'pickfree') && picker) {
      var val = a === 'pickfree' ? picker.q.trim() : docRef(fodDocs()[Number(el.dataset.i)]);
      var cb = picker.onPick;
      closeModal();
      return cb(val);
    }
    if (a === 'rmphoto') {
      var po = S.queue.filter(function (o) { return o.id === el.dataset.id; })[0];
      if (!po || po.status === 'sending') return;
      if (!confirm('¿Quitar esta foto? Todavía no se subió.')) return;
      S.queue.splice(S.queue.indexOf(po), 1);
      KV.del(po.img); delete S.thumbs[po.id];
      saveQueue();
      return render({ keepScroll: true });
    }
    if (a === 'docpick') {
      var target = el.dataset.target;
      var mm = /^\/c\/([^/]+)\//.exec(S.route);
      return openDocPicker(function (val) {
        if (target === 'new') {
          var f = document.getElementById('newForm');
          if (f) f.documento.value = val;
        } else if (target === 'default' || target === 'defaultAdd') {
          var rg0 = getReg(mm[1], el.dataset.key);
          if (rg0) {
            var cur0 = docDefault(rg0);
            var nv = target === 'defaultAdd' && cur0 ? cur0 + ' // ' + val : val;
            var n0 = setRegDoc(rg0, nv);
            render({ keepScroll: true });
            toast('Plano del registro: ' + nv + (n0 ? ' · aplicado a ' + n0 + ' control' + (n0 === 1 ? '' : 'es') : ''), 4000);
          }
          return;
        } else {
          var rg = getReg(mm[1], el.dataset.key);
          if (rg) { editItem(rg, Number(el.dataset.off), { documento: val }); refreshItem(rg, Number(el.dataset.off)); }
        }
        toast('Documento: ' + val);
      });
    }
    if (a === 'fold') { S.ui.folded[el.dataset.k] = !S.ui.folded[el.dataset.k]; return render({ keepScroll: true }); }
    if (a === 'nextpend') {
      // el próximo control pendiente debajo de lo que se está viendo (si no hay, el primero)
      var all = [].slice.call(document.querySelectorAll('.item.pend'));
      var top = 70;
      var nx = all.filter(function (x) { return x.getBoundingClientRect().top > top + 10; })[0] || all[0];
      if (!nx) {
        // puede estar en una etapa plegada: desplegar todo y reintentar
        Object.keys(S.ui.folded).forEach(function (k) { S.ui.folded[k] = false; });
        render({ keepScroll: true });
        nx = document.querySelector('.item.pend');
      }
      if (nx) {
        window.scrollTo({ top: window.scrollY + nx.getBoundingClientRect().top - top, behavior: 'smooth' });
        nx.classList.remove('hl'); void nx.offsetWidth; nx.classList.add('hl');
      }
      return;
    }
    if (a === 'gofum') {
      S.ui.open[el.dataset.key + ':' + el.dataset.off] = true;
      S.ui.focus = Number(el.dataset.off);
      return nav('/c/' + el.dataset.sheet + '/r/' + el.dataset.key);
    }
    if (a === 'goto') {
      google.script.run.irA(el.dataset.sheet, Number(el.dataset.row));
      return;
    }
    var m = /^\/c\/([^/]+)\//.exec(S.route);
    var sheet = m && m[1];
    if (el.dataset.key && sheet) reg = getReg(sheet, el.dataset.key);
    if (a === 'filter') { S.ui.filter[el.dataset.key] = el.dataset.f; return render({ keepScroll: true }); }
    if (a === 'hdr') { S.ui.open['hdr:' + el.dataset.key] = !S.ui.open['hdr:' + el.dataset.key]; return render({ keepScroll: true }); }
    if (!reg) return;
    var off = Number(el.dataset.off);
    if (a === 'mark') {
      if (!S.settings.inspector) { toast('Primero elegí quién sos'); return nav('/quien'); }
      if (markItem(reg, off, el.dataset.st) === false) return;
      if (S.ui.filter[reg.key] && S.ui.filter[reg.key] !== 'all') return render({ keepScroll: true });
      refreshItem(reg, off);
      updateStageChips(reg);
      return;
    }
    if (a === 'more') { var k = reg.key + ':' + off; S.ui.open[k] = !S.ui.open[k]; return refreshItem(reg, off); }
    if (a === 'clear') {
      editItem(reg, off, { estado: '', fecha: '', resp: '', fum: '', obs: '' });
      return refreshItem(reg, off);
    }
    if (a === 'docupdall') {
      var nd = docUpgrade(docDefault(reg) || '');
      var n = setRegDoc(reg, nd);
      toast('Plano actualizado a ' + nd + (n ? ' en ' + n + ' control' + (n === 1 ? '' : 'es') + ' pendiente' + (n === 1 ? '' : 's') : ''), 4000);
      return render({ keepScroll: true });
    }
    if (a === 'bulk') {
      var pend = reg.items.filter(function (it) { return it.etapa === el.dataset.stage && itemState(it) === 'pend'; });
      if (!S.settings.inspector) { toast('Primero elegí quién sos'); return nav('/quien'); }
      if (!confirm('¿Marcar ' + pend.length + ' controles pendientes de ' + el.dataset.stage + ' como AP con fecha de hoy?')) return;
      pend.forEach(function (it) { markItem(getReg(reg.sheet, reg.key), it.off, 'ap', { silent: true }); });
      return render({ keepScroll: true });
    }
  });

  function updateStageChips(reg) {
    // refresco liviano: re-render completo pero conservando scroll
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.input === 'docq' && picker) { picker.q = el.value; renderDocList(); return; }
    if (el.dataset.input === 'search') { S.ui.search = el.value; var pos = el.selectionStart; renderHome(); var s = view.querySelector('[data-input=search]'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) { /* type=search */ } return; }
    if (el.dataset.input === 'regSearch') {
      S.ui.regSearch[el.dataset.sheet] = el.value;
      var p2 = el.selectionStart;
      render();
      var s2 = view.querySelector('[data-input=regSearch]');
      s2.focus();
      try { s2.setSelectionRange(p2, p2); } catch (e) { /* type=search */ }
      return;
    }

  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.regdoc) {
      var rm = /^\/c\/([^/]+)\//.exec(S.route);
      var rr = rm && getReg(rm[1], el.dataset.key);
      if (rr) {
        var cnt = setRegDoc(rr, el.value);
        if (cnt) toast('Plano aplicado a ' + cnt + ' control' + (cnt === 1 ? '' : 'es'));
        render({ keepScroll: true });
      }
      return;
    }
    if (el.dataset.photo) {
      var pm = /^\/c\/([^/]+)\//.exec(S.route);
      var preg = pm && getReg(pm[1], el.dataset.key);
      if (preg) addPhotos(preg, Number(el.dataset.off), el.files || []);
      el.value = '';
      return;
    }
    var det = el.closest('.det');
    if (!det || !(el.dataset.field || el.dataset.fum)) return;
    var m = /^\/c\/([^/]+)\//.exec(S.route);
    var reg = getReg(m[1], det.dataset.key);
    if (!reg) return;
    var doff = Number(det.dataset.off);
    var dit = reg.items.filter(function (x) { return x.off === doff; })[0];
    if (el.dataset.fum) {
      var ff = {};
      ff[el.dataset.fum] = el.value.trim();
      return editFum(reg, dit, ff);
    }
    if (el.dataset.field === 'instrumento' && needsSerial(dit.instrumento) && !needsSerial(el.value)) {
      LS.set('instr.' + normDoc(dit.instrumento), el.value);   // se recuerda para los próximos controles
    }
    if (el.dataset.field === 'obs') editFum(reg, dit, { obs: el.value.trim() });
    var patch = {};
    patch[el.dataset.field] = el.value.trim();
    editItem(reg, doff, patch);
    if (el.dataset.field === 'instrumento' || el.dataset.field === 'documento') refreshItem(getReg(m[1], det.dataset.key), doff);
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target;
    if (f.id === 'hdrForm') {
      ev.preventDefault();
      var m = /^\/c\/([^/]+)\//.exec(S.route);
      var reg = getReg(m[1], f.dataset.key);
      editHeader(reg, {
        elemento: f.elemento.value.trim(), piso: f.piso.value.trim(), sector: f.sector.value.trim(), etapa: f.etapa.value.trim(),
        responsables: [].slice.call(f.querySelectorAll('select[name=resp]')).map(function (s) { return s.value; })
      });
      S.ui.open['hdr:' + f.dataset.key] = false;
      toast('Encabezado guardado');
      render({ keepScroll: true });
    }
    if (f.id === 'cfgForm') {
      ev.preventDefault();
      if (f.apiUrl) {
        var u = f.apiUrl.value.trim();
        if (u && !/^https:\/\/script\.google\.com\/.*\/exec(\?.*)?$/.test(u)) {
          toast(/docs\.google\.com\/spreadsheets/.test(u)
            ? 'Ese es el enlace de la planilla. Va el de la web app: Apps Script › Implementar › Administrar implementaciones (termina en /exec)'
            : 'La URL tiene que ser la de la web app de Apps Script y terminar en /exec', 7000);
          return;
        }
        S.settings.apiUrl = u;
      }
      S.settings.token = f.token.value.trim();
      saveSettings();
      toast('Probando conexión…');
      sync({ full: true, manual: true }).then(function (ok) { if (ok) { toast('Conectado'); render(); } });
    }
  });

  window.addEventListener('online', function () { renderTop(); sync(); });
  window.addEventListener('offline', function () { renderTop(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__piePrompt = e; });
  setInterval(function () { if (S.queue.some(function (o) { return o.status === 'pending'; }) && navigator.onLine) sync(); }, 120000);

  /* ================================================================
   *  Arranque
   * ================================================================ */
  function boot() {
    // Configuración por enlace: index.html?api=<url>&token=<clave>
    if (MODE === 'pwa') {
      var qs = new URLSearchParams(location.search);
      if (qs.get('api')) { S.settings.apiUrl = qs.get('api'); }
      if (qs.get('token')) { S.settings.token = qs.get('token'); }
      if (qs.get('api') || qs.get('token')) {
        saveSettings();
        try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* noop */ }
      }
      if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) {
        navigator.serviceWorker.register('sw.js').catch(function () { /* sin SW */ });
      }
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
      var r = decodeURIComponent(location.hash.slice(1));
      if (r) S.route = r;
    }
    S.resolved = LS.get('resolved', {});
    Promise.all([KV.get('catalog'), KV.get('queue')]).then(function (v) {
      S.catalog = v[0] || null;
      S.queue = (v[1] || []).map(function (o) { if (o.status === 'sending') o.status = 'pending'; return o; });
      render();
      S.queue.filter(function (o) { return o.op === 'photo'; }).forEach(function (o) {
        KV.get(o.img).then(function (d) { if (d) { S.thumbs[o.id] = d; } });
      });
      if (IN_GAS || navigator.onLine) {
        sync({ full: true }).then(function () {
          if (S.catalog && !S.settings.inspector && S.route === '/') nav('/quien');
        });
      }
    });
  }
  boot();
})();
</script>
</body>
